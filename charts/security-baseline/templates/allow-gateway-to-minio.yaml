# Documented exception: the plain `minio` release is a Bitnami subchart that
# ships no NetworkPolicy of its own (unlike minio-artifacts, whose chart
# version renders one), so its gateway allow lives here in the baseline.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-minio
  namespace: {{ .Values.global.namespace }}
  labels:
    security-policy: allow-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway-system
      ports:
        - protocol: TCP
          port: 9000  # S3 API
