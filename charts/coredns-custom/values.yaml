# Cluster-wide CoreDNS override (kube-system/coredns-custom). The rewrites are
# DATA, not template logic — a new environment adds an entry, nothing else.
# A managed CoreDNS imports the rendered *.override into its server block.
#
# The real rewrites live per-cluster in corednsCustom.{exact,regex}Rewrites in
# values/clusters/<cluster>/argocd/infrastructure.yaml (piped in by the
# argocd-infrastructure Application). Defaults are empty so a bare render is
# tenant-agnostic.

# Exact in-cluster hairpin: a public hostname in-cluster clients can't reach
# (resolves to a LoadBalancer IP with no hairpin) -> the backing Service.
#   - from: cadence-relay.<env>.example.com
#     to: cadence-relay.<client>-<env>.svc.cluster.local
exactRewrites: []

# Wildcard hairpin: an env whose public DNS points somewhere pods can't reach
# (a private-network-only env -> the internal gateway's tailnet IP) -> the
# gateway's in-cluster ClusterIP Service (same listeners/certs, so https URLs
# keep working). Rendered AFTER the exact rewrites, which must win first.
#   - pattern: (.*)\.<env>\.example.com
#     to: nginx-internal-gateway-nginx.nginx-gateway-system.svc.cluster.local
regexRewrites: []
