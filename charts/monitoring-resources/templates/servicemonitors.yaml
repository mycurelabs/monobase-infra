# ServiceMonitors for wrapper-less Bitnami subcharts (postgresql, valkey) whose
# metrics exporters have no chart of their own to ship a ServiceMonitor.
#
# App ServiceMonitors live WITH each app chart (charts/<app>/templates/servicemonitor.yaml
# — hapihub, cadence, app, medley, openmed, medgemma-worker), matching the repo's
# per-app convention. Prometheus selects ServiceMonitors cluster-wide
# (serviceMonitorSelector={}), so those per-app monitors are scraped without any
# special release label.

---
# PostgreSQL ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgresql
  namespace: monitoring
  labels:
    app.kubernetes.io/name: postgresql-monitor
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  namespaceSelector:
    any: true
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics

---
# Valkey (Redis) ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: valkey
  namespace: monitoring
  labels:
    app.kubernetes.io/name: valkey-monitor
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  namespaceSelector:
    any: true
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
