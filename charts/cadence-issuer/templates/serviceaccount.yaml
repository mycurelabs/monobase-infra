{{- if and .Values.enabled .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cadence-issuer.serviceAccountName" . }}
  namespace: {{ include "cadence-issuer.namespace" . }}
  labels:
    {{- include "cadence-issuer.labels" . | nindent 4 }}
{{- end }}
