{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: cadence-issuer
  namespace: {{ include "cadence-issuer.namespace" . }}
  labels:
    {{- include "cadence-issuer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cadence-issuer.selectorLabels" . | nindent 4 }}
{{- end }}
