{{- if .Values.enabled }}
{{- $pgHost := include "cadence-issuer.postgresql.host" . -}}
{{- $db := printf "postgres://%s:$(PGPASS)@%s:%v/%s" (.Values.postgresql.auth.username | default "postgres") $pgHost (.Values.postgresql.port | default 5432) (.Values.postgresql.auth.database | default "cadence_v2") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadence-issuer
  namespace: {{ include "cadence-issuer.namespace" . }}
  labels:
    {{- include "cadence-issuer.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cadence-issuer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cadence-issuer.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cadence-issuer.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cadence-issuer
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # `issuer serve` reads --db via CADENCE_ISSUER_DB and --issuer-key via CADENCE_ISSUER_KEY (env);
        # iss/fleet/kid/addr are args. Serves the OAuth AS (metadata + JWKS + authorize + token + status).
        # --public-url is the in-cluster address the RFC 8414 metadata advertises: the hub (the only party
        # that authorizes against this standalone issuer — boxes use hapihub-as-AS) discovers + reaches its
        # endpoints here. Without it the metadata would advertise the unreachable default http://0.0.0.0.
        args: ["issuer", "serve", "--iss", {{ .Values.iss | quote }}, "--fleet-id", {{ .Values.fleetId | quote }}, "--kid", {{ .Values.kid | quote }}, "--addr", "0.0.0.0:{{ .Values.port }}", "--public-url", {{ printf "http://%s:%v" (.Values.serviceName | default "cadence-issuer") (.Values.port | default 9500) | quote }}]
        env:
        - name: PGPASS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.auth.existingSecret | default "postgresql" }}
              key: postgres-password
        - name: CADENCE_ISSUER_DB
          value: {{ $db | quote }}
        - name: CADENCE_ISSUER_KEY
          valueFrom:
            secretKeyRef:
              name: cadence-issuer-secrets
              key: issuer-key
        - name: RUST_LOG
          value: "cadence=info,warn"
        - name: CADENCE_LOG_FORMAT
          value: "json"
        ports:
        - name: http
          containerPort: {{ .Values.port }}
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /.well-known/jwks.json
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      {{- if .Values.nodePool }}
      nodeSelector:
        node-pool: {{ .Values.nodePool }}
      tolerations:
      - key: "node-pool"
        operator: "Equal"
        value: {{ .Values.nodePool | quote }}
        effect: "NoSchedule"
      {{- end }}
{{- end }}
