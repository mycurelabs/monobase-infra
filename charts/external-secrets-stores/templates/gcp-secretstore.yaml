# GCP Secret Manager ClusterSecretStore
# Provides access to secrets stored in Google Cloud Secret Manager
# Authentication: Service Account Key (works with any Kubernetes cluster)

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secretstore
  labels:
    app.kubernetes.io/name: gcp-secretstore
    app.kubernetes.io/component: external-secrets
spec:
  provider:
    gcpsm:
      # GCP project that holds the Secret Manager secrets. Configured via
      # externalSecrets.gcp.projectId in the cluster's infrastructure.yaml
      # (passed through as gcpProjectID by the argocd-infrastructure Application).
      projectID: {{ .Values.gcpProjectID | default "my-gcp-project" | quote }}

      # Authentication using Service Account Key
      auth:
        secretRef:
          secretAccessKeySecretRef:
            name: gcpsm-secret
            key: secret-access-credentials
            namespace: external-secrets-system
