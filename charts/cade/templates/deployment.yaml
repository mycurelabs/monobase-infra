{{- if .Values.enabled }}
{{- $pgHost := printf "%s.%s.svc.cluster.local" (.Values.postgresql.serviceName | default "postgresql") (include "cade.namespace" .) -}}
{{- $db := printf "postgres://%s:$(PGPASS)@%s:%v/%s" (include "cade.postgresql.username" .) $pgHost (.Values.postgresql.port | default 5432) (include "cade.postgresql.database" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cade
  namespace: {{ include "cade.namespace" . }}
  labels:
    {{- include "cade.labels" . | nindent 4 }}
spec:
  replicas: 1
  # A single addressable anchor identity; roll one-at-a-time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cade.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cade.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get "files/cadence.yaml" | sha256sum }}
    spec:
      serviceAccountName: {{ include "cade.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # Mint the hub's "*" grant into the DB BEFORE the engine starts (`cadence run` fail-closes without a
      # grant). No standalone issuer service: a co-located, one-shot `cadence issuer serve` on loopback signs
      # the grant with the SHARED key (CADENCE_ISSUER_KEY), then dies with this init container. Runtime grant
      # VERIFICATION is against the real AS (hapihub) via CADENCE_ISSUER_URL on the main container.
      initContainers:
      - name: enroll
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -u
            # Start an ephemeral dev-approve AS on loopback (jti audit → throwaway SQLite in /work; codes are
            # in-memory) signing with the shared key, then authorize '*' against it (PKCE + DPoP → grant).
            CADENCE_ISSUER_DB="sqlite:///work/issuer.db" \
              cadence issuer serve --iss "$ISS" --fleet-id "$FLEET_ID" --kid "$KID" \
                --addr 127.0.0.1:9500 --public-url http://127.0.0.1:9500 &
            ISS_PID=$!
            until cadence auth login --db "$CADENCE_DB" --issuer-url http://127.0.0.1:9500 --scope '*'; do
              echo "waiting for local issuer + cadence_v2 DB…"; sleep 3
            done
            kill "$ISS_PID" 2>/dev/null || true
            echo "hub authorized — '*' grant persisted"
        env:
        - name: PGPASS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.auth.existingSecret | default "postgresql" }}
              key: postgres-password
        - name: CADENCE_DB
          value: {{ $db | quote }}
        - name: HOME
          value: /work
        - name: TMPDIR
          value: /work
        - name: CADENCE_ISSUER_KEY
          valueFrom:
            secretKeyRef:
              name: cade-secrets
              key: issuer-key
        - name: ISS
          value: {{ .Values.mint.iss | quote }}
        - name: FLEET_ID
          value: {{ .Values.auth.fleetId | quote }}
        - name: KID
          value: {{ .Values.mint.kid | quote }}
        volumeMounts:
        - name: work
          mountPath: /work
      containers:
      - name: cade
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # Image ENTRYPOINT is `cadence`; run the data-plane engine from the mounted config. Transport +
        # auth + the inline sync live in cadence.yaml; the DB URL (with the secret) comes via CADENCE_DB.
        args: ["run", "--config", "/etc/cadence/cadence.yaml"]
        env:
        - name: PGPASS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.auth.existingSecret | default "postgresql" }}
              key: postgres-password
        - name: CADENCE_DB
          value: {{ $db | quote }}
        # Runtime grant verification — env-driven (env wins over the mounted cadence.yaml). The AS (hapihub)
        # whose JWKS verifies box grants AND the hub's own '*' grant (all signed with the shared key).
        - name: CADENCE_ISSUER_URL
          value: {{ .Values.auth.issuerUrl | quote }}
        - name: CADENCE_GRANT_JWKS_URI
          value: {{ .Values.auth.grantJwksUri | quote }}
        - name: CADENCE_FLEET_ID
          value: {{ .Values.auth.fleetId | quote }}
        - name: RUST_LOG
          value: "cadence=info,warn"
        - name: CADENCE_LOG_FORMAT
          value: "json"
        ports:
        - name: quic
          containerPort: {{ .Values.udpPort }}
          protocol: UDP
        - name: health
          containerPort: {{ .Values.udpPort }}
          protocol: TCP
        - name: api
          containerPort: {{ .Values.apiPort }}
          protocol: TCP
        # No startupProbe needed: cade 2.0.12+ installs triggers (fast DDL) + binds the API BEFORE running
        # the baseline in the background, so /healthz answers immediately even against a large primary DB.
        livenessProbe:
          httpGet:
            path: /healthz
            port: api
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /readyz
            port: api
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/cadence
          readOnly: true
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: cade-config
      # Writable scratch for the enroll initContainer's ephemeral issuer SQLite (readOnlyRootFilesystem).
      - name: work
        emptyDir: {}
      {{- if .Values.nodePool }}
      nodeSelector:
        node-pool: {{ .Values.nodePool }}
      tolerations:
      - key: "node-pool"
        operator: "Equal"
        value: {{ .Values.nodePool | quote }}
        effect: "NoSchedule"
      {{- end }}
{{- end }}
