{{- if .Values.enabled }}
{{- $pgHost := printf "%s.%s.svc.cluster.local" (.Values.postgresql.serviceName | default "postgresql") (include "cade.namespace" .) -}}
{{- $db := printf "postgres://%s:$(PGPASS)@%s:%v/%s" (include "cade.postgresql.username" .) $pgHost (.Values.postgresql.port | default 5432) (include "cade.postgresql.database" .) -}}
{{- $issuerUrl := printf "http://%s:%v" (.Values.issuer.serviceName | default "cadence-issuer") (.Values.issuer.port | default 9500) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cade
  namespace: {{ include "cade.namespace" . }}
  labels:
    {{- include "cade.labels" . | nindent 4 }}
spec:
  replicas: 1
  # A single addressable anchor identity; roll one-at-a-time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cade.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cade.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get "files/cadence.yaml" | sha256sum }}
    spec:
      serviceAccountName: {{ include "cade.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # Enrol the hub against the issuer and persist its "*" grant into cadence_v2 BEFORE the engine starts
      # (`cadence run` fail-closes without a grant). Retries until the issuer + DB are reachable.
      initContainers:
      - name: enroll
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -u
            # cadence 2.x is OAuth-only (the legacy `issuer enroll` + `auth login --code` path was removed):
            # authorize directly against the issuer's dev-approve AS for the "*" scope (PKCE + DPoP → grant).
            until cadence auth login --db "$CADENCE_DB" --issuer-url "$ISSUER_URL" --scope '*'; do
              echo "waiting for issuer ($ISSUER_URL) + cadence_v2 DB…"; sleep 3
            done
            echo "hub authorized — '*' grant persisted"
        env:
        - name: PGPASS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.auth.existingSecret | default "postgresql" }}
              key: postgres-password
        - name: CADENCE_DB
          value: {{ $db | quote }}
        - name: ISSUER_URL
          value: {{ $issuerUrl | quote }}
      containers:
      - name: cade
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # Image ENTRYPOINT is `cadence`; run the data-plane engine from the mounted config. Transport +
        # auth + the inline sync live in cadence.yaml; the DB URL (with the secret) comes via CADENCE_DB.
        args: ["run", "--config", "/etc/cadence/cadence.yaml"]
        env:
        - name: PGPASS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.auth.existingSecret | default "postgresql" }}
              key: postgres-password
        - name: CADENCE_DB
          value: {{ $db | quote }}
        - name: RUST_LOG
          value: "cadence=info,warn"
        - name: CADENCE_LOG_FORMAT
          value: "json"
        ports:
        - name: quic
          containerPort: {{ .Values.udpPort }}
          protocol: UDP
        - name: health
          containerPort: {{ .Values.udpPort }}
          protocol: TCP
        - name: api
          containerPort: {{ .Values.apiPort }}
          protocol: TCP
        # No startupProbe needed: cade 2.0.12+ installs triggers (fast DDL) + binds the API BEFORE running
        # the baseline in the background, so /healthz answers immediately even against a large primary DB.
        livenessProbe:
          httpGet:
            path: /healthz
            port: api
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /readyz
            port: api
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/cadence
          readOnly: true
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: cade-config
      {{- if .Values.nodePool }}
      nodeSelector:
        node-pool: {{ .Values.nodePool }}
      tolerations:
      - key: "node-pool"
        operator: "Equal"
        value: {{ .Values.nodePool | quote }}
        effect: "NoSchedule"
      {{- end }}
{{- end }}
