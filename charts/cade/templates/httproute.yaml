{{- if and .Values.enabled .Values.gateway.enabled }}
# Exposes the hub API (+ /.well-known/cadence-configuration.json bootstrap doc) over HTTPS so external
# boxes can discover this anchor's EndpointId + public_addr via `--seed-url https://cade.<domain>`.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cade
  namespace: {{ include "cade.namespace" . }}
  labels:
    {{- include "cade.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "cade.gateway.name" . }}
      namespace: {{ include "cade.gateway.namespace" . }}
      sectionName: {{ .Values.gateway.sectionName | default "https" }}
  hostnames:
    {{- if .Values.gateway.hostnames }}
    {{- range .Values.gateway.hostnames }}
    - {{ . }}
    {{- end }}
    {{- else }}
    - {{ include "cade.gateway.hostname" . }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: cade
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
