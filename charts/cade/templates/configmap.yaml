{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cade-config
  namespace: {{ include "cade.namespace" . }}
  labels:
    {{- include "cade.labels" . | nindent 4 }}
data:
  # The hub's cadence.yaml — transport + auth + tuning + the inline `sync:` manifest. Kept in lockstep
  # with the mono services/cadence-v2-example-hapihub/cadence.yaml (the sync section is the single source).
  cadence.yaml: |
    {{- .Files.Get "files/cadence.yaml" | nindent 4 }}
{{- end }}
