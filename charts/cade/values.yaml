enabled: true

image:
  repository: ghcr.io/mycurelabs/cadence
  tag: "2.0.1"
  pullPolicy: IfNotPresent

# UDP port the iroh QUIC endpoint binds; the udp-gateway LB forwards it. A TCP listener on the same port
# serves the DO LoadBalancer health check.
udpPort: 6472
# TCP port for the observability + bootstrap API (/healthz, /readyz, /metrics, /.well-known/…).
apiPort: 9464

# Public address the anchor advertises (the udp-gateway LB IP:port) so peers reach it directly by
# EndpointId alone. Must match `public_addr` in the mounted cadence.yaml.
publicAddr: "165.245.145.61:6472"

# Isolated cadence_v2 database (the v2 hub anchors here — legacy cadence is untouched). The PG password
# comes from the existing Bitnami `postgresql` k8s secret (postgres-password); the URL is assembled from
# CADENCE_DB in the deployment.
postgresql:
  serviceName: postgresql
  port: 5432
  auth:
    database: cadence_v2
    username: postgres
    existingSecret: postgresql

# Runtime grant verification — env-driven per env (the deployment sets CADENCE_ISSUER_URL /
# CADENCE_GRANT_JWKS_URI / CADENCE_FLEET_ID from these; env wins over the mounted cadence.yaml, so these
# env-specific URLs are NOT baked into files/cadence.yaml). The AS (hapihub) whose JWKS verifies BOTH box
# grants and the hub's own '*' grant — all signed with one shared key.
auth:
  issuerUrl: ""       # e.g. https://hapihub.<env>.localfirsthealth.com (RFC 8414 → iss + jwks_uri)
  grantJwksUri: ""    # e.g. https://hapihub.<env>.localfirsthealth.com/.well-known/jwks.json (advertised in bootstrap doc)
  fleetId: ""         # required `aud`, e.g. mycure-preprod

# Boot-time self-mint of the hub's '*' grant: the enroll initContainer runs a co-located, one-shot
# `cadence issuer serve` on loopback and authorizes '*' against it — no standalone issuer service. iss/kid
# MUST match the AS (auth) so the minted grant verifies against its JWKS; fleetId reuses auth.fleetId.
mint:
  iss: cadence-preprod-issuer
  kid: k1

# Shared EdDSA signing key for the boot-time mint (the same GCP secret the standalone issuer used) →
# k8s secret `cade-secrets` key `issuer-key`, exposed as CADENCE_ISSUER_KEY to the enroll initContainer.
externalSecrets:
  enabled: false
  secretStore: gcp-secretstore
  secretStoreKind: ClusterSecretStore
  refreshInterval: 1h
  secrets: []

service:
  type: ClusterIP
  port: 9464
  targetPort: 9464
  annotations: {}

# NGINX Gateway HTTPRoute — exposes the API over HTTPS so external boxes can fetch the bootstrap doc
# (/.well-known/cadence-configuration.json) via --seed-url.
gateway:
  enabled: true
  hostname: ""          # defaults to cade.{global.domain}
  hostnames: []
  sectionName: https
  snippetsPolicy:
    enabled: false
    proxyReadTimeout: "3600s"
    clientMaxBodySize: "64m"

serviceAccount:
  create: true
  name: ""
  annotations: {}

# A cadence-v2 data-plane hub carries the ~1.2 GiB iroh/tokio/loro floor — do NOT undersize (the old
# transport-only 64Mi/128Mi was for `peer --accept`). The isolated small DB keeps baseline cheap.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 3Gi

# Schedule onto the pool cadence uses (tainted node-pool=staging on preprod).
nodePool: "staging"
