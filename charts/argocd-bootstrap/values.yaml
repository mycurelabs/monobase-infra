# argocd-bootstrap chart values.
# Renders the two objects that seed GitOps on a cluster:
#   1. infrastructure root Application  -> charts/argocd-infrastructure
#   2. auto-discover ApplicationSet     -> charts/argocd-applications per values/deployments/*.yaml
# Applied by scripts/bootstrap.ts:
#   helm template argocd-bootstrap charts/argocd-bootstrap | kubectl apply -f -
# (kubectl, not helm install: the live objects are kubectl-owned.)

argocd:
  repoURL: https://github.com/mycurelabs/monobase-infra.git
  # HEAD (= main) is correct for every LONG-LIVED cluster (prod, client demos).
  # Override per cluster ONLY for a disposable dev cluster, with a throwaway
  # cluster/<name> branch (vanaheim). docs/architecture/GITOPS-ARGOCD.md.
  targetRevision: HEAD
  namespace: argocd
  clusterServer: https://kubernetes.default.svc

  # Which cluster this bootstrap seeds. Selects the per-cluster infra config
  # under values/clusters/<clusterName>/argocd/. Override per cluster at bootstrap.
  clusterName: aws-main

  # Deployments the auto-discover ApplicationSet picks up (git-generator files).
  # Default: all env overlays EXCEPT staging + preprod + demo (staging/preprod live only on the
  # on-prem vanaheim cluster, whose ArgoCD overrides this list to exactly those
  # two). An exclude MUST be applied to the live DOKS ApplicationSet BEFORE the
  # excluded overlay file lands on main — the git generator globs at HEAD, so a
  # missing exclude auto-deploys the env onto DOKS.
  deploymentPaths:
    - path: "values/deployments/*.yaml"
    - path: "values/deployments/example-*.yaml"
      exclude: true
    - path: "values/deployments/_base/*.yaml"
      exclude: true
    - path: "values/deployments/mycure-staging.yaml"
      exclude: true
    # preprod runs on the local vanaheim cluster (mycure#4135), not DOKS (PR #409).
    - path: "values/deployments/mycure-preprod.yaml"
      exclude: true
    # demo runs on its own public k3d cluster (values/clusters/mycure-contabo-demo).
    - path: "values/deployments/mycure-demo.yaml"
      exclude: true
