# ArgoCD Application: infrastructure root.
# Deploys all cluster-wide infrastructure (cert-manager, gateway, secrets,
# monitoring, backups) from charts/argocd-infrastructure, configured by
# values/clusters/<cluster>/argocd/infrastructure.yaml. One per cluster, seeded at bootstrap;
# everything after that is Git-driven.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: {{ .Values.argocd.namespace | default "argocd" }}
  labels:
    app.kubernetes.io/name: infrastructure
    app.kubernetes.io/component: cluster-infrastructure
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: {{ .Values.argocd.repoURL | required "argocd.repoURL is required" }}
    targetRevision: {{ .Values.argocd.targetRevision | default "HEAD" }}
    path: charts/argocd-infrastructure

    helm:
      releaseName: infrastructure
      valueFiles:
        - ../../values/clusters/{{ .Values.argocd.clusterName | default "aws-main" }}/argocd/infrastructure.yaml
      # Inject repoURL + clusterName (single source of truth). clusterName lets
      # child Applications resolve their own per-cluster valueFiles paths.
      values: |
        argocd:
          repoURL: {{ .Values.argocd.repoURL }}
          targetRevision: {{ .Values.argocd.targetRevision | default "HEAD" }}
        clusterName: {{ .Values.argocd.clusterName | default "aws-main" }}

  destination:
    server: {{ .Values.argocd.clusterServer | default "https://kubernetes.default.svc" }}
    # Infrastructure components create their own namespaces
    namespace: {{ .Values.argocd.namespace | default "argocd" }}

  syncPolicy:
    automated:
      prune: true       # Remove components disabled in values
      selfHeal: true    # Auto-correct drift
      allowEmpty: false

    syncOptions:
      - CreateNamespace=false  # Components create their own namespaces
      - PrunePropagationPolicy=foreground
      - PruneLast=true

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

  # Ignore expected differences
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
