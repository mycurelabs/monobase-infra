# ApplicationSet: auto-discovers client/environment deployments.
#
# Scans values/deployments/*.yaml; each file becomes a root Application
# "<filename>-root" deploying charts/argocd-applications into the namespace
# named after the file. Adding a client = adding one values file.
#
# Inheritance is explicit: `extends: <name>` names a single parent values file
# (merged first, this file wins). `disabled: "true"` makes a file parent-only —
# it never deploys (e.g. base.yaml). Absent keys ⇒ no parent / deployed.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: monobase-auto-discover
  namespace: {{ .Values.argocd.namespace | default "argocd" }}
spec:
  # Go template support for string manipulation
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  # Prevent cascading deletes (safety)
  syncPolicy:
    preserveResourcesOnDeletion: true

  generators:
    # Git files generator: scans the deployment overlays this cluster owns.
    # Driven by argocd.deploymentPaths (values.yaml) so each cluster's ArgoCD
    # discovers only its own set — e.g. the main cluster excludes staging
    # overlays while a separate cluster overrides this to include only staging.
    - git:
        repoURL: {{ .Values.argocd.repoURL | required "argocd.repoURL is required" }}
        revision: {{ .Values.argocd.targetRevision | default "HEAD" }}
        files:
{{- range .Values.argocd.deploymentPaths }}
          - path: {{ .path | quote }}
{{- if .exclude }}
            exclude: true
{{- end }}
{{- end }}
      # `disabled: "true"` files (e.g. base.yaml) are parent-only — the git
      # generator still exposes them as valueFile parents, but this selector
      # keeps them from becoming their own Application. Absent/other ⇒ included.
      selector:
        matchExpressions:
          - key: disabled
            operator: NotIn
            values: ["true"]

  # Template for the root Applications
  template:
    metadata:
      # e.g. <client>-production.yaml -> <client>-production-root
      name: '{{"{{"}} .path.filename | trimSuffix ".yaml" {{"}}"}}-root'
      namespace: {{ .Values.argocd.namespace | default "argocd" }}
      labels:
        client-env: '{{"{{"}} .path.filename | trimSuffix ".yaml" {{"}}"}}'
        managed-by: applicationset
      annotations:
        config-path: '{{"{{"}} .path.path {{"}}"}}/{{"{{"}} .path.filename {{"}}"}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io

    spec:
      project: default

      source:
        repoURL: {{ .Values.argocd.repoURL }}
        targetRevision: {{ .Values.argocd.targetRevision | default "HEAD" }}
        path: charts/argocd-applications

        helm:
          # Explicit parent via `extends: <name>` (single level) merges first;
          # this file wins per key. hasKey guards missingkey=error for files
          # with no parent. Maps deep-merge; arrays replace wholesale.
          ignoreMissingValueFiles: true
          valueFiles:
            # Explicit parent via `extends: <name>` (single level), merged first;
            # this file wins. `hasKey` guards missingkey=error; when `extends` is
            # absent the path resolves to a non-existent file that
            # ignoreMissingValueFiles skips (no parent). Kept as an inline value
            # expression (not a bare {{`{{- if }}`}} line) so the Helm-rendered
            # ApplicationSet is valid YAML.
            - '../../{{"{{"}} .path.path {{"}}"}}/{{"{{"}} if hasKey . "extends" {{"}}"}}{{"{{"}} .extends {{"}}"}}{{"{{"}} else {{"}}"}}_no_parent_{{"{{"}} end {{"}}"}}.yaml'
            - '../../{{"{{"}} .path.path {{"}}"}}/{{"{{"}} .path.filename {{"}}"}}'
          # Inject repoURL (single source of truth)
          values: |
            argocd:
              repoURL: {{ .Values.argocd.repoURL }}
              targetRevision: {{ .Values.argocd.targetRevision | default "HEAD" }}

      destination:
        server: {{ .Values.argocd.clusterServer | default "https://kubernetes.default.svc" }}
        # Namespace matches the filename without extension
        namespace: '{{"{{"}} .path.filename | trimSuffix ".yaml" {{"}}"}}'

      syncPolicy:
        automated:
          prune: true        # Remove resources deleted from Git
          selfHeal: true     # Revert manual changes
          allowEmpty: false  # Prevent accidental empty deploys

        syncOptions:
          - CreateNamespace=true              # Auto-create namespace if missing
          - PrunePropagationPolicy=foreground # Delete in correct order
          - PruneLast=true                    # Prune after new resources are healthy
          # No ServerSideApply here: root apps only manage small child
          # Application manifests (KBs — nowhere near the 256KB last-applied
          # limit SSA exists to dodge), and SSA collides with the sync
          # engine's force path ("--force cannot be used with --server-side"
          # aborts the whole root sync). Client-side apply accepts the force
          # pairing, so root syncs complete.

        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

      # Ignore expected differences
      ignoreDifferences:
        - group: "*"
          kind: "*"
          jsonPointers:
            - /metadata/annotations/meta.helm.sh~1release-name
            - /metadata/annotations/meta.helm.sh~1release-namespace
