{{- if (.Values.loki | default dict).enabled }}
# ArgoCD Application: Loki — log aggregation (the platform's standard log store).
# Sync Wave 1 - after the monitoring stack (wave 0).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    chart: loki
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: {{ .Values.loki.version | default "6.24.0" }}
    helm:
      releaseName: loki
      valuesObject:
        # Single-binary mode for simple deployments.
        # Switch to distributed mode for >1TB/day ingestion.
        deploymentMode: SingleBinary

        singleBinary:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          persistence:
            enabled: true
            storageClass: ""
            size: {{ .Values.loki.storageSize | default "50Gi" }}
            # KEEP the PVC when the StatefulSet is deleted or scaled to 0.
            # The loki 6.24.0 single-binary STS DEFAULTS this to `true`, which
            # renders `persistentVolumeClaimRetentionPolicy: {whenDeleted:
            # Delete, whenScaled: Delete}` — an ArgoCD prune or a scale-to-0
            # would then destroy the log volume. Setting it `false` OMITS the
            # retention-policy block entirely, so K8s falls back to its default
            # `Retain` for both cases (verified by rendering the chart:
            # persistentVolumeClaimRetentionPolicy is absent → Retain).
            # (Round-1 set this on the WRONG path; the correct key for the
            #  single-binary STS is singleBinary.persistence.*, here.)
            enableStatefulSetAutoDeletePVC: false
          extraArgs:
            - -config.expand-env=true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

        loki:
          auth_enabled: false  # single-tenant mode
          # Filesystem storage — the chart still requires bucketNames defined
          # even when type=filesystem (dummy names below).
          storage:
            type: filesystem
            bucketNames:
              chunks: chunks
              ruler: ruler
              admin: admin
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          limits_config:
            # ── ENFORCED disk ceiling ────────────────────────────────────────
            # OSS Loki 3.3.2 (this chart's appVersion) has NO byte/disk-usage
            # cap for the filesystem store — it deletes chunks STRICTLY by the
            # compactor's time retention, never by free space (the WAL
            # `disk_full_threshold` throttle only exists in Loki >= 3.7). The
            # persistence volume is local-path, which does NOT enforce its
            # nominal `size`, and on vanaheim it is carved from the SAME host
            # disk as the preprod + staging Postgres. So the ceiling must come
            # from Loki's OWN admission control, which IS enforced server-side:
            #
            #   worst-case on-disk bytes  <=  ingestion_rate_mb (hard-rejected
            #   above this, per tenant)  x  retention_period  /  chunk compression
            #
            # `ingestion_rate_mb` is a hard reject (429) — it bounds bytes/sec
            # ADMITTED regardless of how much promtail pushes — and the compactor
            # deletes everything past `retention_period`. Together they give a
            # provable upper bound the operator sizes UNDER the volume:
            #
            #   worst-case on-disk = rate_MiBps x 86400 x retention_days
            #                        / ~10 (tsdb gzip) x 1.2 (index+WAL margin)
            #
            # Pick loki.retention / loki.ingestionRateMb in each cluster's values
            # so that worst-case fits UNDER loki.storageSize WITH HEADROOM; NEVER
            # raise the code default up.
            #   e.g. vanaheim (20Gi vol): rate=1 MiB/s, retention=24h ->
            #   1 x 86400 x 1 = 86400 MiB ~= 84.4 GiB raw; /10 x 1.2 ~= 10.1 GiB
            #   worst-case on disk ~= 51% of 20Gi (~9.9 GiB headroom). A sustained
            #   pathological push held at the 1 MiB/s cap for a whole retention
            #   window still lands ~10 GiB — provably inside the vol, not merely
            #   "small in practice". (At 3d retention this was ~253 GiB raw /10
            #   ~= 25 GiB > 20Gi — did NOT fit; that's why vanaheim uses 24h.)
            # BACKSTOP alerting (where monitoring runs — DOKS): the
            # monitoring-resources storage-alerts fire PersistentVolumeFillingUp
            # (>80%) / PersistentVolumeCritical (>90%) on this PVC and
            # NodeFilesystem* (>80/90%) on the shared host disk. vanaheim runs no
            # Prometheus, so there the k3s kubelet nodefs eviction is the last
            # line — hence the deliberately low rate cap + short retention.
            retention_period: {{ .Values.loki.retention | default "14d" }}
            max_query_lookback: {{ .Values.loki.retention | default "14d" }}
            ingestion_rate_mb: {{ .Values.loki.ingestionRateMb | default 4 }}
            ingestion_burst_size_mb: {{ .Values.loki.ingestionBurstMb | default 8 }}
            per_stream_rate_limit: {{ .Values.loki.perStreamRateLimit | default "2MB" | quote }}
            per_stream_rate_limit_burst: {{ .Values.loki.perStreamRateLimitBurst | default "6MB" | quote }}
            max_streams_per_user: 10000
          compactor:
            working_directory: /var/loki/compactor
            retention_enabled: true
            delete_request_store: filesystem
            # Compact + apply retention aggressively so deleted chunks free disk
            # quickly (default delete_delay is 2h) — a shared-volume safety valve.
            compaction_interval: {{ .Values.loki.compactionInterval | default "10m" }}
            retention_delete_delay: {{ .Values.loki.retentionDeleteDelay | default "1h" }}
            retention_delete_worker_count: 50
          commonConfig:
            replication_factor: 1

        # Not needed in single-binary mode.
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0

        # Gateway disabled — Loki is reached in-cluster by promtail + grafana.
        gateway:
          enabled: false

        monitoring:
          selfMonitoring:
            enabled: false

        # loki-canary OFF. The canary is a synthetic-probe DaemonSet (one pod
        # per node, continuously push+query round-trips against Loki) used to
        # measure ingestion latency — pure overhead on a size-constrained
        # single-binary preprod store. In grafana/loki 6.24.0 the EFFECTIVE key
        # is the TOP-LEVEL `lokiCanary.enabled` (NOT `monitoring.lokiCanary.*`,
        # which the chart no longer reads — round-2 set the dead path so the
        # DaemonSet + its Service/ServiceAccount kept rendering). `test.enabled`
        # must also go OFF: templates/validate.yaml `fail`s the render when the
        # canary is disabled while the helm-test hook is enabled. Verified by
        # rendering the chart with this valuesObject: 0 loki-canary resources.
        lokiCanary:
          enabled: false
        test:
          enabled: false

        # ── NetworkPolicy: scope the UNAUTHENTICATED (auth_enabled:false) log
        #    store so ONLY the monitoring-namespace log clients can push/query.
        #    The chart's built-in networkPolicy.* is authored for the
        #    read/write/backend DISTRIBUTED topology (its ingress rule selects
        #    `component In (read,write)`), so it does NOT cover our
        #    `component: single-binary` pod — we ship an explicit policy via
        #    extraObjects instead. Ingress to :3100 (http push+query) and :9095
        #    (grpc) is allowed ONLY from pods in the `monitoring` namespace
        #    (promtail ships logs, grafana queries, loki itself) selected by the
        #    auto-applied `kubernetes.io/metadata.name` namespace label; :7946
        #    (memberlist) is allowed loki→loki for gossip. Everything else in the
        #    cluster is denied — no arbitrary workload can ingest or read logs.
        extraObjects:
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: loki-scoped-ingress
              namespace: monitoring
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: loki
                  app.kubernetes.io/instance: loki
              policyTypes:
                - Ingress
              ingress:
                # Log push (promtail) + query (grafana) — monitoring ns only.
                - from:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: monitoring
                  ports:
                    - protocol: TCP
                      port: 3100
                    - protocol: TCP
                      port: 9095
                # memberlist gossip — loki pod(s) to loki pod(s).
                - from:
                    - podSelector:
                        matchLabels:
                          app.kubernetes.io/name: loki
                          app.kubernetes.io/instance: loki
                  ports:
                    - protocol: TCP
                      port: 7946

        # Sidecar rules OFF. The chart default (sidecar.rules.enabled: true)
        # creates `loki-clusterrole` with cluster-wide get/list/watch on
        # Secrets/ConfigMaps and binds it to the loki ServiceAccount — a
        # standing cluster-wide Secret-read grant on an unauthenticated log
        # store. We ship no rules via ConfigMaps, so disabling it drops the
        # ClusterRole to `rules: []`. (SECURITY_ROADMAP: least privilege.)
        sidecar:
          rules:
            enabled: false

        # Caches OFF — memcached is memory-hungry (chunks-cache defaults to
        # ~9.6Gi, results-cache ~1Gi) and the vanaheim host can't spare ~11Gi
        # for a single-binary preprod log store. SingleBinary reads straight
        # from the filesystem store; a cache in front is pure overhead here.
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 5m
{{- end }}
