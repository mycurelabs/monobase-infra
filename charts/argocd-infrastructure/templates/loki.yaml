{{- if .Values.loki.enabled }}
# ArgoCD Application: Loki — log aggregation (the platform's standard log store).
# Sync Wave 1 - after the monitoring stack (wave 0).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    chart: loki
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: {{ .Values.loki.version | default "6.24.0" }}
    helm:
      releaseName: loki
      valuesObject:
        # Single-binary mode for simple deployments.
        # Switch to distributed mode for >1TB/day ingestion.
        deploymentMode: SingleBinary

        singleBinary:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          persistence:
            enabled: true
            storageClass: ""
            size: {{ .Values.loki.storageSize | default "50Gi" }}
          extraArgs:
            - -config.expand-env=true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

        loki:
          auth_enabled: false  # single-tenant mode
          # Filesystem storage — the chart still requires bucketNames defined
          # even when type=filesystem (dummy names below).
          storage:
            type: filesystem
            bucketNames:
              chunks: chunks
              ruler: ruler
              admin: admin
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          limits_config:
            retention_period: {{ .Values.loki.retention | default "30d" }}
            max_query_lookback: {{ .Values.loki.retention | default "30d" }}
            ingestion_rate_mb: 10
            ingestion_burst_size_mb: 20
            max_streams_per_user: 10000
          compactor:
            working_directory: /var/loki/compactor
            retention_enabled: true
            delete_request_store: filesystem
          commonConfig:
            replication_factor: 1

        # Not needed in single-binary mode.
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0

        # Gateway disabled — Loki is reached in-cluster by promtail + grafana.
        gateway:
          enabled: false

        monitoring:
          selfMonitoring:
            enabled: false
          lokiCanary:
            enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 5m
{{- end }}
