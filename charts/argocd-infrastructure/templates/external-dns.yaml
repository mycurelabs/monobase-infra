{{- if .Values.externalDNS.enabled }}
# ArgoCD Application: external-dns
# Sync Wave 1 - Deploy DNS automation after Gateway (depends on Gateway API CRDs)

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: {{ .Values.argocd.repoURL }}
    targetRevision: {{ .Values.argocd.targetRevision }}
    path: charts/external-dns
    helm:
      releaseName: external-dns
      valueFiles:
        - ../../values/clusters/{{ required "clusterName is required — set it in values/clusters/<cluster>/argocd/infrastructure.yaml (the infra root injects it; there is deliberately NO default so a missing value hard-fails instead of silently retargeting a non-existent cluster dir)" .Values.clusterName }}/argocd/external-dns.yaml
  
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # PSA floor: plain controller, no privileged pods.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m
{{- end }}
