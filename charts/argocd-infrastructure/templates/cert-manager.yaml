{{- if .Values.certManager.enabled }}
# ArgoCD Application: cert-manager
# Sync Wave 0 - Deploy TLS certificate automation (cluster-wide)

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    targetRevision: {{ .Values.certManager.version | default "v1.14.2" }}
    helm:
      releaseName: cert-manager
      valuesObject:
        installCRDs: true
        global:
          leaderElection:
            namespace: cert-manager

        # Enable Gateway API support for HTTP-01 challenges
        # In v1.15+, use --enable-gateway-api flag via extraArgs
        extraArgs:
          - --enable-gateway-api

        # Resource limits for cert-manager components
        # Actual usage: controller=39Mi, cainjector=89Mi, webhook=18Mi
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

        # Ops plane (cert-manager/ESO/external-dns/ArgoCD/gateway) rides the
        # tainted infra pool, separated from preprod.
        {{- include "argocd-infrastructure.infraPlacement" . | nindent 8 }}

        cainjector:
          {{- include "argocd-infrastructure.infraPlacement" . | nindent 10 }}
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi

        webhook:
          {{- include "argocd-infrastructure.infraPlacement" . | nindent 10 }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

        # One-shot startupapicheck job: same pool so it isn't blocked if nonprod
        # is ever full during an install/upgrade.
        startupapicheck:
          {{- include "argocd-infrastructure.infraPlacement" . | nindent 10 }}
  
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # PSA floor: plain controllers, no privileged pods.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m
{{- end }}
