# Egress to an Ollama on the tailnet, via the Tailscale operator (cluster
# egress). This chart owns the `tailscale` namespace: PSA=privileged because
# the operator's proxy pods need NET_ADMIN (app namespaces are restricted).
namespace: tailscale
# MagicDNS name of the Ollama host — survives tailnet IP changes. Set the real
# host per-cluster via ollamaEgress.tailnetFqdn in the cluster infrastructure.yaml.
tailnetFqdn: ollama.example.ts.net
port: 11434
