{{- if and .Values.enabled .Values.networkPolicy.enabled }}
# Medley NetworkPolicy — scoped ingress + egress (monobase-infra#420).
#
# NetworkPolicies are ADDITIVE: securityBaseline.strictGatewayIngress dropping the
# blanket gateway allow does NOT cancel a permissive per-app policy, so this policy
# must itself be least-privilege. Prior revisions permitted ingress on 8970 from
# EVERY namespace, broad cross-namespace egress, and 0.0.0.0/0:11434 (Ollama) —
# all removed here.
#
#   INGRESS: only the NGINX gateway data plane (global.gateway.namespace) may reach
#            medley:8970. Medley is ClusterIP-only; its real callers arrive via the
#            gateway HTTPRoute backend (see httproute.yaml). Kubelet health probes
#            (httpGet :8970) originate host-local and are exempt on the cluster CNI,
#            same as every port-scoped app policy already in prod. Extra client
#            selectors can be appended via networkPolicy.extraIngress.
#   EGRESS:  DNS (kube-dns, UDP+TCP 53) + the specific PostgreSQL primary medley
#            connects to (same-namespace podSelector, gated on postgresql.enabled)
#            + the intended Ollama destination only (ollamaEgress — a pinned ipBlock
#            CIDR for a host/external endpoint, or a namespaceSelector for an
#            in-cluster one). Optional in-cluster dependency ports (hapihub /
#            medgemma-worker / openmed) are opt-in via networkPolicy.inClusterEgress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "medley.fullname" . }}
  namespace: {{ include "medley.namespace" . }}
  labels:
    {{- include "medley.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "medley.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml .Values.networkPolicy.policyTypes | nindent 4 }}
  ingress:
    # NGINX Gateway Fabric data plane → medley:8970. Required once
    # securityBaseline.strictGatewayIngress drops the blanket gateway allow.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "global.gateway.namespace is required for the medley netpol ingress rule" .Values.global.gateway.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    {{- with .Values.networkPolicy.extraIngress }}
    # Additional client selectors (e.g. specific namespaces/pods) — default empty.
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # DNS resolution (CoreDNS/kube-dns in kube-system). UDP + TCP 53.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dns.namespace }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.postgresql.enabled }}
    # The specific PostgreSQL primary medley's DATABASE_URL points at (same namespace).
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.postgresql.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgresql.port | default 5432 }}
    {{- end }}
    {{- with .Values.networkPolicy.inClusterEgress }}
    # Optional in-cluster dependencies (hapihub / medgemma-worker / openmed) — opt-in.
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.networkPolicy.ollamaEgress.enabled }}
    # Ollama (medical-AI inference) — the ONE intended destination, pinned.
    {{- if .Values.networkPolicy.ollamaEgress.cidr }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.ollamaEgress.cidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.ollamaEgress.port }}
    {{- else if .Values.networkPolicy.ollamaEgress.namespaceSelector }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ollamaEgress.namespaceSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.ollamaEgress.port }}
    {{- end }}
    {{- end }}
{{- end }}
