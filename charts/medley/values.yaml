# Default values for Medley chart
# Override these values in values/deployments/*.yaml

global:
  domain: example.com
  namespace: example-prod
  environment: production
  gateway:
    name: shared-gateway
    namespace: gateway-system
  storage:
    provider: ""
    className: ""

enabled: true

replicaCount: 1

image:
  repository: ghcr.io/mycurelabs/medley
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 8970
  targetPort: 8970
  annotations: {}

# Gateway: disabled — medley is ClusterIP only, no public HTTPRoute
gateway:
  enabled: false
  hostname: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: 8970
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: 8970
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - medley
          topologyKey: kubernetes.io/hostname

# Application configuration (ConfigMap)
# Secrets (e.g. MEDLEY_HISTORY_KEY) are mounted via externalSecrets below.
config:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: "8970"
  HAPIHUB_URL: ""
  OLLAMA_URL: ""       # Set to secured external GPU Ollama endpoint
  MEDGEMMA_URL: ""
  OPENMED_URL: ""
  MEDLEY_CHAT_MODEL: ""
  MEDLEY_CORS_ORIGINS: ""

# Shared PostgreSQL (medley 2.x): its own `medley` database on the shared bitnami instance. When enabled,
# DATABASE_URL is built in the Deployment from the in-cluster postgres secret (password stays out of git),
# mirroring the cadence/hapihub pattern. medley 1.x (sqlite) leaves this disabled → no DATABASE_URL env.
postgresql:
  enabled: false
  serviceName: postgresql-primary
  port: 5432
  auth:
    username: postgres
    database: medley
    existingSecret: postgresql
    secretKey: postgres-password
  # Dedicated non-superuser role provisioning (monobase-infra#420 item 7). When
  # enabled, a PreSync Job creates/owns the `medley` role + database and the
  # runtime DATABASE_URL points at it (set auth.username: medley + the scoped
  # secret). Default OFF: the chart still works with the plain superuser DSN
  # where a scoped role hasn't been provisioned. Runs as the in-cluster
  # superuser (superuserSecret), never with the runtime medley credentials.
  provisionRole:
    enabled: false
    # superuserSecret/superuserSecretKey: the in-cluster PG superuser used to
    # CREATE ROLE + reassign ownership (NOT the runtime medley DSN).
    superuserSecret: postgresql
    superuserSecretKey: postgres-password
    # statementTimeout / idleInTransactionTimeout: safety caps on the runtime role.
    statementTimeout: "60s"
    idleInTransactionTimeout: "120s"
    backoffLimit: 3
    activeDeadlineSeconds: 600

# External Secrets — MEDLEY_HISTORY_KEY pulled from GCP Secret Manager
externalSecrets:
  enabled: true
  secretStore: ""      # Defaults to <namespace>-secretstore
  refreshInterval: 1h
  secrets: []          # Override in deployment values with MEDLEY_HISTORY_KEY entry

# Network Policy — least-privilege by default (monobase-infra#420).
# NetworkPolicies are ADDITIVE, so these defaults must themselves be tight: no
# all-namespace ingress, no 0.0.0.0/0 egress. The template (networkpolicy.yaml)
# renders: gateway-only ingress on service.targetPort, DNS egress, same-namespace
# PostgreSQL egress (when postgresql.enabled), the pinned Ollama destination, and
# any opt-in in-cluster dependency egress. Override the specifics per environment
# in values/deployments/*.yaml (e.g. ollamaEgress.cidr, extra client selectors).
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  # DNS: CoreDNS/kube-dns lives in kube-system on both k3d and DOKS.
  dns:
    namespace: kube-system
  # PostgreSQL primary selector (same namespace as medley). Matches the Bitnami
  # postgresql primary pod labels; egress only rendered when postgresql.enabled.
  postgresql:
    podSelector:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/component: primary
  # ollamaEgress: the SINGLE intended Ollama destination. Default OFF — set in the
  # deployment overlay. Pin EITHER an external/host endpoint (cidr, e.g. the k3d
  # host gateway 172.21.0.1/32) OR an in-cluster one (namespaceSelector). Never
  # 0.0.0.0/0.
  ollamaEgress:
    enabled: false
    cidr: ""                 # e.g. "172.21.0.1/32" for the k3d host Ollama
    namespaceSelector: {}    # OR in-cluster: e.g. {kubernetes.io/metadata.name: tailscale}
    port: 11434
  # extraIngress: additional client from-selectors appended to the gateway rule
  # (default empty — gateway is the only ingress). Use to allow specific extra
  # namespaces/pods that legitimately call medley:8970.
  extraIngress: []
  # inClusterEgress: opt-in egress to in-cluster medley dependencies (hapihub /
  # medgemma-worker / openmed). Default empty — preprod uses the host Ollama only
  # and leaves these disabled. Scope by namespaceSelector/podSelector + port.
  inClusterEgress: []

serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics
