{{- /*
One ExternalSecret per entry in .Values.databases (values.yaml). Each syncs a
Bitnami DB/cache credential from GCP Secret Manager into the K8s Secret its
consumers reference by name (secretName). GCP key = {secretPrefix|namespace}-{remoteSuffix}.

`enabledFrom: <key>` gates an entry on a forwarded top-level toggle (minio ->
.Values.minio.enabled) so disabled stores don't fetch a nonexistent GCP key;
entries without it always render. minio-artifacts is a separate template
(dual secrets + a provisioning-user payload).
*/ -}}
{{- range $db := .Values.databases }}
{{- $enabled := true }}
{{- if hasKey $db "enabledFrom" }}{{ $enabled = (index $.Values $db.enabledFrom).enabled }}{{- end }}
{{- if $enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $db.secretName }}-credentials
  namespace: {{ $.Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ $db.secretName }}-credentials
    app.kubernetes.io/component: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secretstore
    kind: ClusterSecretStore
  target:
    name: {{ $db.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{- range $f := $db.fields }}
        {{ $f.k8sKey }}: {{ printf "\"{{ .%s }}\"" $f.var }}
        {{- end }}
  data:
    {{- range $f := $db.fields }}
    - secretKey: {{ $f.var }}
      remoteRef:
        key: {{ $.Values.global.secretPrefix | default $.Values.global.namespace }}-{{ $f.remoteSuffix }}
    {{- end }}
{{- end }}
{{- end }}
