{{- /*
wal-g (PostgreSQL WAL archiving / PITR) object-store credentials.

Deliberately NOT part of the generic `.Values.databases` loop: that loop builds
its GCP key as {secretPrefix|namespace}-{remoteSuffix} and cannot address a
*shared*, non-namespaced key or select a property within it. The Spaces
credential is one account-wide key (`monobase-digitalocean-spaces`) with
`access_key` / `secret_key` properties — the same key Velero's BSL consumes.

Consumed by postgresql.primary.extraEnvVars as AWS_ACCESS_KEY_ID /
AWS_SECRET_ACCESS_KEY so `archive_command` can push WAL segments off-cluster.

ORDERING IS LOAD-BEARING: this Secret must exist before `archive_mode = on`
reaches the primary. Without it every archive_command invocation fails,
PostgreSQL stops recycling WAL, pg_wal grows unbounded and the database
eventually halts. database-secrets is sync-wave 1 and postgresql is wave 2, but that does NOT
guarantee the Secret has MATERIALISED first: ArgoCD assigns ExternalSecret
health `None` (no resource.customizations for external-secrets.io), so wave 1
completes as soon as the CR is applied, not when ESO writes the Secret.
The real safety comes from the consuming env vars using secretKeyRef WITHOUT
`optional: true` — if the Secret is missing, kubelet returns
CreateContainerConfigError and retries, so PostgreSQL never starts with
archive_mode=on and no credentials. It self-heals once ESO syncs.
*/ -}}
{{- if .Values.walg }}
{{- if .Values.walg.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgresql-walg
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: postgresql-walg
    app.kubernetes.io/component: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secretstore
    kind: ClusterSecretStore
  target:
    name: postgresql-walg
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: {{ `"{{ .spacesAccessKey }}"` }}
        AWS_SECRET_ACCESS_KEY: {{ `"{{ .spacesSecretKey }}"` }}
  data:
    - secretKey: spacesAccessKey
      remoteRef:
        key: {{ .Values.walg.remoteKey | default "monobase-digitalocean-spaces" }}
        property: access_key
    - secretKey: spacesSecretKey
      remoteRef:
        key: {{ .Values.walg.remoteKey | default "monobase-digitalocean-spaces" }}
        property: secret_key
{{- end }}
{{- end }}
