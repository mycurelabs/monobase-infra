# Default values for database-secrets chart
# These are overridden by parent application values

global:
  namespace: example
  domain: example.com
  environment: production
  # GCP Secret Manager key prefix. Defaults to the namespace so keys look like
  # "{namespace}-postgresql-password". Override (e.g. to "mycure-production")
  # when a deployment needs to reuse another environment's DB secrets — useful
  # for ephemeral prod-mirror envs that restore real data and must decrypt it
  # with the original credentials.
  secretPrefix: ""

# MinIO credentials ExternalSecret toggle. Forwarded from the deployment values
# by the database-secrets ArgoCD Application. Default off: the secret is only
# synced where MinIO is actually enabled (preprod/demo); prod uses GCS.
minio:
  enabled: false

# Least-privilege DB role split toggle (monobase-mycure#4147). Forwarded from the
# deployment values. Default off: the postgresql-app-roles secret is only
# synced where the split is enabled (the GCP keys don't exist elsewhere).
roleSplit:
  enabled: false

# DB/cache credential ExternalSecrets, rendered by templates/externalsecret.yaml.
# secretName + k8sKey are the CONTRACT the Bitnami charts + app consumers read by
# name (e.g. postgresql.auth.existingSecret: postgresql, key postgres-password) —
# keep them in lockstep with those references. var is the intermediate ESO
# secretKey; the GCP key resolves to {secretPrefix|namespace}-{remoteSuffix}.
# enabledFrom gates an entry on a forwarded toggle (see minio above).
databases:
  - secretName: postgresql
    fields:
      - {var: postgresPassword, k8sKey: postgres-password, remoteSuffix: postgresql-password}
      - {var: postgresReplicationPassword, k8sKey: postgres-replication-password, remoteSuffix: postgresql-replication-password}
  - secretName: valkey
    fields:
      - {var: valkeyPassword, k8sKey: valkey-password, remoteSuffix: valkey-password}
  - secretName: minio
    enabledFrom: minio   # gated on .Values.minio.enabled (prod uses GCS)
    fields:
      - {var: minioRootUser, k8sKey: root-user, remoteSuffix: minio-root-user}
      - {var: minioRootPassword, k8sKey: root-password, remoteSuffix: minio-root-password}
  # monobase-mycure#4147 least-privilege split roles. Separate entry (NOT fields on
  # `postgresql`): the databases array is chart-global, and adding keys there
  # would make every env's postgresql ExternalSecret fail on the missing GCP
  # keys. Passwords must be URL-safe (hex) — DATABASE_URI does no urlencoding.
  - secretName: postgresql-app-roles
    enabledFrom: roleSplit   # gated on .Values.roleSplit.enabled
    fields:
      - {var: migratorPassword, k8sKey: migrator-password, remoteSuffix: postgresql-migrator-password}
      - {var: appRwPassword, k8sKey: app-rw-password, remoteSuffix: postgresql-app-rw-password}
      - {var: cadencePassword, k8sKey: cadence-password, remoteSuffix: postgresql-cadence-password}
