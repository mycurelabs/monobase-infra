# Application factory for pass-through app charts: each registry entry maps a
# deployment-values key to charts/<name> with wholesale valuesObject
# passthrough + global injection. Apps with bespoke value wiring keep dedicated
# templates: postgresql, valkey, minio, minio-artifacts, mailpit, hapihub,
# hapihub-worker, namespace, security-baseline, database-secrets.
#
# The registry is code, not config — template-local so a deployment values
# file cannot override it.
{{- $apps := list
  (dict "name" "cadence"          "key" "cadence")
  (dict "name" "cadence-relay"    "key" "cadenceRelay")
  (dict "name" "hapihub-docs"     "key" "hapihub-docs" "chart" "app")
  (dict "name" "medgemma-worker"  "key" "medgemmaWorker")
  (dict "name" "medley"           "key" "medley")
  (dict "name" "medleyapp"        "key" "medleyapp" "chart" "app")
  (dict "name" "mycure"           "key" "mycure" "chart" "app")
  (dict "name" "mycure-dashboard" "key" "mycure-dashboard" "chart" "app")
  (dict "name" "mycurelocal"      "key" "mycurelocal" "chart" "app")
  (dict "name" "mycure-myaccount" "key" "mycure-myaccount" "chart" "app")
  (dict "name" "mycure-pxp"       "key" "mycure-pxp" "chart" "app")
  (dict "name" "nocodb"           "key" "nocodb")
  (dict "name" "openmed"          "key" "openmed")
}}
{{- $root := . }}
{{- range $app := $apps }}
{{- $vals := index $root.Values $app.key | default dict }}
{{- if $vals.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $root.Values.global.namespace }}-{{ $app.name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    path: charts/{{ $vals.chart | default $app.chart | default $app.name }}
    repoURL: {{ $root.Values.argocd.repoURL }}
    targetRevision: {{ $root.Values.argocd.targetRevision | default "main" }}
    helm:
      releaseName: {{ $app.name }}
      valuesObject:
        {{- toYaml $vals | nindent 8 }}
        global: {{ $root.Values.global | toYaml | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $root.Values.global.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 5m
{{- end }}
{{- end }}
