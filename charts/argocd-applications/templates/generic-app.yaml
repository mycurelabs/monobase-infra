# Application factory for pass-through app charts: each registry entry maps a
# deployment-values key to charts/<name> with wholesale valuesObject
# passthrough + global injection. Apps with bespoke value wiring keep dedicated
# templates: postgresql, valkey, minio, minio-artifacts, mailpit, hapihub,
# hapihub-worker, namespace, security-baseline, database-secrets.
#
# The registry is values-driven so a values-only fork lists its OWN apps (tenant
# app identity lives in values/, not the shared engine). Set `appRegistry` in
# values/deployments/base.yaml; each entry: {name, key, [chart]}. `chart` falls
# back to the app name. Apps with bespoke value wiring keep dedicated templates
# (listed above) and are NOT registry entries.
{{- $root := . }}
{{- $apps := $root.Values.appRegistry | default list }}
{{- range $app := $apps }}
{{- $vals := index $root.Values $app.key | default dict }}
{{- if $vals.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $root.Values.global.namespace }}-{{ $app.name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    path: charts/{{ $vals.chart | default $app.chart | default $app.name }}
    repoURL: {{ $root.Values.argocd.repoURL }}
    targetRevision: {{ $root.Values.argocd.targetRevision | default "main" }}
    helm:
      releaseName: {{ $app.name }}
      valuesObject:
        {{- toYaml $vals | nindent 8 }}
        global: {{ $root.Values.global | toYaml | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $root.Values.global.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 5m
{{- end }}
{{- end }}
