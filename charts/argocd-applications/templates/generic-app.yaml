# Application factory for pass-through app charts: each registry entry maps a
# deployment-values key to charts/<name> with wholesale valuesObject
# passthrough + global injection. Apps with bespoke value wiring keep dedicated
# templates: postgresql, valkey, minio, minio-artifacts, mailpit, hapihub,
# hapihub-worker, namespace, security-baseline, database-secrets.
#
# The registry is values-driven so a values-only fork lists its OWN apps (tenant
# app identity lives in values/, not the shared engine). Set `appRegistry` in
# values/deployments/base.yaml as a MAP: `<appName>: {key, [chart]}`. The map key
# is the Application name; `key` is the deployment-values key holding the app's
# config (which MUST exist as a map in base.yaml — at minimum `<key>.enabled:
# false` for an app that is off everywhere; a dangling/typo key fails the render);
# `chart` falls back to the app name. It is a MAP (not a list) so overlays
# DEEP-MERGE into it — a list would REPLACE the whole registry, silently dropping
# every other app (helm rc=0), the root would then prune them + finalizers cascade.
# Apps with bespoke value wiring keep dedicated templates (listed above) and are
# NOT registry entries.
{{- $root := . }}
{{- /*
  Fail-closed guard: a missing / empty / mis-shaped (list/scalar) appRegistry
  MUST abort the render, never render zero Applications. Rendering nothing is the
  exact silent-prune failure mode we are defending against on prod.
*/}}
{{- if or (not $root.Values.appRegistry) (kindIs "invalid" $root.Values.appRegistry) (not (kindIs "map" $root.Values.appRegistry)) }}
{{- fail "appRegistry missing/empty/not a map: expected values/deployments/base.yaml to define `appRegistry` as a MAP of <appName>: {key, [chart]}. Refusing to render zero Applications (that would prune every generic app on sync)." }}
{{- end }}
{{- range $name, $app := $root.Values.appRegistry }}
{{- if kindIs "invalid" $app }}
{{- fail (printf "appRegistry entry %q is null. To remove an app set `<key>.enabled: false` or delete the entry in base.yaml — a null entry is refused (it would silently drop the Application)." $name) }}
{{- end }}
{{- if not (kindIs "map" $app) }}
{{- fail (printf "appRegistry entry %q must be a map {key, [chart]}, got %s." $name (kindOf $app)) }}
{{- end }}
{{- if not $app.key }}
{{- fail (printf "appRegistry entry %q is missing required `key` (the deployment-values key holding its config)." $name) }}
{{- end }}
{{- /*
  Fail-closed on a DANGLING key. A misspelled / nonexistent `key` used to resolve
  to an empty dict (`| default dict`) → `enabled` falsy → the Application was
  SILENTLY SKIPPED, and with root prune + child finalizers that cascade-deletes
  the app's live resources. So the config value MUST exist and be a map: every
  registry entry's `key` has a config block in values/deployments/base.yaml (at
  minimum `<key>.enabled: false` for an app that is off everywhere). A typo now
  ABORTS the render instead of dropping an app.
*/}}
{{- if not (hasKey $root.Values $app.key) }}
{{- fail (printf "appRegistry entry %q references config key %q, but no such value exists (typo? every registry `key` must have a block in values/deployments/base.yaml — set `%s.enabled: false` for an app that is off). Refusing to silently drop the Application." $name $app.key $app.key) }}
{{- end }}
{{- $vals := index $root.Values $app.key }}
{{- if not (kindIs "map" $vals) }}
{{- fail (printf "appRegistry entry %q references config key %q, which is %s, not a map. Expected a config block like `%s: {enabled: ...}`." $name $app.key (kindOf $vals) $app.key) }}
{{- end }}
{{- if $vals.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $root.Values.global.namespace }}-{{ $name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    path: charts/{{ $vals.chart | default $app.chart | default $name }}
    repoURL: {{ $root.Values.argocd.repoURL }}
    targetRevision: {{ $root.Values.argocd.targetRevision | default "main" }}
    helm:
      releaseName: {{ $name }}
      valuesObject:
        {{- toYaml $vals | nindent 8 }}
        global: {{ $root.Values.global | toYaml | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $root.Values.global.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 5m
{{- end }}
{{- end }}
