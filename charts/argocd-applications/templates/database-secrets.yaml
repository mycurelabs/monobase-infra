# ArgoCD Application: Database Secrets
# Deploys ExternalSecrets for database credentials (PostgreSQL, MinIO)
# Sync Wave 1 - Deploy secrets before databases

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.global.namespace }}-database-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: database-secrets
    app.kubernetes.io/component: external-secrets
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: {{ .Values.argocd.repoURL }}
    targetRevision: {{ .Values.argocd.targetRevision }}
    path: charts/database-secrets
    helm:
      releaseName: database-secrets
      valuesObject:
        global:
          namespace: {{ .Values.global.namespace }}
          domain: {{ .Values.global.domain }}
          environment: {{ .Values.global.environment }}
          secretPrefix: {{ .Values.global.secretPrefix | default "" | quote }}
        # Forward minio.enabled so the chart can skip the minio-credentials
        # ExternalSecret where MinIO is disabled (e.g. prod uses GCS, no GCP key).
        minio:
          enabled: {{ if .Values.minio }}{{ .Values.minio.enabled | default false }}{{ else }}false{{ end }}
        # Forward minio-artifacts.enabled so the minio-artifacts-credentials
        # ExternalSecret is only created where the artifacts store runs (prod).
        minioArtifacts:
          enabled: {{ if (index .Values "minio-artifacts") }}{{ (index .Values "minio-artifacts").enabled | default false }}{{ else }}false{{ end }}
        {{- /*
          Forward walg.enabled so the postgresql-walg ExternalSecret (Spaces
          credentials for WAL archiving / PITR) is only created where archiving
          is switched on. Sync wave 1 puts this ahead of the postgresql
          Application (wave 2), but that does NOT guarantee the Secret has
          materialised: ArgoCD gives ExternalSecret health `None`, so the wave
          completes on apply rather than on ESO writing the Secret. The hard
          dependency is the non-optional secretKeyRef in the PG pod — a missing
          Secret yields CreateContainerConfigError and a retry, so PostgreSQL
          never starts with archive_mode=on and no credentials.

          Emitted ONLY when the overlay defines `walg`, so overlays that have
          not opted in render byte-identical to before and their Application is
          not marked OutOfSync.
        */}}
        {{- if .Values.walg }}
        walg:
          enabled: {{ .Values.walg.enabled | default false }}
          {{- if .Values.walg.remoteKey }}
          remoteKey: {{ .Values.walg.remoteKey | quote }}
          {{- end }}
        {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.global.namespace }}

  syncPolicy:
    automated:
      prune: true       # Remove ExternalSecrets when disabled
      selfHeal: true    # Auto-correct configuration drift
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m

  # Ignore expected differences
  ignoreDifferences:
    # ExternalSecret fields auto-populated by ESO operator
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.target.deletionPolicy
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
