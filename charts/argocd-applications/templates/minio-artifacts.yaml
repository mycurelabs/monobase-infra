{{- if (index .Values "minio-artifacts") }}
{{- if (index .Values "minio-artifacts").enabled }}
# ArgoCD Application: Artifacts Store (public-read MinIO)
# Serves desktop-app release artifacts + Tauri auto-updater manifests at
# artifacts.localfirsthealth.com. DEDICATED instance (not the per-client
# `minio`) because this bucket is PUBLIC-read and global, so it must not share
# an endpoint with the private monobase-files store.
# Sync Wave 2 - Deploy storage before applications.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.global.namespace }}-minio-artifacts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  ignoreDifferences:
  - group: ""
    kind: ServiceAccount
    jsonPointers:
    - /secrets
    - /imagePullSecrets
  - group: ""
    kind: ConfigMap
    jqPathExpressions:
    - .data

  sources:
    # Source 1: Bitnami MinIO Helm chart (dedicated artifacts instance)
    - chart: minio
      repoURL: https://charts.bitnami.com/bitnami
      targetRevision: 14.x.x
      helm:
        releaseName: minio-artifacts
        valuesObject:
          fullnameOverride: minio-artifacts
          global:
            security:
              allowInsecureImages: true
          image:
            repository: {{ (index .Values "minio-artifacts").image.repository | default "bitnamilegacy/minio" }}
            tag: {{ (index .Values "minio-artifacts").image.tag | default "2025.7.23-debian-12-r3" }}
          # The provisioning Job's os-shell init container defaults to
          # docker.io/bitnami/os-shell, which 404s since Bitnami moved images to
          # bitnamilegacy/ (Aug 2025). Point it at the legacy mirror.
          # Chart 14.10.5 reads `volumePermissions.image`; newer 14.x renamed it to
          # `defaultInitContainers.volumePermissions.image`. Set both so a chart
          # bump within the `14.x.x` range can't reintroduce the broken image.
          volumePermissions:
            image:
              repository: bitnamilegacy/os-shell
          defaultInitContainers:
            volumePermissions:
              image:
                repository: bitnamilegacy/os-shell
          mode: standalone
          statefulset:
            replicaCount: 1
          # Virtual-host addressing: <bucket>.<MINIO_DOMAIN> -> bucket. Lets
          # artifacts.<domain>/<key> serve the `artifacts` bucket with clean
          # paths (no /bucket prefix) while keeping S3 SigV4 writes stable.
          extraEnvVars:
            - name: MINIO_DOMAIN
              value: {{ .Values.global.domain }}
          auth:
            existingSecret: minio-artifacts
          # Single public-read bucket. defaultBuckets creates it; provisioning
          # flips it to anonymous-download (Tauri updater + browser downloads are
          # unauthenticated GETs — no CORS needed, the Rust updater isn't a browser).
          defaultBuckets: artifacts
          # Retention is PUBLISHER-SIDE, not bucket ILM: maestroapp publish.ts prunes
          # to the newest ARTIFACTS_KEEP_RELEASES (=5) version dirs per platform on
          # every release, protecting latest.json + the pinned live build (mono #3316).
          # Do NOT add an `mc ilm` lifecycle rule here — it would double-prune and can
          # delete the very build the publisher deliberately keeps. Steady state ~2.5Gi.
          provisioning:
            enabled: true
            extraCommands:
              - mc mb --ignore-existing provisioning/artifacts
              - mc anonymous set download provisioning/artifacts
            # Least-privilege publisher policy + user for CI. CI authenticates
            # with THIS scoped user (PutObject/GetObject on the artifacts bucket),
            # never the MinIO root creds — so a leaked CI key can't reach admin,
            # other buckets, or delete objects. The password is sourced from the
            # minio-artifacts-ci secret (ExternalSecret), never plaintext in git.
            policies:
              - name: minio-artifacts-publisher
                statements:
                  - effect: "Allow"
                    resources:
                      - "arn:aws:s3:::artifacts"
                    actions:
                      - "s3:ListBucket"
                      - "s3:GetBucketLocation"
                  # Writes prefix-scoped to maestroapp/ — the only publisher today
                  # (verified: every object lives under maestroapp/desktop/<target>/…).
                  # Contains a leaked artifacts-ci key to the app's own prefix so it
                  # can't host arbitrary content under the trusted artifacts.<domain>.
                  # Broaden (or add a statement) when a second app publishes here.
                  # Does NOT stop overwrite-within-maestroapp/ (downgrade/tamper):
                  # MinIO PutObject can't distinguish create-vs-overwrite, and
                  # versioning/WORM needs an erasure-coded backend this standalone
                  # single-drive instance lacks. Install integrity is owned app-side
                  # by the Tauri Ed25519 artifact signature.
                  - effect: "Allow"
                    resources:
                      - "arn:aws:s3:::artifacts/maestroapp/*"
                    actions:
                      - "s3:PutObject"
                      - "s3:GetObject"
                      # DeleteObject enables the publisher's keep-last-N prune
                      # (monobase-mycure#3316) to reclaim old release dirs — the
                      # store has no versioning/lifecycle so nothing else trims
                      # them. Marginal blast-radius: PutObject already lets a
                      # leaked key destroy artifacts by overwrite; delete only
                      # removes vs clobbers. Still prefix-scoped to maestroapp/.
                      - "s3:DeleteObject"
            usersExistingSecrets:
              - minio-artifacts-ci
          persistence:
            enabled: true
            storageClass: {{ (index .Values "minio-artifacts").persistence.storageClass | default "" }}
            size: {{ (index .Values "minio-artifacts").persistence.size | default "10Gi" }}
          resources:
            requests:
              cpu: {{ (index .Values "minio-artifacts").resources.requests.cpu | default "100m" }}
              memory: {{ (index .Values "minio-artifacts").resources.requests.memory | default "256Mi" }}
            limits:
              cpu: {{ (index .Values "minio-artifacts").resources.limits.cpu | default "500m" }}
              memory: {{ (index .Values "minio-artifacts").resources.limits.memory | default "512Mi" }}
          podSecurityContext:
            enabled: true
            fsGroup: 1001
            fsGroupChangePolicy: "OnRootMismatch"
          containerSecurityContext:
            enabled: true
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          {{- if .Values.global.nodePool }}
          nodeSelector:
            node-pool: {{ .Values.global.nodePool }}
          tolerations:
            - key: "node-pool"
              operator: "Equal"
              value: {{ .Values.global.nodePool | quote }}
              effect: "NoSchedule"
          {{- end }}

    # Source 2: HTTPRoute exposing the bucket at artifacts.<domain>
    - repoURL: {{ .Values.argocd.repoURL }}
      path: charts/minio-artifacts-httproute
      targetRevision: {{ .Values.argocd.targetRevision | default "main" }}
      helm:
        releaseName: minio-artifacts-httproute
        valuesObject:
          hostname: {{ (index .Values "minio-artifacts").gateway.hostname | default (printf "artifacts.%s" .Values.global.domain) }}
          namespace: {{ .Values.global.namespace }}
          minioDomain: {{ .Values.global.domain }}
          gateway:
            name: {{ .Values.global.gateway.name }}
            namespace: {{ .Values.global.gateway.namespace }}
            sectionName: {{ (index .Values "minio-artifacts").gateway.sectionName | default "https-lfh" }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.global.namespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 5m
        factor: 2
{{- end }}
{{- end }}
