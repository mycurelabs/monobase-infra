{{- if .Values.minio.enabled }}
# ArgoCD Application: MinIO Object Storage
# Sync Wave 2 - Deploy storage before applications

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.global.namespace }}-minio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Ignore benign drift from Kubernetes auto-modifications
  ignoreDifferences:
  - group: ""
    kind: ServiceAccount
    jsonPointers:
    - /secrets
    - /imagePullSecrets
  - group: ""
    kind: ConfigMap
    jqPathExpressions:
    - .data

  sources:
    # Source 1: Bitnami MinIO Helm chart
    - chart: minio
      repoURL: https://charts.bitnami.com/bitnami
      targetRevision: 14.x.x
      helm:
        releaseName: minio
        valuesObject:
          global:
            security:
              allowInsecureImages: true
          image:
            repository: {{ .Values.minio.image.repository | default "bitnamilegacy/minio" }}
            tag: {{ .Values.minio.image.tag | default "2025.7.23-debian-12-r3" }}
          mode: {{ .Values.minio.mode | default "standalone" }}
          statefulset:
            replicaCount: {{ .Values.minio.statefulset.replicaCount | default 1 }}
          auth:
            {{- if .Values.minio.auth.existingSecret }}
            existingSecret: {{ .Values.minio.auth.existingSecret }}
            {{- else }}
            rootUser: {{ .Values.minio.auth.rootUser | default "minioadmin" }}
            rootPassword: {{ .Values.minio.auth.rootPassword | default "minioadmin" }}
            {{- end }}
          persistence:
            enabled: {{ .Values.minio.persistence.enabled | default true }}
            storageClass: {{ .Values.minio.persistence.storageClass | default "" }}
            size: {{ .Values.minio.persistence.size | default "10Gi" }}
          resources:
            requests:
              cpu: {{ .Values.minio.resources.requests.cpu | default "100m" }}
              memory: {{ .Values.minio.resources.requests.memory | default "256Mi" }}
            limits:
              cpu: {{ .Values.minio.resources.limits.cpu | default "500m" }}
              memory: {{ .Values.minio.resources.limits.memory | default "512Mi" }}
          defaultBuckets: {{ .Values.minio.defaultBuckets | default "monobase-files" }}
          {{- with .Values.minio.auditArchive }}
          {{- if .enabled }}
          # #3484 cold-archive bucket for pruned audit_events rows. Created WITH
          # object-lock (WORM) + versioning at creation and a default COMPLIANCE
          # retention — pruned audit history stays immutable for the HIPAA window
          # even after it leaves the live table. Object-lock CANNOT be added after
          # creation, hence provisioning (not defaultBuckets).
          # FLAG for human review: this per-client MinIO runs `mode: standalone`
          # (single drive). Verify object-lock + versioning actually hold on this
          # topology before relying on it for compliance — the artifacts-store note
          # (charts/argocd-applications/templates/minio-artifacts.yaml) claims WORM
          # needs an erasure-coded backend. If it doesn't hold, move this bucket to a
          # distributed MinIO pool or an external object-lock store.
          provisioning:
            enabled: true
            extraCommands:
              - mc mb --with-lock --ignore-existing provisioning/{{ .bucket | default "audit-archive" }}
              - mc retention set --default COMPLIANCE {{ .retention | default "6y" | quote }} provisioning/{{ .bucket | default "audit-archive" }}
          {{- end }}
          {{- end }}
          podSecurityContext:
            enabled: true
            fsGroup: 1001
            fsGroupChangePolicy: "OnRootMismatch"
          containerSecurityContext:
            enabled: true
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          {{- if .Values.global.nodePool }}
          # Node pool scheduling - inherited from global.nodePool
          nodeSelector:
            node-pool: {{ .Values.global.nodePool }}
          tolerations:
            - key: "node-pool"
              operator: "Equal"
              value: {{ .Values.global.nodePool | quote }}
              effect: "NoSchedule"
          {{- end }}

    {{- if .Values.minio.gateway.enabled }}
    # Source 2: HTTPRoute for Gateway API integration
    - repoURL: {{ .Values.argocd.repoURL }}
      path: charts/minio-httproute
      targetRevision: {{ .Values.argocd.targetRevision | default "main" }}
      helm:
        releaseName: minio-httproute
        valuesObject:
          hostname: {{ .Values.minio.gateway.hostname | default (printf "storage.%s" .Values.global.domain) }}
          namespace: {{ .Values.global.namespace }}
          gateway:
            name: {{ .Values.global.gateway.name }}
            namespace: {{ .Values.global.gateway.namespace }}
    {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.global.namespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 5m
        factor: 2
{{- end }}
