{{- /*
  Gated on BOTH hapihub.enabled and hapihubWorker.enabled — the
  worker is a derivative of the hapihub release and meaningless
  without it. `(default dict)` keeps nil-safe on deployments that omit
  either block.
*/ -}}
{{- if and ((.Values.hapihub | default dict).enabled) ((.Values.hapihubWorker | default dict).enabled) }}
# ArgoCD Application: HapiHub Worker (background jobs off the API pods)
#
# Second Helm release of the hapihub chart. Runs the SAME image/config as
# the hapihub API release but exists solely to consume pg-boss jobs (exports,
# email, document ingestion, PDF conversion): RUN_WORKERS=true here and
# RUN_WORKERS=false on the API release (mono#2114 — a single export/PDF
# job landing on an API pod ballooned it to the memory limit; job memory
# must not evict request-serving pods).
#
# Values = deep-merge of the hapihub block with the small hapihubWorker
# override block, so image bumps and config changes to hapihub flow to the
# worker automatically. Overrides disable all traffic-facing extras
# (gateway/HTTPRoute, prune cronjob, HPA) — the worker gets a Service and
# probes only.
#
# Sync wave 3, alongside the hapihub API release.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.global.namespace }}-hapihub-worker
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    path: charts/hapihub
    repoURL: {{ .Values.argocd.repoURL }}
    targetRevision: {{ .Values.argocd.targetRevision | default "main" }}
    helm:
      releaseName: hapihub-worker
      valuesObject:
        {{- $base := omit .Values.hapihub "minio" "valkey" "mailpit" }}
        {{- $overrides := omit .Values.hapihubWorker "enabled" }}
        {{- $merged := mergeOverwrite (deepCopy $base) $overrides }}
        {{- /* roleSplit's PreSync Jobs (provision-db-roles, migrate) must run ONCE,
             from the API release only. The worker is a SECOND release against the
             SAME database in a SEPARATE, independently-syncing Application, so if an
             overlay sets hapihub.roleSplit.enabled the worker would arm its own
             copies — two concurrent `hapihub migrate` runs racing the drizzle ledger
             (out-of-order rows silently skip migrations, unrecoverable) plus two
             adoption passes contending on ALTER TABLE OWNER locks. Force them off
             structurally so no overlay can arm them (mono#4147 stage-2). Explicit
             false, not key-drop — the templates gate on `ne … false` because sprig
             `default true` re-enables an absent value. Injected only when roleSplit
             is on, so prod (no roleSplit) renders byte-identical. */ -}}
        {{- if (($merged.roleSplit) | default dict).enabled }}
        {{- $merged = mergeOverwrite $merged (dict "roleSplit" (dict "provision" (dict "enabled" false) "migrateJob" (dict "enabled" false))) }}
        {{- end }}
        {{- toYaml $merged | nindent 8 }}
        global: {{ .Values.global | toYaml | nindent 10 }}
        minio: {{ mergeOverwrite (deepCopy .Values.minio) (.Values.hapihub.minio | default dict) | toYaml | nindent 10 }}
        valkey: {{ mergeOverwrite (deepCopy .Values.valkey) (.Values.hapihub.valkey | default dict) | toYaml | nindent 10 }}
        mailpit: {{ mergeOverwrite (deepCopy .Values.mailpit) (.Values.hapihub.mailpit | default dict) | toYaml | nindent 10 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.global.namespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 5m
{{- end }}
