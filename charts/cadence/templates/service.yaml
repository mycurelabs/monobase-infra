{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: cadence
  namespace: {{ include "cadence.namespace" . }}
  labels:
    {{- include "cadence.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: api
  selector:
    {{- include "cadence.selectorLabels" . | nindent 4 }}
{{- end }}
