{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cadence-config
  namespace: {{ include "cadence.namespace" . }}
  labels:
    {{- include "cadence.labels" . | nindent 4 }}
data:
  # The hub's cadence.yaml — transport + auth + tuning + the inline `sync:` manifest. Kept in lockstep
  # with the mono services/hapihub/cadence.yaml (the sync section is the single source).
  cadence.yaml: |
    {{- tpl (.Files.Get "files/cadence.yaml") . | nindent 4 }}
{{- end }}
