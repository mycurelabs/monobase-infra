enabled: true

image:
  repository: ghcr.io/mycurelabs/cadence
  tag: "2.0.1"
  pullPolicy: IfNotPresent

# UDP port the iroh QUIC endpoint binds; the udp-gateway LB forwards it. A TCP listener on the same port
# serves the DO LoadBalancer health check.
udpPort: 6472
# TCP port for the observability + bootstrap API (/healthz, /readyz, /metrics, /.well-known/…).
apiPort: 9464

# Public address the anchor advertises (the udp-gateway LB IP:port) so peers reach it directly by
# EndpointId alone. Must match `public_addr` in the mounted cadence.yaml.
publicAddr: "165.245.145.61:6472"

# Self-hosted relay URL. Set per-env to point the anchor (and, via the bootstrap doc, hard-NAT boxes) at
# the cadence-relay LB instead of n0's public relays. Empty ⇒ n0 relays (RelayMode::custom off).
relayUrl: ""

# Isolated cadence_v2 database (the v2 hub anchors here — legacy cadence is untouched). The PG password
# comes from the existing Bitnami `postgresql` k8s secret (postgres-password); the URL is assembled from
# CADENCE_DB in the deployment.
postgresql:
  serviceName: postgresql
  port: 5432
  auth:
    database: cadence_v2
    username: postgres
    existingSecret: postgresql

# hapihub is the sole AS + grant minter — env-driven per env (the deployment sets CADENCE_ISSUER_URL /
# CADENCE_GRANT_JWKS_URI / CADENCE_FLEET_ID / CADENCE_AUTH_AUTHORIZE_URL from these; env wins over the
# mounted cadence.yaml, so these env-specific URLs are NOT baked into files/cadence.yaml).
auth:
  issuerUrl: ""       # e.g. https://hapihub.<env>.localfirsthealth.com (RFC 8414 → iss + jwks_uri)
  grantJwksUri: ""    # e.g. https://hapihub.<env>.localfirsthealth.com/.well-known/jwks.json (advertised in bootstrap doc)
  fleetId: ""         # required `aud`, e.g. mycure-preprod
  authorizeUrl: ""    # programmatic authorize for the headless hub enroll, e.g. https://hapihub.<env>…/sync/authorize

# Service-account API key (non-expiring better-auth key) the enroll initContainer presents to hapihub as
# --bearer to authorize the hub's '*' grant → k8s secret `cadence-secrets` key `sa-api-key` → CADENCE_AUTH_BEARER.
externalSecrets:
  enabled: false
  secretStore: gcp-secretstore
  secretStoreKind: ClusterSecretStore
  refreshInterval: 1h
  secrets: []

service:
  type: ClusterIP
  port: 9464
  targetPort: 9464
  annotations: {}

# Prometheus scrape of the OpenMetrics /metrics endpoint (needs the prometheus-operator ServiceMonitor CRD).
# Off by default; enable per-env.
serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics

# NGINX Gateway HTTPRoute — exposes the API over HTTPS so external boxes can fetch the bootstrap doc
# (/.well-known/cadence-configuration.json) via --seed-url.
gateway:
  enabled: true
  hostname: ""          # defaults to cadence.{global.domain}
  hostnames: []
  sectionName: https
  snippetsPolicy:
    enabled: false
    proxyReadTimeout: "3600s"
    clientMaxBodySize: "64m"

serviceAccount:
  create: true
  name: ""
  annotations: {}

# A cadence data-plane hub carries the ~1.2 GiB iroh/tokio/loro floor — do NOT undersize (the old
# transport-only 64Mi/128Mi was for `peer --accept`). The isolated small DB keeps baseline cheap.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 3Gi

# Schedule onto the pool cadence uses (tainted node-pool=staging on preprod).
nodePool: "staging"
