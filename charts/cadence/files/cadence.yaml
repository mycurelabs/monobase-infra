# cadence HUB (anchor) config — shared across environments; per-env values are templated in
# (the configmap renders this via `tpl`, so `{{ .Values.publicAddr }}` resolves per deployment).
# Rendered into a ConfigMap by charts/cadence and read via `cadence run --config`. Transport + auth + tuning
# here; the sync manifest is inline as `sync:` (kept in lockstep with the mono
# services/hapihub/cadence.yaml). The DB URL is injected at runtime via CADENCE_DB
# (holds the PG password from the ExternalSecret) — never templated into this file.

# db: injected via CADENCE_DB env (postgres://…/cadence_v2) — do NOT set here (keeps the secret out of git).
seed_url: []                        # a hub has no upstream seed (it is the anchor)
seed: []
accept: true                        # anchor: accept inbound + bind the fixed port
listen_port: 6472
public_addr: {{ .Values.publicAddr }}    # per-env udp-gateway LB (values.cadence.publicAddr) — peers reach this hub directly by EndpointId
mdns: false
api_addr: 0.0.0.0:9464              # observability API + bootstrap discovery doc (/.well-known/…)
alpn: hapihub/2                     # app boundary: gates catch-up + namespaces gossip topics

auth:
  # 2.x is OAuth: the AS is discovered via RFC 8414 from issuer_url (→ iss + jwks_uri). issuer_url,
  # grant_jwks_uri and fleet_id are ENV-SPECIFIC, so they are NOT set here (this file is mounted verbatim,
  # not templated) — the deployment injects them via CADENCE_ISSUER_URL / CADENCE_GRANT_JWKS_URI /
  # CADENCE_FLEET_ID (env wins over this file). The hub verifies box grants + its own '*' grant against the
  # AS's JWKS (all share one signing key). Only env-agnostic knobs stay here:
  jwks_refresh_secs: 300
  min_iat: 0                        # revocation wall (unix secs; 0 = off)

# Engine timing + reconcile tuning. Every key defaults to its production value (shown) — omit the whole
# `tuning:` block to take all defaults, or list just the keys you want to change.
tuning:
  capture_every_secs: 1
  reconcile_every_secs: 30
  retention_secs: 604800            # 7d — load-bearing: MUST exceed max peer offline duration
  gc_every_secs: 3600
  reroute_every_secs: 300
  schema_check_every_secs: 60
  reconcile_peers_max: 1
  seed_reconcile_every: 1
  log_format: text                  # or "json" for the k8s aggregator
  # Anchor on the full hapihub DB: materialize a scope's rows only when a box declares it (on admit),
  # instead of eager-baselining all ~15M rows of all orgs at startup. Manifest-derived per-scope filter
  # (cadence 2.0.14, #2727). The hub serves a handful of test orgs, not the whole tenant set.
  lazy_baseline: true

# The sync manifest, inline — the ONLY place collections are supplied (there is no separate manifest
# file). Auto-enumerated from the prod `hapihub` DB schema (every real application table), scope inferred
# per-table:
#   - cadence.yml scope_columns where the table is listed there (authoritative),
#   - else inferred from the row's columns (org: facility>organization>warehouse, insurance OR-lists;
#     user: uid/user_id/owner/created_by/by_uid/account/author),
#   - else the entry is COMMENTED OUT (no scope column found — confirm/cherry-pick).
# Trailing `# blacklist` marks tables cadence.yml does NOT sync (kept here for review). Excluded entirely
# (not collections): _bak_* snapshots, *_history/_archive, migration/changelog/cadence-internal tables.
# routable `org`; a non-routable `user` tag resolves to org topics via organization_members.
sync:
  routable:
    - org
    - fam                                    # per-cluster family topic (org neighborhood, e.g. clinic branches)
  resolve_via:
    - [user, organization_members, org]
    # A patient's `facility` resolves to `fam:<clusterKey>` via the org's own `cluster`
    # (= COALESCE(parent, id)), so a whole 2-level org family shares ONE topic. Only the
    # collections carrying a `famsrc` tag (medical_patients, personal_details) fan across the
    # family — everything else stays scoped to its single owning org (per-collection).
    - [famsrc, organizations, fam]
  collections:
    - name: account_configurations
      tags:
        - { ty: user, field: uid }
    - name: account_invitations
      tags:
        - { ty: user, field: created_by }
    - name: account_onboarding
      tags:
        - { ty: user, field: id }
    - name: accounts
      tags:
        - { ty: user, field: id }
    - name: action_codes
      tags:
        - { ty: org, field: organization }
    - name: billing_coupons
      tags:
        - { ty: org, field: organization }
    - name: billing_customers
      tags:
        - { ty: user, field: owner }
    - name: billing_expenses
      tags:
        - { ty: org, field: facility }
    - name: billing_invoice_agts
      tags:
        - { ty: org, field: facility }
    - name: billing_invoices
      tags:
        - { ty: org, field: organization }
    - name: billing_items
      tags:
        - { ty: org, field: facility }
    - name: billing_legacy_invoices
      tags:
        - { ty: org, field: facility }
    - name: billing_merchants
      tags:
        - { ty: user, field: owner }
    - name: billing_payment_methods
      tags:
        - { ty: org, field: organization }
    - name: billing_payments
      tags:
        - { ty: org, field: facility }
    - name: billing_prices
      tags:
        - { ty: org, field: organization }
    - name: billing_products
      tags:
        - { ty: org, field: organization }
    - name: billing_promos
      tags:
        - { ty: org, field: organization }
    - name: billing_return_transactions
      tags:
        - { ty: org, field: organization }
    - name: billing_soas
      tags:
        - { ty: org, field: facility }
    - name: billing_tax_rates
      tags:
        - { ty: org, field: organization }
    - name: billing_void_transactions
      tags:
        - { ty: org, field: organization }
    - name: booking_events
      tags:
        - { ty: org, field: organization }
    - name: booking_exceptions
      tags:
        - { ty: user, field: owner }
    - name: bookings
      tags:
        - { ty: org, field: organization }
    - name: clocks
      tags:
        - { ty: org, field: organization }
    - name: diagnostic_analyzers
      tags:
        - { ty: org, field: facility }
    - name: diagnostic_measures
      tags:
        - { ty: org, field: facility }
    - name: diagnostic_order_tests
      tags:
        - { ty: org, field: facility }
    - name: diagnostic_order_tests_history
      priority: 20   # *_history bulk: baseline/catch-up LAST, after current-state (order only, still converges)
      tags:
        - { ty: org, field: facility }
    - name: diagnostic_order_tests_reports
      tags:
        - { ty: org, field: organization }
    - name: diagnostic_orders
      tags:
        - { ty: org, field: facility }
    - name: diagnostic_packages
      tags:
        - { ty: org, field: facility }
    - name: diagnostic_tests
      tags:
        - { ty: org, field: facility }
    - name: file_links
      tags:
        - { ty: org, field: organization }
    - name: fixtures
      tags:
        - { ty: org, field: organization }
    - name: form_templates
      tags:
        - { ty: org, field: facility }
    - name: insurance_contracts
      tags:
        - { ty: org, field: insured }
        - { ty: org, field: insurer }
        - { ty: org, field: insured_organization }
    - name: insurance_coverages
      tags:
        - { ty: org, field: insured }
        - { ty: org, field: insurer }
    - name: insurance_loas
      tags:
        - { ty: org, field: organization }
    - name: inventory_configurations
      tags:
        - { ty: org, field: organization }
        - { ty: famsrc, field: organization }   # + family topic: shared product-catalog config across the org family
    - name: inventory_products
      tags:
        - { ty: org, field: warehouse }
    - name: inventory_stock_configurations
      tags:
        - { ty: org, field: organization }
        - { ty: org, field: warehouse }
    - name: inventory_stocks
      tags:
        - { ty: org, field: organization }
        - { ty: org, field: warehouse }
    - name: inventory_stocks_history
      priority: 100   # history, but stock movement matters sooner than clinical bulk history
      tags:
        - { ty: org, field: organization }
        - { ty: org, field: warehouse }
    - name: inventory_suppliers
      tags:
        - { ty: org, field: warehouse }
        - { ty: famsrc, field: warehouse }   # + family topic: shared supplier list across the org family
    - name: inventory_trackers
      tags:
        - { ty: org, field: organization }
        - { ty: org, field: warehouse }
    - name: inventory_transactions
      tags:
        - { ty: org, field: warehouse }
    - name: inventory_variant_reports
      tags:
        - { ty: org, field: warehouse }
    - name: inventory_variants
      tags:
        - { ty: org, field: warehouse }
        - { ty: famsrc, field: warehouse }   # + family topic: shared product catalog across the org family
    - name: license_licenses
      tags:
        - { ty: org, field: organization }
    - name: medical_encounters
      tags:
        - { ty: org, field: facility }
    - name: medical_patients
      tags:
        - { ty: org, field: facility }
        - { ty: famsrc, field: facility }   # + family topic: fan across the org neighborhood (per-collection)
    - name: medical_records
      tags:
        - { ty: org, field: facility }
        - { ty: famsrc, field: facility }   # + family topic: a patient's records follow them across branches
    - name: medical_records_history
      priority: 20   # the biggest, fattest collection (~4.3M rows), baseline it LAST so a box is usable in minutes
      tags:
        - { ty: org, field: facility }
        - { ty: famsrc, field: facility }   # + family topic (alongside medical_records)
    - name: medicine_configurations
      tags:
        - { ty: org, field: organization }
    - name: medicine_formulations
      tags:
        - { ty: org, field: organization }
    - name: medicines
      tags:
        - { ty: org, field: organization }
    - name: organization_members
      tags:
        - { ty: org, field: organization }
      edge: { from: uid, to: organization }   # uid -> organization resolves user scope
    - name: organization_members_archived
      tags:
        - { ty: org, field: organization }
    - name: organization_partners
      tags:
        - { ty: org, field: organization }
    - name: organizations
      tags:
        - { ty: org, field: id }
        - { ty: fam, field: cluster }         # org rows also ride the family topic, so every family box
      edge: { from: id, to: cluster }         # holds the family's org rows to resolve famsrc -> fam:cluster.
    - name: personal_details
      tags:
        - { ty: org, field: facility }
        - { ty: user, field: id }
        - { ty: famsrc, field: facility }   # + family topic (per-collection, alongside medical_patients)
    - name: personal_details_history
      priority: 20   # *_history bulk: baseline/catch-up LAST, after current-state (order only, still converges)
      tags:
        - { ty: org, field: facility }
        - { ty: user, field: id }
    - name: pharmacy_medication_orders
      tags:
        - { ty: org, field: organization }
    - name: queue_items
      tags:
        - { ty: org, field: organization }
    - name: queues
      tags:
        - { ty: org, field: organization }
    - name: service_providers
      tags:
        - { ty: org, field: facility }
    - name: services
      tags:
        - { ty: org, field: facility }
    - name: services_archived
      tags:
        - { ty: org, field: facility }
    - name: services_performeds
      tags:
        - { ty: org, field: facility }
    - name: storage_files
      tags:
        - { ty: user, field: owner }
    - name: storage_links
      tags:
        - { ty: user, field: owner }
    - name: subscriptions
      tags:
        - { ty: org, field: organization }

    ## Better-auth
    - name: account
      tags:
