# Disable HTTP/2 for the artifacts vhost ONLY.
#
# The desktop-release publisher (Bun.S3Client streaming multipart) negotiates
# HTTP/2 via ALPN against the shared gateway and STALLS on large request bodies
# (>~25MB): every part past the first ~5MB batch hangs, breaking every desktop
# release at the publish step. HTTP/1.1 clients (rclone, the windows leg) upload
# fine at any size — proven with an 80MB/24s multipart through the same path.
# An object-store upload endpoint gains nothing from h2 anyway.
#
# nginx >=1.25.1 treats `http2` as a per-server directive applied by SNI, so
# `http2 off;` in THIS route's server block disables h2 only for
# artifacts.<domain>; every other *.localfirsthealth.com vhost on the shared
# https-lfh listener keeps HTTP/2.
#
# NOT a re-do of PR #361 (that toggled proxy_request_buffering — the wrong knob;
# reverted in d6624e5). This targets the actual discriminator: h2 large-body.
apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsPolicy
metadata:
  name: minio-artifacts-h2-off
  namespace: {{ .Values.namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: minio-artifacts
  snippets:
    - context: http.server
      value: |
        http2 off;
