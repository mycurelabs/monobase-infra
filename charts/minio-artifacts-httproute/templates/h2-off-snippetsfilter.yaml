# Disable HTTP/2 for the artifacts vhost ONLY.
#
# The desktop-release publisher (Bun.S3Client streaming multipart) negotiates
# HTTP/2 via ALPN against the shared gateway and STALLS on large request bodies
# (>~25MB) — every part past the first batch hangs, breaking every desktop
# release at the publish step. Proven with a fast upload probe: 150MB stalls
# over h2 at BOTH queueSize=1 and =5, while 40MB passes; HTTP/1.1 clients
# (rclone 80MB/24s, the windows leg) upload fine at any size. An object-store
# upload endpoint gains nothing from h2 anyway.
#
# Mechanism: a SnippetsFilter (NOT SnippetsPolicy — that CRD only targets a
# Gateway, which would kill h2 gateway-wide) referenced by the minio-artifacts
# HTTPRoute via an ExtensionRef filter. NGF applies the http.server snippet to
# the server block generated for THIS route's hostname, and nginx >=1.25.1
# honours `http2 off;` per-server by SNI — so only artifacts.<domain> falls back
# to HTTP/1.1; every other *.localfirsthealth.com vhost keeps HTTP/2.
#
# Supersedes PR #361 (proxy_request_buffering, wrong knob) and the invalid
# SnippetsPolicy attempt in #362.
apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsFilter
metadata:
  name: minio-artifacts-h2-off
  namespace: {{ .Values.namespace }}
spec:
  snippets:
    - context: http.server
      value: |
        http2 off;
