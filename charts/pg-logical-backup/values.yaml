# pg-logical-backup — nightly logical pg_dump DR tier (monobase-mycure#4320).
#
# Fills the gap left by the physical tiers (Velero/Kopia snapshots, wal-g PITR,
# the GCS-DR blob mirror): a portable `pg_dump -Fc` that restores into ANY
# Postgres >= source, on any host, with no cluster rebuild and selective
# (table-level) restore. Runs as an in-cluster CronJob that dumps the READ
# REPLICA (never the primary), verifies, encrypts, and ships off-cloud.
#
# Disabled by default — activation is gated on out-of-band prerequisites
# (GCP Secret Manager keys + niflheim rclone receive). See NOTES.txt.
enabled: false

image:
  # Same PG image family the in-cluster statefulset runs — already on nodes.
  postgres: docker.io/bitnamilegacy/postgresql:16.4.0-debian-12-r13
  rclone: rclone/rclone:1.68

# ── Schedule: 00:00 Asia/Manila (12 midnight PHT) ──
# timeZone needs k8s >= 1.27 (DOKS is). On older control planes, clear timeZone
# and set schedule to "0 16 * * *" (16:00 UTC == 00:00 PHT).
schedule: "0 0 * * *"
timeZone: "Asia/Manila"
concurrencyPolicy: Forbid
startingDeadlineSeconds: 3600
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
suspend: false
backoffLimit: 1
# Ceiling on a single dump run (6h). Sized well above the expected window;
# a run that blows past this is a signal, not normal.
activeDeadlineSeconds: 21600

database:
  name: hapihub
  # Dump target — the REPLICA. A multi-hour dump must never load the primary.
  readService: postgresql-read
  # Role creation happens on the PRIMARY (roles are cluster-global, replicated
  # to the standby via WAL — you cannot CREATE ROLE on a read-only standby).
  primaryService: postgresql-primary
  port: 5432
  dumpRole: dumper
  # ESO-synced secret holding the dumper password + rclone.conf (see below).
  existingSecret: pg-logical-backup-secrets
  passwordKey: dumper-db-password

# PreSync hook that provisions the read-only `dumper` login role (pg_read_all_data).
# Idempotent; self-heals the password after an ESO rotation. Same machinery as
# medley's provision-db-role (monobase-infra#420).
provisionRole:
  enabled: true
  superuserSecret: postgresql
  superuserSecretKey: postgres-password
  image: docker.io/bitnamilegacy/postgresql:16.4.0-debian-12-r13
  backoffLimit: 3
  activeDeadlineSeconds: 300

dump:
  compressLevel: 6      # pg_dump -Fc -Z<level>
  globals: true         # pg_dumpall --globals-only --no-role-passwords
  verify: true          # pg_restore --list gate — fail on a truncated/corrupt dump

destination:
  # An rclone `crypt` remote (defined in the ESO-synced rclone.conf) — plaintext
  # PHI never rests off-cluster. The remote wraps whatever backend niflheim pulls
  # from (an sftp push to niflheim, or an object-store prefix niflheim mirrors).
  rcloneRemote: "pgdump-crypt"
  path: "pgdump-preprod"
  retentionDays: 7      # keep ~7 daily; time-based prune (rclone delete --min-age)

work:
  # Where the plaintext dump stages IN-CLUSTER before the crypt upload. Brief,
  # ephemeral, deleted with the pod.
  # ponytail: emptyDir for preprod (small data); switch to a PVC for prod's ~30-60GB dump.
  type: emptyDir        # emptyDir | pvc
  sizeLimit: 5Gi
  pvc:
    size: 100Gi
    storageClass: ""

externalSecrets:
  enabled: true
  secretStore: ""                 # default: <namespace>-secretstore
  secretStoreKind: SecretStore
  refreshInterval: 1h
  # remoteKeys must exist in GCP Secret Manager before activation (handoff).
  secrets:
    - secretKey: dumper-db-password
      remoteKey: mycure-preprod-pg-logical-backup-db-password
    - secretKey: rclone.conf
      remoteKey: mycure-preprod-pg-logical-backup-rclone-conf

networkPolicy:
  enabled: true
  # Extra egress CIDRs the upload needs (e.g. niflheim tailnet IP /32, or the
  # object-store endpoint). DNS + the in-cluster replica are allowed by default.
  extraEgress: []

resources:
  dump:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  upload:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: ""
