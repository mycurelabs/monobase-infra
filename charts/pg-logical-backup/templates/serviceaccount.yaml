{{- if and .Values.enabled .Values.serviceAccount.create }}
# PreSync hook (weight -11) — the provision-role Job (weight -5) runs
# `serviceAccountName: <this>`, so the SA must exist before the Job pod can be
# admitted. A plain Sync-wave SA would not exist yet on first activation
# (all PreSync hooks run before any Sync resource), deadlocking the Job.
# Lowest weight so it precedes the ExternalSecret (-10) and the Job (-5).
# BeforeHookCreation leaves it in place between syncs (the CronJob also uses it).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pgLogicalBackup.serviceAccountName" . }}
  namespace: {{ include "pgLogicalBackup.namespace" . }}
  labels:
    {{- include "pgLogicalBackup.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-11"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
automountServiceAccountToken: false
{{- end }}
