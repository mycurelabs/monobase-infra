{{- if and .Values.enabled .Values.serviceAccount.create }}
# Token-less ServiceAccount for the provision-role Job + the nightly CronJob.
# NORMAL resource (early Sync wave -12) — NOT a PreSync hook. It is created
# before the provision-role Job (wave -10) that references it, and before the
# CronJob (wave 0). A stable, non-hook SA also avoids the churn of
# BeforeHookCreation recreating it every sync.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pgLogicalBackup.serviceAccountName" . }}
  namespace: {{ include "pgLogicalBackup.namespace" . }}
  labels:
    {{- include "pgLogicalBackup.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
automountServiceAccountToken: false
{{- end }}
