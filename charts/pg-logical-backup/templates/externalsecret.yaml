{{- if and .Values.enabled .Values.externalSecrets.enabled }}
# Syncs the dumper DB password + the rclone.conf (crypt remote + backend creds)
# from GCP Secret Manager. Both remoteKeys must exist before activation.
#
# PreSync hook (weight -10) — provisioned BEFORE the provision-role Job (weight
# -5), which needs the dumper password from the target Secret it materializes.
# ArgoCD advances hook weights only once the current wave is Healthy, and the
# ESO custom health check reports Healthy on SecretSynced=True, so the Job at a
# higher weight is guaranteed the Secret exists. hook-delete-policy
# BeforeHookCreation (NOT HookSucceeded) leaves the ExternalSecret in place
# between syncs, so ESO keeps refreshing the nightly CronJob's creds; it is only
# replaced at the start of the next sync.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.existingSecret }}
  namespace: {{ include "pgLogicalBackup.namespace" . }}
  labels:
    {{- include "pgLogicalBackup.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  secretStoreRef:
    name: {{ include "pgLogicalBackup.secretStore" . }}
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  target:
    name: {{ .Values.database.existingSecret }}
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.secrets }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
        {{- if .property }}
        property: {{ .property }}
        {{- end }}
    {{- end }}
{{- end }}
