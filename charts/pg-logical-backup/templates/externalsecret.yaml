{{- if and .Values.enabled .Values.externalSecrets.enabled }}
# Syncs the dumper DB password + the rclone.conf (crypt remote + backend creds)
# from GCP Secret Manager. Both remoteKeys must exist before activation.
#
# NORMAL resource (NOT a PreSync hook). This is deliberate:
#   • ExternalSecret health is `None` on this cluster (Vanaheim's ArgoCD only
#     defines a health check for argoproj.io/Application), so a PreSync hook on
#     it would advance on APPLY, not on SecretSynced=True — it would NOT prove
#     the target Secret exists before the role Job runs. A hook here buys nothing.
#   • `hook-delete-policy: BeforeHookCreation` REPLACES the ExternalSecret every
#     sync, which momentarily removes its Owner-created target Secret — a race
#     against any pod mounting it. A plain resource keeps the target Secret
#     STABLE across syncs.
# Instead, the real readiness gate lives on the provision-role Job's
# initContainer (it blocks until this target Secret exists AND its key is
# populated). Early sync-wave so ESO starts reconciling ahead of that Job.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.existingSecret }}
  namespace: {{ include "pgLogicalBackup.namespace" . }}
  labels:
    {{- include "pgLogicalBackup.labels" . | nindent 4 }}
  annotations:
    # Very early Sync wave — created (and ESO begins reconciling) before the
    # provision-role Job (wave -10) whose readiness gate polls for this Secret.
    argocd.argoproj.io/sync-wave: "-20"
spec:
  secretStoreRef:
    name: {{ include "pgLogicalBackup.secretStore" . }}
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  target:
    name: {{ .Values.database.existingSecret }}
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.secrets }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
        {{- if .property }}
        property: {{ .property }}
        {{- end }}
    {{- end }}
{{- end }}
