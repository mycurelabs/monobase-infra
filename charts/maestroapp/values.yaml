# Pinned fleet version (REQUIRED). The mono release pipeline publishes
# artifacts + an immutable v<version>/latest.json per platform but never
# touches the platform-root latest.json — bumping this value re-renders the
# promote Job (version is in its name), which copies v<version>/latest.json →
# latest.json per platform and verifies the store serves it. The pinned version
# must already be published for every platform or the Job fails loudly (ArgoCD
# app Degraded), promoting nothing for the missing platform.
#
# ROLLBACK: a pin bump is a fleet-wide rollout, and reverting the bump only
# HALTS an in-flight one — it does NOT downgrade boxes. Auto-updaters never move
# a box to a LOWER version, only the publisher's newest-5 window + the live pin
# survive on the store, and only v<pin> has a versioned manifest to promote. So
# a revert stops NEW boxes from picking up the bumped pin (root latest.json goes
# back to the prior version); boxes already updated stay put. Genuine downgrade
# = publish + pin an older version that's still within the retained window.
version: ""

# Same image the artifacts store runs — it ships `mc`, which is all the Job
# needs. Registry-qualified (docker.io/): a bare `bitnamilegacy/minio` fails the
# cluster's restrict-registries admission allowlist.
image:
  repository: docker.io/bitnamilegacy/minio
  tag: "2025.7.23-debian-12-r3"

store:
  # In-cluster endpoint of the artifacts store in the same namespace —
  # per-environment by construction (each env's Job talks to its own store).
  endpoint: http://minio-artifacts:9000
  bucket: artifacts
  # Dedicated promoter identity (user provisioned by the minio-artifacts chart
  # from the minio-artifacts-promoter ExternalSecret): may write ONLY the
  # platform-root latest.json fleet pointers. Credentials never leave the
  # cluster. The Job reads the plain-key `-login` twin secret — the
  # provisioning secret can't carry a plain password key (Bitnami parses every
  # key of it as a user-definition file).
  username: artifacts-promoter
  existingSecret: minio-artifacts-promoter-login
  existingSecretPasswordKey: password

platforms:
  - linux_x86_64
  - darwin_aarch64
  - windows_x86_64

# Post-completion drift guard. The event-driven promote Job only reconciles when
# a pin bump / re-sync re-runs it; a COMPLETED Job never observes drift that
# happens AFTERWARD (someone re-copies an old root, a manifest rots). This
# optional CronJob re-asserts the SAME reconcile script (maestroapp.promoteScript)
# on a schedule so any drift is corrected within one interval. Disabled by
# default — event-driven Job + ArgoCD's periodic Force+Replace sync suffice for
# most envs; enable per environment where a self-healing floor matters (prod).
# concurrencyPolicy=Forbid + the idempotent script make overlapping/backed-up
# runs safe no-ops at steady state.
reconcile:
  enabled: false
  schedule: "*/30 * * * *"
