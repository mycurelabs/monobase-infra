{{- /*
Per-Gateway NginxProxy (attached via spec.infrastructure.parametersRef in
gateway.yaml). NGF merges it over the GatewayClass-level NginxProxy, so the
data plane inherits infra-pool placement, njs mounts and sizing — only the
fields set here differ. Used by the tailnet gateway to get a ClusterIP data
plane (born ClusterIP: must never provision a DO LB), and by the k3d public
gateway (mycure-contabo-demo) to set externalTrafficPolicy: Cluster.
Applies to the main `gateway` AND every `extraGateways` entry that sets
`nginxProxy` — same set gateway.yaml iterates.
*/ -}}
{{- $gateways := list }}
{{- if .Values.gateway.listeners }}
{{- $gateways = append $gateways .Values.gateway }}
{{- end }}
{{- range .Values.extraGateways }}
{{- $gateways = append $gateways . }}
{{- end }}
{{- range $gw := $gateways }}
{{- if $gw.nginxProxy }}
---
apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: {{ $gw.name }}-proxy-config
  namespace: {{ include "nginx-gateway.namespace" $ }}
  labels:
    {{- include "nginx-gateway.labels" $ | nindent 4 }}
spec:
  kubernetes:
    {{- with $gw.nginxProxy.replicas }}
    deployment:
      replicas: {{ . }}
    {{- end }}
    service:
      type: {{ $gw.nginxProxy.serviceType }}
      {{- with $gw.nginxProxy.externalTrafficPolicy }}
      externalTrafficPolicy: {{ . }}
      {{- end }}
{{- end }}
{{- end }}
