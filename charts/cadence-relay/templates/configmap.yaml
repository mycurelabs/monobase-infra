{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cadence-relay-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cadence-relay.labels" . | nindent 4 }}
data:
  # iroh-relay v1.0.2 config. Serves the relay protocol over TLS on {{ .Values.httpsBindPort }} (LB maps
  # {{ .Values.externalHttpsPort }} → it). Certs come from cert-manager (mounted Secret) in `Manual` mode.
  # QUIC addr-discovery ON ({{ .Values.quicPort }}/UDP): netcheck ranks this relay's latency through it, and
  # only a ranked relay can be selected as a node's HOME relay — required for the anchor to home here.
  # Access is open (Everyone) — the relay only forwards encrypted traffic; add `[access] shared_token` to lock down.
  config.toml: |
    enable_relay = true
    http_bind_addr = "[::]:{{ .Values.httpBindPort }}"
    enable_quic_addr_discovery = true

    [tls]
    https_bind_addr = "[::]:{{ .Values.httpsBindPort }}"
    quic_bind_addr = "[::]:{{ .Values.quicPort }}"
    cert_mode = "Manual"
    manual_cert_path = "/etc/iroh-relay/certs/tls.crt"
    manual_key_path = "/etc/iroh-relay/certs/tls.key"
{{- end }}
