{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: cadence-relay
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cadence-relay.labels" . | nindent 4 }}
  {{- $isLB := eq (.Values.serviceType | default "LoadBalancer") "LoadBalancer" }}
  {{- if or $isLB (not .Values.gatewayRoute.enabled) }}
  annotations:
    {{- if $isLB }}
    # Stable LB name → DO reuses the same LoadBalancer + IP across Service recreation, so the relay's
    # public address doesn't churn.
    service.beta.kubernetes.io/do-loadbalancer-name: {{ printf "%s-cadence-relay" .Values.global.namespace | quote }}
    # DO health check must target a Service port (DO maps it to that port's nodePort) — TCP-connect the
    # relay's HTTPS port. Using the pod bind port (8443) here fails: it has no nodePort, so every backend
    # is marked unhealthy and the LB drops all traffic.
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-protocol: "tcp"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-port: {{ .Values.externalHttpsPort | quote }}
    {{- end }}
    {{- if not .Values.gatewayRoute.enabled }}
    # external-dns creates the A record for the relay hostname → this LB's IP. When gatewayRoute is
    # on, the HTTPRoute owns the record (→ gateway LB IP) instead, so the Service must not claim it.
    external-dns.alpha.kubernetes.io/hostname: {{ include "cadence-relay.hostname" . | quote }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.serviceType | default "LoadBalancer" }}
  {{- if $isLB }}
  externalTrafficPolicy: Cluster
  {{- end }}
  selector:
    app.kubernetes.io/name: cadence-relay
  ports:
  - name: https
    port: {{ .Values.externalHttpsPort }}
    targetPort: {{ .Values.httpsBindPort }}
    protocol: TCP
  # QUIC address-discovery (same LB IP so it resolves to the relay hostname). 7842 > 1024 → bind == expose.
  - name: quic
    port: {{ .Values.quicPort }}
    targetPort: {{ .Values.quicPort }}
    protocol: UDP
  {{- with .Values.quicAltPort }}
  # Alternate public QUIC port → same relay QUIC endpoint. Lets clients that adopt
  # `relay_quic_port` from the bootstrap doc (mono#3166) do address discovery on a
  # non-default port — the port-demux shape relay consolidation needs.
  - name: quic-alt
    port: {{ . }}
    targetPort: {{ $.Values.quicPort }}
    protocol: UDP
  {{- end }}
{{- end }}
