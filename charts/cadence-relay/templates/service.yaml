{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: cadence-relay
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cadence-relay.labels" . | nindent 4 }}
  annotations:
    # Stable LB name → DO reuses the same LoadBalancer + IP across Service recreation, so the relay's
    # public address doesn't churn.
    service.beta.kubernetes.io/do-loadbalancer-name: {{ printf "%s-cadence-relay" .Values.global.namespace | quote }}
    # DO health check must target a Service port (DO maps it to that port's nodePort) — TCP-connect the
    # relay's HTTPS port. Using the pod bind port (8443) here fails: it has no nodePort, so every backend
    # is marked unhealthy and the LB drops all traffic.
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-protocol: "tcp"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-port: {{ .Values.externalHttpsPort | quote }}
    # external-dns creates the A record for the relay hostname → this LB's IP.
    external-dns.alpha.kubernetes.io/hostname: {{ include "cadence-relay.hostname" . | quote }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: cadence-relay
  ports:
  - name: https
    port: {{ .Values.externalHttpsPort }}
    targetPort: {{ .Values.httpsBindPort }}
    protocol: TCP
{{- end }}
