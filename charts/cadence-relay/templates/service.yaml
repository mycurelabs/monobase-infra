{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: cadence-relay
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cadence-relay.labels" . | nindent 4 }}
  annotations:
    # Stable LB name → DO reuses the same LoadBalancer + IP across Service recreation, so the relay's
    # public address doesn't churn.
    service.beta.kubernetes.io/do-loadbalancer-name: {{ printf "%s-cadence-relay" .Values.global.namespace | quote }}
    # DO health check must target a Service port (DO maps it to that port's nodePort). Use an HTTPS GET of
    # the relay's `/` (iroh-relay answers 200) on the existing https port rather than a bare TCP connect:
    # a TCP check opens the TLS port then closes without a ClientHello, so the relay logs every probe as
    # `http_server: failed to handle connection … TLS accept … reset` at ERROR (≈1/3 of all log lines). A
    # real HTTPS request completes the handshake → 200 → healthy, no reset spam. (Don't use the pod bind
    # port 8443 here — it has no nodePort, which marks every backend unhealthy and drops all traffic.)
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-protocol: "https"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-port: {{ .Values.externalHttpsPort | quote }}
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-path: "/"
    # external-dns creates the A record for the relay hostname → this LB's IP.
    external-dns.alpha.kubernetes.io/hostname: {{ include "cadence-relay.hostname" . | quote }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: cadence-relay
  ports:
  - name: https
    port: {{ .Values.externalHttpsPort }}
    targetPort: {{ .Values.httpsBindPort }}
    protocol: TCP
  # QUIC address-discovery (same LB IP so it resolves to the relay hostname). 7842 > 1024 → bind == expose.
  - name: quic
    port: {{ .Values.quicPort }}
    targetPort: {{ .Values.quicPort }}
    protocol: UDP
{{- end }}
