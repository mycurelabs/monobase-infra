enabled: true

# Stock n0 relay image (Docker Hub). Pin to the tag matching the cadence client's iroh version (1.0.2)
# so the relay protocol is compatible.
image:
  repository: n0computer/iroh-relay
  tag: "v1.0.2"
  pullPolicy: IfNotPresent

# Public hostname the relay serves TLS on. Defaults to `cadence-relay.{global.domain}` (set in the
# template); boxes + anchor use `https://<hostname>` as cadence `relay_url`. external-dns creates the
# A record from the LoadBalancer Service annotation.
hostname: ""

# Ports. externalHttpsPort = what clients hit (the relay protocol, HTTPS/WebSocket over TLS). The pod runs
# non-root (PodSecurity), so it binds high ports internally and the LB maps 443 → 8443.
# QUIC address-discovery (UDP, iroh's DEFAULT_RELAY_QUIC_PORT 7842) MUST be enabled + exposed: iroh netcheck
# ranks a relay's latency via this endpoint, and only a ranked relay can be selected as a node's HOME relay.
# Without it the anchor never homes on this relay (it falls back to n0). 7842 > 1024 so no port mapping is
# needed (bind == expose). The DO LB carries both TCP 443 and UDP 7842 (same pattern as udp-gateway).
externalHttpsPort: 443
httpsBindPort: 8443
httpBindPort: 8080
quicPort: 7842

# TLS via cert-manager (DNS-01, works for an L4 service — no HTTP path needed). The issued Secret is
# mounted read-only and the relay reads it in `Manual` cert mode.
tls:
  clusterIssuer: letsencrypt-mycure-cloudflare-prod
  secretName: cadence-relay-tls

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Untainted nonprod pool by default; prod overrides to prod-apps in its
# deployment values.
nodePool: "nonprod"
