{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenzir-config
  namespace: {{ include "tenzir.namespace" . }}
  labels:
    {{- include "tenzir.labels" . | nindent 4 }}
data:
  # Tenzir node config. The `tenzir.pipelines` block auto-starts every pipeline
  # on node boot and restarts it on error (detection-as-code, GitOps-managed).
  #
  # Topology:
  #   ingest      : HTTP push from hapihub's audit sink  -> publish "audit"
  #   detect-*    : subscribe "audit", detect a signal    -> publish "findings"
  #   route       : subscribe "findings" -> POST to Alertmanager (Discord+email)
  #
  # All detections emit a normalized finding:
  #   {signal, severity, attck, ocsf_class_uid, title, description, entity, time}
  # which `route` maps uniformly to an Alertmanager v2 alert.
  #
  # TWO variants are rendered so the node can fail OPEN on a missing MaxMind db:
  #   tenzir.yaml        : NO-GEO — the five non-geo detections + ingest + route.
  #                        No geoip-city context, so it boots even with no mmdb.
  #   tenzir-geoip.yaml  : GEO — adds 20-unusual-country + 21-impossible-travel and
  #                        the geoip-city context (only rendered when geoip.enabled).
  # The deployment startup wrapper picks tenzir-geoip.yaml ONLY when the mmdb is
  # present and non-empty; otherwise it falls back to tenzir.yaml. This matters
  # because tenzir-node v6.13.0 exits 139 (SIGSEGV) when a configured geoip
  # context points at a missing/empty db — selecting the no-geo config in that
  # case keeps the node (and the five non-geo detections) running.
  tenzir.yaml: |
    {{- include "tenzir.config" (dict "root" . "geo" false) | nindent 4 }}
  {{- if .Values.geoip.enabled }}
  tenzir-geoip.yaml: |
    {{- include "tenzir.config" (dict "root" . "geo" true) | nindent 4 }}
  {{- end }}
{{- end }}
