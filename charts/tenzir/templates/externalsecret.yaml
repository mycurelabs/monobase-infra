{{- if and .Values.enabled .Values.externalSecrets.enabled }}
# HMAC key (shared with hapihub's audit sink) + MaxMind license (dormant until
# geoip.enabled). Synced from GCP Secret Manager via the cluster secret store.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tenzir-secrets
  namespace: {{ include "tenzir.namespace" . }}
  labels:
    {{- include "tenzir.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  target:
    name: tenzir-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.secrets }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
    {{- end }}
    {{- if .Values.geoip.enabled }}
    # Only synced when geoip is on — otherwise the GCP secret need not exist,
    # and a missing remoteRef would fail the WHOLE ExternalSecret (blocking the
    # HMAC key too). Phase 1 therefore needs only infrastructure-tenzir-ingest-hmac.
    - secretKey: maxmind-license
      remoteRef:
        key: infrastructure-tenzir-maxmind-license
    {{- end }}
{{- end }}
