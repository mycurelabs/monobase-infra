{{- if and .Values.enabled .Values.externalSecrets.enabled }}
# HMAC key (shared with hapihub's audit sink). Synced from GCP Secret Manager
# via the cluster secret store. Deliberately SEPARATE from the MaxMind license
# (below): the HMAC key is on the ingest hot path (verifyHmac + the node's
# TENZIR_HMAC_KEY env), while the MaxMind license is a best-effort geo enricher.
# A MaxMind-side failure (secret missing/renamed, quota) must NOT be able to
# stall or fault the tenzir-secrets ExternalSecret and take out the HMAC key.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tenzir-secrets
  namespace: {{ include "tenzir.namespace" . }}
  labels:
    {{- include "tenzir.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  target:
    name: tenzir-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.secrets }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
    {{- end }}
{{- if .Values.geoip.enabled }}
---
# MaxMind license — its OWN ExternalSecret/Secret, referenced only by the geoip
# init container. Isolated on purpose: if the GeoLite2 license secret is
# missing/renamed or MaxMind is down, only THIS ExternalSecret degrades — the
# HMAC key in tenzir-secrets is unaffected. (And the init container fails open,
# so even a missing key just boots the no-geo config.)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tenzir-maxmind-license
  namespace: {{ include "tenzir.namespace" . }}
  labels:
    {{- include "tenzir.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  target:
    name: tenzir-maxmind-license
    creationPolicy: Owner
  data:
    - secretKey: maxmind-license
      remoteRef:
        key: infrastructure-tenzir-maxmind-license
{{- end }}
{{- end }}
