{{- if .Values.enabled }}
{{- $remoteKey := required "cloudflared: `token.remoteKey` is required (GCP secret holding the tunnel token)" .Values.token.remoteKey }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "cloudflared.tokenSecret" . }}
  namespace: {{ include "cloudflared.namespace" . }}
  labels:
    {{- include "cloudflared.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.token.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.token.secretStore }}
    kind: {{ .Values.token.secretStoreKind }}
  target:
    name: {{ include "cloudflared.tokenSecret" . }}
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ $remoteKey }}
{{- end }}
