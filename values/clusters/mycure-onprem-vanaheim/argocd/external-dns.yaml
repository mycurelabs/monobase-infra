# External DNS - Infrastructure Configuration
# Cluster-wide DNS automation for all environments

enabled: true

# External DNS image configuration
image:
  registry: registry.k8s.io
  repository: external-dns/external-dns
  tag: "v0.19.0"
  pullPolicy: IfNotPresent

# Multiple External DNS instances
# Each instance can manage different DNS provider and domains
instances:
  # Primary instance: Cloudflare for localfirsthealth.com
  - name: primary
    enabled: true
    provider: cloudflare

    # UNIQUE owner id — the DOKS cluster's instance is `external-dns-primary`
    # (chart default); sharing it would make the two sync-policy instances
    # delete each other's records.
    txtOwnerId: mycure-onprem-vanaheim

    # Manage DNS subdomains across all namespaces
    domainFilters:
      - localfirsthealth.com

    # Cloudflare-specific configuration
    cloudflare:
      proxied: false  # DNS only, no Cloudflare proxy
      apiTokenSecretRef:
        name: cloudflare-api-token
        key: api-token

    # Resource limits. Memory must exceed the v0.19 binary's cold-start working
    # set: at 64Mi the container sat pinned on the limit, thrashed its own text
    # pages (~56GB of file reads in 9 minutes, 11k major faults) and never
    # finished the informer cache sync inside external-dns's hard-coded 60s
    # deadline ("failed to sync *v1beta1.HTTPRoute: context deadline exceeded"),
    # crash-looping for 45h (2026-09-21 → 09-23). Steady state is ~45Mi.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 50m
        memory: 256Mi

  # Example: Add new client with different DNS provider
  # - name: client-a
  #   enabled: true
  #   provider: route53
  #   domainFilters:
  #     - clienta.com
  #   aws:
  #     region: us-east-1
  #     zoneType: public
  #   resources:
  #     requests:
  #       cpu: 10m
  #       memory: 32Mi
  #     limits:
  #       cpu: 50m
  #       memory: 64Mi

# Ops plane runs on the tainted infra pool.
nodeSelector:
  node-pool: infra
tolerations:
  - key: node-pool
    operator: Equal
    value: infra
    effect: NoSchedule

# Global configuration applied to all instances
global:
  # vanaheim is a self-hosted k3d cluster — its apiserver listens on 6443, so
  # the external-dns informer needs the broad TCP 6443 egress. DOKS (managed,
  # 443) leaves this OFF (chart default) so its NetworkPolicy stays tighter.
  selfHostedAPIServerEgress: true

  # Sources to watch (applied to all instances)
  sources:
    - gateway-httproute
    - gateway-tcproute
    - gateway-tlsroute
    - service

  # Policy: sync (create+update+delete) or upsert-only (create+update).
  # VANAHEIM = upsert-only (NEVER DELETE): this preprod cluster shares the prod
  # `localfirsthealth.com` Cloudflare zone with the DOKS prod cluster, guarded
  # only by a distinct txtOwnerId. `sync` would let a preprod hiccup (a route
  # deleted, external-dns losing sight of a record it believes it owns) issue a
  # DELETE against a record in the SHARED prod zone. upsert-only can create/update
  # but never delete, so a preprod fault can't take down a prod DNS record.
  # DOKS keeps `sync` (it owns the zone). Stale preprod records are pruned by hand.
  policy: upsert-only

  # Registry type for tracking ownership
  registry: txt

  # TXT record prefix
  txtPrefix: "external-dns-"

  # Log level: panic, debug, info, warning, error, fatal
  logLevel: info

  # Log format: text or json
  logFormat: text

  # Interval between DNS updates
  interval: 1m

  # Trigger loop on create (in addition to interval)
  triggerLoopOnEvent: true

# Pod-level security context (PodSecurity restricted compliant)
securityContext:
  runAsNonRoot: true
  runAsUser: 65534  # nobody user
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

