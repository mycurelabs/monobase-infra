# Infrastructure values for mycure-onprem-vanaheim (local k3d cluster).
# LEAN, TAILNET-ONLY staging profile: only External Secrets, the Tailscale
# operator, and the NGINX gateway (exposed to the tailnet) are enabled.
# Everything DigitalOcean-specific or heavy is disabled below.
# Note: argocd.repoURL is injected from infrastructure-root.yaml bootstrap file

# Cert Manager - TLS certificate automation
certManager:
  enabled: true
  version: v1.16.2

# Cert Manager Resources - ClusterIssuers and certificate configuration
certManagerIssuers:
  enabled: true
  issuers:
    # Cloudflare DNS-01 challenge (for wildcard and multi-level subdomains)
    - name: letsencrypt-mycure-cloudflare-prod
      email: "caretheextramile@gmail.com"
      server: production
      provider: cloudflare
      cloudflare:
        apiTokenSecretRef:
          name: mycure-cloudflare-api-token
          key: api-token
        dnsZones:
          - localfirsthealth.com

# CoreDNS overrides — in-cluster hairpin for *.preprod (mycure#4135). k3s
# CoreDNS imports /etc/coredns/custom/*.override from the same coredns-custom
# ConfigMap the DOKS hook uses (verified on the live cluster). Without this,
# pods resolve the PUBLIC *.preprod A records (tailnet IPs unreachable from
# pods) and cadence enroll/JWKS against hapihub.preprod hangs.
# NOTE: the k3s Corefile has no `reload` plugin — `kubectl -n kube-system
# rollout restart deploy/coredns` after changing these rewrites.
corednsCustom:
  enabled: true
  # Exact hairpin first: relay hostname -> relay Service (must win over the
  # wildcard, matching the DOKS ordering).
  exactRewrites:
    - from: cadence-relay.preprod.localfirsthealth.com
      to: cadence-relay.mycure-preprod.svc.cluster.local
  # Wildcard hairpin: *.preprod -> the internal gateway data plane (same
  # listeners/certs, so cadence->hapihub auth/JWKS https keeps working).
  regexRewrites:
    - pattern: (.*)\.preprod\.localfirsthealth\.com
      to: nginx-internal-gateway-nginx.nginx-gateway-system.svc.cluster.local
  # AAAA suppression (host has no IPv6 egress) — previously baked into the
  # coredns-custom ConfigMap by the local-k3d module; ArgoCD replaces the CM
  # data wholesale on sync, so the key must render from this chart or it gets
  # clobbered (it did, once). Keep in lockstep with the module's copy.
  extraOverrides:
    aaaa: |
      template IN AAAA {
        rcode NOERROR
      }

# NGINX Gateway Fabric - primary Gateway API implementation
nginxGateway:
  enabled: true
  # Keep in lockstep with the Gateway API CRD bundle —
  # scripts/upgrade-gateway-api-crds.sh (2.6.7 -> Gateway API 1.5.1).
  version: "2.6.7"

# NGINX Gateway Resources
nginxGatewayResources:
  gatewayClass:
    enabled: false  # GatewayClass created by operator chart

  # No public gateway on k3d/vanaheim — this cluster is tailnet-only. The single
  # staging gateway lives under extraGateways below and is exposed via the
  # tailscale operator (no DO LB, no internet-facing listeners).
  gateway:
    name: nginx-public-gateway
    namespace: nginx-gateway-system
    gatewayClassName: nginx
    listeners: []

  # INTERNAL gateway — the CLUSTER-DEFAULT ingress (deny-first). ClusterIP data
  # plane (never a DO LB); the Tailscale operator exposes it on the tailnet.
  # Checkpoint 4: TLS is now real Let's Encrypt via the cloudflare DNS-01 issuer
  # (letsencrypt-mycure-cloudflare-prod); external-dns publishes attached-route
  # hostnames as CNAMEs to the gateway's stable tailnet MagicDNS name.
  extraGateways:
    - name: nginx-internal-gateway
      gatewayClassName: nginx
      annotations:
        # external-dns publishes attached routes' hostnames as A records -> the
        # gateway's tailnet IP (like preprod's 100.74.26.73). Direct A resolves
        # reliably on clients; a CNAME to the *.ts.net MagicDNS name needs a
        # second (tailnet-resolver) hop that clients resolve flakily with TTL 1.
        # NOTE: this tailnet IP is assigned by the tailscale operator and CHANGES
        # on cluster nuke+rebootstrap — update it (get: `tailscale status | grep
        # nginx-staging-gateway`) or re-point after a rebuild.
        external-dns.alpha.kubernetes.io/target: "100.124.242.71"
      infrastructure:
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: "nginx-staging-gateway"
      nginxProxy:
        serviceType: ClusterIP
        replicas: 1
      listeners:
        - name: https-staging-mycure
          port: 443
          protocol: HTTPS
          hostname: "mycure.staging.localfirsthealth.com"
          tlsSecretName: nginx-gateway-tls-staging-mycure
        - name: https-staging-hapihub
          port: 443
          protocol: HTTPS
          hostname: "hapihub.staging.localfirsthealth.com"
          tlsSecretName: nginx-gateway-tls-staging-hapihub
        - name: https-staging-lfh
          port: 443
          protocol: HTTPS
          hostname: "*.staging.localfirsthealth.com"
          tlsSecretName: nginx-gateway-tls-staging
        - name: http-staging-lfh
          port: 80
          protocol: HTTP
          hostname: "*.staging.localfirsthealth.com"
        # QUIC/UDP legs for the staging cadence stack (box<->hub sync + relay).
        # cadence advertises <gateway-tailnet-IP>:6474 (publicAddr); the relay's
        # QUIC leg rides 7843. NOTE: 6473/7842 belong to the preprod legs below —
        # UDP has no SNI, so each env needs its own port on this shared gateway.
        - name: cadence-quic-staging
          port: 6474
          protocol: UDP
        - name: relay-quic-staging
          port: 7843
          protocol: UDP
        # ---- preprod (mycure#4135, stood up here after the DOKS decommission
        # in PR #409). Exact-hostname listeners for the app<->api pair
        # (anti-HTTP/2-coalescing, mono#2540) + wildcard for the rest. ----
        - name: https-preprod-mycure
          port: 443
          protocol: HTTPS
          hostname: "mycure.preprod.localfirsthealth.com"
          tlsSecretName: nginx-gateway-tls-preprod-mycure
        - name: https-preprod-hapihub
          port: 443
          protocol: HTTPS
          hostname: "hapihub.preprod.localfirsthealth.com"
          tlsSecretName: nginx-gateway-tls-preprod-hapihub
        - name: https-preprod-lfh
          port: 443
          protocol: HTTPS
          hostname: "*.preprod.localfirsthealth.com"
          tlsSecretName: nginx-gateway-tls-preprod
        - name: http-preprod-lfh
          port: 80
          protocol: HTTP
          hostname: "*.preprod.localfirsthealth.com"
        # Cadence QUIC (UDPRoute): preprod hub port 6473, preprod relay 7842.
        # No SNI on UDP — port-demuxed. publicAddr in the deployment values
        # advertises <this gateway's tailnet IP>:6473.
        - name: cadence-quic-preprod
          port: 6473
          protocol: UDP
        - name: relay-quic-preprod
          port: 7842
          protocol: UDP

  tls:
    certificates:
      # Real Let's Encrypt certs via the cloudflare DNS-01 issuer for the
      # secretNames the staging listeners above reference.
      - secretName: nginx-gateway-tls-staging-mycure
        clusterIssuer: letsencrypt-mycure-cloudflare-prod  # DNS-01
        dnsNames:
          - mycure.staging.localfirsthealth.com
      - secretName: nginx-gateway-tls-staging-hapihub
        clusterIssuer: letsencrypt-mycure-cloudflare-prod  # DNS-01
        dnsNames:
          - hapihub.staging.localfirsthealth.com
      - secretName: nginx-gateway-tls-staging
        clusterIssuer: letsencrypt-mycure-cloudflare-prod  # DNS-01, wildcard
        dnsNames:
          - "*.staging.localfirsthealth.com"
      # preprod (mycure#4135). Exact-name certs MUST stay single-hostname —
      # extra dnsNames would re-enable HTTP/2 coalescing.
      - secretName: nginx-gateway-tls-preprod-mycure
        clusterIssuer: letsencrypt-mycure-cloudflare-prod  # DNS-01
        dnsNames:
          - mycure.preprod.localfirsthealth.com
      - secretName: nginx-gateway-tls-preprod-hapihub
        clusterIssuer: letsencrypt-mycure-cloudflare-prod  # DNS-01
        dnsNames:
          - hapihub.preprod.localfirsthealth.com
      - secretName: nginx-gateway-tls-preprod
        clusterIssuer: letsencrypt-mycure-cloudflare-prod  # DNS-01, wildcard
        dnsNames:
          - "*.preprod.localfirsthealth.com"

  # Cluster-wide SnippetsPolicies for the shared nginx Gateway.
  snippetsPolicies:
    - name: hapihub-proxy-timeout
      snippets:
        - context: http.server.location
          value: |
            proxy_read_timeout 3600s;
            client_max_body_size 50m;
    # vapt-2025#10 L-001: strip the `Server` response header via the bundled njs
    # module (ngx_http_js_module). Script: charts/nginx-gateway/files/security-headers.js
    - name: nginx-strip-server-header
      snippets:
        - context: http
          value: |
            js_import securityHeaders from /etc/nginx/njs-security/security-headers.js;
        - context: http.server.location
          value: |
            js_header_filter securityHeaders.clearServer;

# Gateway metadata consumed by the grafana/signoz Application templates.
# Both grafana and signoz are disabled on this cluster — these values are inert.
gateway:
  domain: staging.localfirsthealth.com
  gateway:
    name: nginx-internal-gateway
    namespace: nginx-gateway-system

# External Secrets - Secret management (staging pulls secrets from GCP)
externalSecrets:
  enabled: true
  version: 0.9.11
  provider: gcp

  # Store the cluster-scoped ExternalSecrets (cert-manager/external-dns) read
  # from — must match a store below. This block was stale (pre-stores shape)
  # since #355; the external-secrets-stores app failed to render ("stores is
  # empty") and the live ClusterSecretStore only existed because bootstrap
  # hand-seeded it. Mirrors the live object exactly, so adoption is a no-op.
  secretStoreName: gcp-secretstore
  cloudflare:
    enabled: true
  cloudflareSecretName: mycure-cloudflare-api-token

  stores:
    - name: gcp-secretstore
      provider: gcp
      gcp:
        projectId: mc-v4-prod
        # k3d (no Workload Identity) — auth via the gcpsm-secret SA key
        # (scoped external-secrets-staging SA, seeded at bootstrap).
        auth:
          serviceAccountKey:
            enabled: true
            secretRef:
              name: gcpsm-secret
              key: secret-access-credentials
              namespace: external-secrets-system

  # AWS Secrets Manager configuration
  aws:
    region: us-east-1
    roleArn: ""
    serviceAccountName: external-secrets-sa

  # Azure Key Vault configuration
  azure:
    vaultUrl: ""
    identityId: ""
    tenantId: ""

  # GCP Secret Manager configuration
  gcp:
    projectId: ""
    region: us-central1
    clusterName: ""
    serviceAccountEmail: ""

# External DNS - Automatic DNS record management from HTTPRoutes (full config
# in external-dns.yaml). Historical note: disabled at PR #355 because the
# then-current external-dns emitted a flaky CNAME to the gateway's .ts.net
# status hostname, ignoring the IP target annotation; v0.19.0 honors the
# Gateway-level `external-dns.alpha.kubernetes.io/target` annotation (set on
# nginx-internal-gateway above), publishing direct A records. Owner id is
# cluster-unique (see external-dns.yaml) so this instance can never touch the
# DOKS instance's records.
externalDNS:
  enabled: true

# Kyverno - Policy engine
kyverno:
  enabled: false  # disabled on k3d/vanaheim

# Velero - Backup and disaster recovery
velero:
  enabled: false  # disabled on k3d/vanaheim

# Falco - Runtime security monitoring
falco:
  enabled: false  # disabled on k3d/vanaheim

# Monitoring - Prometheus + Grafana stack
monitoring:
  enabled: false  # disabled on k3d/vanaheim
  # grafana.enabled kept (=false) because templates/grafana.yaml gates on this
  # nested key directly, not monitoring.enabled.
  grafana:
    enabled: false

# SigNoz - unified observability platform
signoz:
  enabled: false  # disabled on k3d/vanaheim

# Tailscale egress to the vanaheim workstation Ollama
ollamaEgress:
  enabled: false  # disabled on k3d/vanaheim

# Tailscale K8s operator — tailnet exposure for cluster services. Backs the
# nginx-internal-gateway (tailnet-only cluster-default gateway).
tailscaleOperator:
  enabled: true

# Tenzir security detection pipeline — ENABLED on preprod to re-test the #357/#359a/#360
# rollout end-to-end before prod (PR monobase-infra#428). Ingests mycure-preprod's
# hapihub-worker audit sink over HTTP, runs the detections, routes findings to
# Alertmanager. geoip stays OFF: the geo signals (unusual_country/impossible_travel)
# are prod-meaningful only — preprod clients are tailnet (100.x), not geolocatable,
# and there's no MaxMind key here. Mirrors the doks-main tenzir block.
tenzir:
  enabled: true
  geoip:
    enabled: false
  # Preprod-specific HMAC secret (Option B isolation): overrides the chart default
  # remoteKey (infrastructure-tenzir-ingest-hmac, prod-shared) so the staging ESO SA
  # — which only has a name-prefix grant on mycure-preprod-* — can read it without
  # touching the prod-shared secret. Same secret the preprod hapihub audit sink signs
  # with (values/deployments/mycure-preprod.yaml AUDIT_SINK_SECRET), so they match if
  # verifyHmac is ever flipped on. This list REPLACES the chart default (helm list-merge).
  externalSecrets:
    secrets:
      - secretKey: hmac-key
        remoteKey: mycure-preprod-tenzir-ingest-hmac
