# argocd-bootstrap override for the public demo k3d cluster (mycure-k3d-demo).
#
# Bootstrap (run from a checkout of main, on the VPS; bootstrap.ts uses the
# CURRENT kubectl context and ignores --context):
#   kubectl config use-context k3d-mycure-k3d-demo
#   mise run bootstrap -- --cluster-name mycure-k3d-demo --skip-github-app
#
# Effect: this cluster's own ArgoCD uses the per-cluster infra config
# (clusterName) and its auto-discover ApplicationSet deploys ONLY the
# mycure-demo overlay, in-cluster. The DOKS ArgoCD excludes it
# (values/clusters/mycure-doks-main/argocd/bootstrap.yaml).
#
# Git ref: NO argocd.targetRevision override — this cluster tracks HEAD (main),
# the chart default. It is LONG-LIVED and client-facing, so it follows the
# "long-lived clusters track HEAD" rule (docs/architecture/GITOPS-ARGOCD.md →
# "Branch Conventions"). Do not add a cluster/<name> branch here: those are
# throwaway refs for disposable dev clusters only.
argocd:
  clusterName: mycure-k3d-demo
  deploymentPaths:
    - path: "values/deployments/mycure-demo.yaml"
