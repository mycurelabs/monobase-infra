# Infrastructure Secrets - Provider-Agnostic Schema
# Location determines scope: infrastructure-level secrets for cluster-wide services.
#
# mycure-contabo-demo (public k3d): only the Cloudflare token is needed — for
# external-dns (A records -> the VPS IP) and the cert-manager DNS-01 issuer.
# No tailscale operator on this cluster. Read by the scoped
# external-secrets-demo SA, whose IAM condition must include this key.

secrets:
  # Cloudflare API Token for external-dns (DNS record management)
  - name: cloudflare-api-token
    remoteRef: infrastructure-cloudflare-api-token
    targetNamespace: external-dns
    keys:
      - key: api-token
        remoteKey: infrastructure-cloudflare-api-token

  # Cloudflare API Token for cert-manager DNS-01 issuer
  # (letsencrypt-mycure-cloudflare-prod). Same GCP secret as above, synced into
  # the cert-manager namespace where the ClusterIssuer's apiTokenSecretRef looks.
  - name: mycure-cloudflare-api-token
    remoteRef: infrastructure-cloudflare-api-token
    targetNamespace: cert-manager
    keys:
      - key: api-token
        remoteKey: infrastructure-cloudflare-api-token
