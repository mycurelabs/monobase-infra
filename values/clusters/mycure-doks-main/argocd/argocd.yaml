# ArgoCD — Helm values (CANONICAL — matches the live release)
# Chart: argo/argo-cd 9.0.3 (app v3.1.9) — install/upgrade:
#   helm upgrade --install argocd argo/argo-cd -n argocd --version 9.0.3 \
#     -f values/infrastructure/argocd.yaml
# ArgoCD is NOT managed by an Application (it can't manage itself here);
# scripts/bootstrap.ts runs the helm command above. Any change to this file
# must be applied with that command — merging alone does nothing.
# All components run on the tainted infra pool.

applicationSet:
  enabled: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
  nodeSelector:
    node-pool: infra
  replicas: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  tolerations:
  - effect: NoSchedule
    key: node-pool
    operator: Equal
    value: infra
configs:
  secret:
    createSecret: true
  ssh:
    knownHosts: |
      github.com ssh-rsa 
controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
  nodeSelector:
    node-pool: infra
  replicas: 1
  resources:
    limits:
      cpu: 1
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 768Mi
  tolerations:
  - effect: NoSchedule
    key: node-pool
    operator: Equal
    value: infra
dex:
  enabled: false
global:
  domain: argocd.example.com
notifications:
  argocdUrl: https://argocd.example.com
  enabled: true
  nodeSelector:
    node-pool: infra
  notifiers:
    service.email: |
      host: smtp.gmail.com
      port: 587
      from: argocd@example.com
    service.slack: |
      token: $slack-token
  templates:
    template.app-deployed: |
      message: |
        Application {{.app.metadata.name}} deployed to {{.app.spec.destination.namespace}}
      slack:
        attachments: |
          [{
            "title": "{{.app.metadata.name}}",
            "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#18be52",
            "fields": [{
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            }, {
              "title": "Repository",
              "value": "{{.app.spec.source.repoURL}}",
              "short": true
            }]
          }]
    template.app-sync-failed: |
      message: |
        Application {{.app.metadata.name}} sync failed
      slack:
        attachments: |
          [{
            "title": "{{.app.metadata.name}}",
            "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#ff0000",
            "fields": [{
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            }]
          }]
  tolerations:
  - effect: NoSchedule
    key: node-pool
    operator: Equal
    value: infra
  triggers:
    trigger.on-deployed: |
      - when: app.status.sync.status == 'Synced'
        send: [app-deployed]
    trigger.on-sync-failed: |
      - when: app.status.sync.status == 'Failed'
        send: [app-sync-failed]
redis:
  enabled: true
  nodeSelector:
    node-pool: infra
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  tolerations:
  - effect: NoSchedule
    key: node-pool
    operator: Equal
    value: infra
redis-ha:
  enabled: false
repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
  nodeSelector:
    node-pool: infra
  replicas: 1
  resources:
    limits:
      cpu: 1
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 1Gi
  tolerations:
  - effect: NoSchedule
    key: node-pool
    operator: Equal
    value: infra
server:
  config:
    repositories: |
      - type: git
        url: https://github.com/monobaselabs/monobase-infra.git
      # Add client repositories here
    resource.customizations: |
      argoproj.io/Application:
        health.lua: |
          hs = {}
          hs.status = "Progressing"
          hs.message = ""
          if obj.status ~= nil then
            if obj.status.health ~= nil then
              hs.status = obj.status.health.status
              if obj.status.health.message ~= nil then
                hs.message = obj.status.health.message
              end
            end
          end
          return hs
    url: https://argocd.example.com
  extraArgs:
  - --insecure
  ingress:
    enabled: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
  nodeSelector:
    node-pool: infra
  rbacConfig:
    policy.csv: |
      # Default policies
      p, role:readonly, applications, get, */*, allow
      p, role:readonly, projects, get, *, allow

      # Admin role
      g, admin, role:admin
    policy.default: role:readonly
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  tolerations:
  - effect: NoSchedule
    key: node-pool
    operator: Equal
    value: infra
