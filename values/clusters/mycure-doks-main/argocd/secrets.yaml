# Infrastructure Secrets - Provider-Agnostic Schema
# Location determines scope: infrastructure-level secrets for cluster-wide services

secrets:
  # Cloudflare API Token for external-dns (DNS record management)
  - name: cloudflare-api-token
    remoteRef: infrastructure-cloudflare-api-token
    targetNamespace: external-dns
    keys:
      - key: api-token
        remoteKey: infrastructure-cloudflare-api-token

  # Tailscale operator OAuth client (Devices Core write + Auth Keys write, tag:k8s-operator).
  # Consumed by charts/tailscale-operator's own ExternalSecret (target Secret: operator-oauth).
  - name: tailscale-operator-oauth
    remoteRef: infrastructure-tailscale-operator-oauth
    targetNamespace: tailscale
    keys:
      - key: client_id
        remoteKey: infrastructure-tailscale-operator-oauth-client-id
      - key: client_secret
        remoteKey: infrastructure-tailscale-operator-oauth-client-secret
