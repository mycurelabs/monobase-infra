# ===== DATABASE: PostgreSQL (HA, Tier 4.2) =====
# Replication mode: 1 primary + 1 read replica with streaming replication.
# Migrator dual-write grew the DB to ~187GB (5x the original ~35GB MongoDB
# projection), filling the 200Gi volumes on 2026-06-25 and crashlooping the
# primary (disk-full during WAL redo). Bumped 200Gi -> 300Gi. Growth rate
# needs review — this will refill. See plan: tier 4.2 in DIFF.md.
postgresql:
  enabled: true

  fullnameOverride: "postgresql"

  architecture: replication

  image:
    repository: bitnamilegacy/postgresql
    tag: 16.4.0-debian-12-r13

  auth:
    enabled: true
    database: hapihub
    username: postgres
    existingSecret: postgresql
    replicationUsername: repl_user
    secretKeys:
      adminPasswordKey: postgres-password
      replicationPasswordKey: postgres-replication-password

  primary:
    # Dedicated 1-node pool (g-4vcpu-16gb, 4 dedicated vCPU): big-box
    # onboarding syncs are CPU-bound on the primary, so it gets dedicated
    # silicon with no co-tenants.
    nodePool: "prod-db"
    persistence:
      enabled: true
      storageClass: ""
      # 400Gi: emergency-expanded live on 2026-06-29 during a changelog-spike
      # disk-fill; this reconciles repo+STS template to the live PVC. Read
      # replica stays 300Gi. See disk-full incident notes.
      size: 400Gi
    resources:
      requests:
        cpu: 2000m
        memory: 12Gi
      limits:
        # 3500m not 4000m: leaves ~400m for the node's daemonsets (cilium,
        # kube-proxy, velero node-agent, node-exporter) on the 4-vCPU node.
        cpu: 3500m
        memory: 12Gi  # bumped 8Gi->12Gi 2026-06-29: primary was at ~95% mem (7.6/8Gi), OOM-kill headroom
    # Perf tuning — replaces PG defaults (shared_buffers 128MB / work_mem 4MB)
    # for the 35GB DB; sized to the 8Gi pod limit. See node-separation issue
    # for the CPU-oversubscription follow-up. Applying restarts the primary.
    #
    # shared_preload_libraries: bitnami's default is 'pgaudit' — keep it and
    # add pg_stat_statements (mono#2129 follow-up: query attribution was
    # impossible during the incident). Requires the restart this block already
    # implies; CREATE EXTENSION pg_stat_statements in the hapihub DB after.
    extendedConfiguration: |
      shared_preload_libraries = 'pgaudit, pg_stat_statements'
      shared_buffers = 2GB
      effective_cache_size = 5GB
      work_mem = 16MB
      maintenance_work_mem = 256MB
      random_page_cost = 1.1
      effective_io_concurrency = 200
      # M4 cutover (2026-07-10): 96 cadence workers connect at boot; default 100
      # was exhausted on the preprod rehearsal. Restart PG to apply.
      max_connections = 300
      # Slow-query logging (2026-07-15 perf review): every finding had to be dug
      # out of pg_stat_statements because durations weren't logged. Already live
      # via ALTER SYSTEM (postgresql.auto.conf) — this line just reconciles the
      # repo; the restart it implies is behaviorally a no-op for this setting.
      log_min_duration_statement = 1000
  readReplicas:
    replicaCount: 1
    # NOTE: the read replica PVC (data-postgresql-read-0) is excluded from Velero
    # backups — it is a byte-copy of the primary, redundant for DR. The exclusion
    # is applied as a label directly on the PVC (cannot be set via this chart: a
    # StatefulSet's volumeClaimTemplate is immutable on update, so a persistence
    # label change would be rejected by the API server):
    #   kubectl -n mycure-production label pvc data-postgresql-read-0 \
    #     velero.io/exclude-from-backup=true --overwrite
    # Re-apply this label if the replica PVC is ever re-created (e.g. re-clone).
    persistence:
      enabled: true
      storageClass: ""
      size: 300Gi
    resources:
      requests:
        cpu: 100m
        memory: 4Gi
      limits:
        cpu: 2000m
        memory: 8Gi
    # Keep the replica's config in lockstep with the primary (idle today, but
    # ready for read-offload and consistent on promotion). Restarts the replica.
    # primary_slot_name pins the replica to a persistent physical slot
    # (pg_read_replica) so the primary retains WAL until the replica consumes it
    # — prevents the "WAL segment already removed" death the replica hit on
    # 2026-06-25. Capped on the primary by max_slot_wal_keep_size=80GB so a dead
    # replica can't refill the primary disk.
    extendedConfiguration: |
      shared_preload_libraries = 'pgaudit, pg_stat_statements'
      shared_buffers = 2GB
      effective_cache_size = 5GB
      work_mem = 16MB
      maintenance_work_mem = 256MB
      random_page_cost = 1.1
      effective_io_concurrency = 200
      # M4 cutover (2026-07-10): 96 cadence workers connect at boot; default 100
      # was exhausted on the preprod rehearsal. Restart PG to apply.
      max_connections = 300
      log_min_duration_statement = 1000
      primary_slot_name = 'pg_read_replica'
    # Startup probe gates liveness during the initial pg_basebackup. The DB is
    # ~140GB, so a re-clone takes ~90min — the default liveness probe would
    # SIGKILL the pod every ~90s and restart the clone forever. 180min ceiling
    # (720 * 15s). See disk-full / replica re-clone incident 2026-06-25.
    customStartupProbe:
      exec:
        command:
          - /bin/sh
          - -c
          - exec pg_isready -U postgres -d dbname=hapihub -h 127.0.0.1 -p 5432
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 720
      successThreshold: 1

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# ===== CACHE: Valkey (Redis) — Tier 4.3 =====
valkey:
  enabled: true

  global:
    security:
      allowInsecureImages: true

  auth:
    existingSecret: valkey

  architecture: standalone

  image:
    repository: bitnamilegacy/valkey
    tag: 8.0.1-debian-12-r2

  master:
    persistence:
      enabled: true
      storageClass: ""
      # 2026-06-15: bumped 4Gi → 32Gi after the 4Gi PVC filled (cadence
      # change-log growth), out-of-space write corrupted AOF seqs 13/15/16,
      # valkey crashlooped 213× over 22h → fleet-wide sync outage. PVC
      # patched live, AOF repaired via valkey-check-aof --fix, this value
      # bumped to reconcile the STS template. The underlying root cause
      # (unbounded change-log growth) is unchanged — 32Gi just moves the
      # deadline. See: cadence change-log TTL/trim follow-up issue.
      size: 32Gi
    # Resource sizing history: 512Mi -> 277 restarts in 27h (staging,
    # 2026-04-06); 1Gi still OOMs during AOF replay; 2Gi OOM-crashlooped
    # 2026-06-11 with a 1.6G AOF (cadence change-log growth). 4Gi unblocks,
    # but the dataset grows unboundedly — needs change-log trimming/TTL
    # before this limit is hit again. CPU at 1 core so AOF replay doesn't
    # starve the liveness probe.
    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        cpu: 1000m
        memory: 4Gi
    # `--maxmemory 3GB` + `noeviction` dropped 2026-06-25 after cadence
    # 0.5.36 (Phase 4a, mycurelabs/monobase-mycure#1988) stopped writing
    # the Valkey changelog when readFrom=Pg. Without changelog writes,
    # Valkey's working set is the seq counter + peer tokens + JWKS cache
    # + watermarks — under 100 MiB at prod load. The 3 GiB cap was
    # triggering false OOM-as-policy events (2026-06-24 09:36 UTC
    # incident) before the container's k8s limit became relevant. Let
    # the container limit do the actual ceiling now; if Valkey ever
    # gets near 4 GiB again something is seriously wrong (changelog
    # writes back on, or a new dataset class arrived) and we want a
    # real signal, not an artificial OOM cycle.

# ===== STORAGE: MinIO Object Storage =====
minio:
  enabled: false

  fullnameOverride: "minio"

  image:
    repository: bitnamilegacy/minio
    tag: "2025.7.23-debian-12-r3"

  mode: standalone

  statefulset:
    replicaCount: 1

  auth:
    existingSecret: minio

  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  defaultBuckets: "monobase-files"

  buckets:
    - name: "monobase-files"
  region: "us-east-1"

  podSecurityContext:
    enabled: true
    fsGroup: 1001
    fsGroupChangePolicy: "OnRootMismatch"

  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  gateway:
    enabled: true
    hostname: ""
    rateLimit:
      enabled: false

# ===== ARTIFACTS STORE: public-read MinIO for desktop releases =====
# Dedicated MinIO serving Tauri auto-updater manifests + installers at
# artifacts.localfirsthealth.com. Replaces the legacy downloads.mycure.md box.
minio-artifacts:
  enabled: true

  image:
    repository: bitnamilegacy/minio
    tag: "2025.7.23-debian-12-r3"

  persistence:
    size: 10Gi

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  gateway:
    hostname: ""  # defaults to artifacts.localfirsthealth.com
    sectionName: https-lfh

# ===== EMAIL TESTING: Mailpit =====
mailpit:
  enabled: false

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  gateway:
    enabled: true
    hostname: ""

# infra L4 UDP LoadBalancer (DigitalOcean) for the cadence v2 QUIC path. Provisioned AHEAD of the v1→v2
# cutover so its EXTERNAL-IP is known for cadence.publicAddr; idle (no healthy backend) until cadence v2
# deploys. externalTrafficPolicy Cluster (SNAT) is required for the QUIC handshake.
udpGateway:
  enabled: true
  targetSelector:
    app.kubernetes.io/name: cadence
  port: 6472
  healthPort: 6472

# ===== cadence-relay — self-hosted iroh relay for hard-NAT boxes (prod) =====
# Own LB + cert (cadence-relay.localfirsthealth.com) + QUIC addr-disc (7842/UDP) so the anchor can home on
# it. Stands up idle; the anchor/box cutover to it (relayUrl + maestroapp our-relay-only) is a coordinated
# fleet window. Proven on preprod 2026-07-31.
cadenceRelay:
  enabled: true
  image:
    repository: n0computer/iroh-relay
    tag: "v1.0.2"
  # hostname defaults to cadence-relay.{global.domain} = cadence-relay.localfirsthealth.com
  nodePool: "prod-apps"

# ===== P2P SYNC: Cadence v2 (iroh 1.0 QUIC) — Tier 4.4 =====
# The anchor hub. Reachability via the infra udpGateway LB below (a fresh prod DO UDP LoadBalancer — preprod's
# IP is not reusable). Watches the LIVE hapihub app DB: installs cadence_* side-tables + capture triggers on
# the live tables at startup and baselines existing rows (ships the #2823 baseline fix + #2817 re-baseline).
cadence:
  enabled: true
  rustLog: "cadence=info,cadence_routing=debug,warn"
  image:
    repository: ghcr.io/mycurelabs/cadence
    tag: "2.1.47" # lockstep fleet roll (boxes on maestroapp 2.1.47, mono#2833): any-origin LeafIds push (mono#3111); preprod-soaked (#245)
    pullPolicy: Always # relay cutover; also avoids stale node cache from any reused tag
  udpPort: 6472
  # udp-gateway DO LoadBalancer EXTERNAL-IP (provisioned via monobase-infra#172) — the anchor advertises
  # this so peers reach the hub directly by EndpointId.
  publicAddr: "137.184.250.197:6472"
  # Home on the self-hosted relay + advertise it so boxes (maestroapp 2.0.28, our-relay-only) adopt it.
  relayUrl: "https://cadence-relay.localfirsthealth.com"
  nodePool: "prod-apps"
  serviceMonitor:
    enabled: true
  # Watch the LIVE hapihub app DB (not an isolated cadence DB), matching preprod + the legacy cadence.
  # Prod's writer service is `postgresql-primary` (preprod's is the default `postgresql`); cadence WRITES
  # (side-tables + capture) so it must target the primary, not a read replica.
  postgresql:
    serviceName: postgresql-primary
    auth:
      database: hapihub
  gateway:
    sectionName: https-lfh
    hostnames:
      - cadence.localfirsthealth.com
    # QUIC via the shared gateway (UDPRoute; cadence LB consolidation). Prod keeps
    # canonical port 6472 on the shared LB IP. Route is live alongside the legacy
    # udp-gateway LB; cutover = flipping publicAddr after preprod soak.
    udpListener: cadence-quic-prod
  # hapihub is the SOLE AS (mints box grants + the hub's own '*' grant). The enroll initContainer
  # authorizes '*' against the programmatic /sync/authorize with the service-account API key (--bearer);
  # runtime grant verification is against hapihub's JWKS.
  auth:
    issuerUrl: https://hapihub.localfirsthealth.com
    grantJwksUri: https://hapihub.localfirsthealth.com/.well-known/jwks.json
    fleetId: mycure-production
    authorizeUrl: https://hapihub.localfirsthealth.com/sync/authorize
  # Service-account API key (better-auth, service@mycure.md, non-expiring) → secret cadence-secrets.
  # `mycure-production-cadence-sa-api-key` is provisioned in GCP Secret Manager; the hub presents it as --bearer.
  externalSecrets:
    enabled: true
    secretStore: gcp-secretstore
    secretStoreKind: ClusterSecretStore
    refreshInterval: 1h
    secrets:
      - secretKey: sa-api-key
        remoteKey: mycure-production-cadence-sa-api-key

# ===== BACKUP =====
backup:
  enabled: false

# ===== SECURITY =====
podSecurityStandards:
  enabled: true
  level: restricted

# ===== RESOURCE QUOTAS =====
resourceQuotas:
  enabled: false
