# Production overlay over values/deployments/_base/mycure.yaml (helm merge:
# base first, this file wins per key; arrays replace wholesale).
# MyCure Production Configuration
# Production environment on DigitalOcean Kubernetes (DOKS)

global:
  domain: localfirsthealth.com
  namespace: mycure-production
  environment: production

  # PUBLIC: client-facing prod is internet-exposed BY INTENT — the only
  # deployment allowed on the public gateway. Everything else inherits the
  # tailnet-only default from _base (deny-first).
  gateway:
    name: nginx-public-gateway
    namespace: nginx-gateway-system

  # Role-based pools: prod-db / prod-apps / infra / nonprod. Taints
  # (node-pool=<name>:NoSchedule) make placement enforced, not advisory.
  # The PG primary overrides to prod-db below.
  nodePool: "prod-apps"

# Strict gateway ingress (promoted from the preprod canary, infra#313): drops
# the baseline's blanket nginx-gateway-system → all-pods allow; every prod
# workload relies on its own port-scoped gateway rule. Verified pre-flight that
# all HTTPRoute backends already carry a matching NetworkPolicy (hapihub:7500,
# app clones:8080, hapihub-docs:8080, minio:9000; cadence/relay own any-source
# NPs), so this only removes the redundant blanket fallback.
securityBaseline:
  strictGatewayIngress: true

mycure-dashboard:
  resources:
    requests:
      cpu: 10m
  gateway:
    sectionName: https-lfh

  config:
    # Point at hapihub-next (v11.9.1) — dashboard 0.7.0 uses v11-only routes
    # (HR module, messaging, OAS-routed handlers). The canonical hapihub at
    # https://hapihub.localfirsthealth.com is still v10 (Mongo) and missing
    # those endpoints. The image baked-in default for HAPIHUB_URL is
    # https://api.mycure.md which also points at v10, so we must override
    # both env vars. Revert to https://hapihub.localfirsthealth.com once the
    # v10→v11 cutover swaps that hostname onto v11.
    API_URL: "https://hapihub-next.localfirsthealth.com"
    HAPIHUB_URL: "https://hapihub-next.localfirsthealth.com"

mycure-pxp:
  resources:
    requests:
      cpu: 10m
  gateway:
    sectionName: https-lfh

  config:
    API_URL: "https://hapihub-next.localfirsthealth.com"

hapihub:
  image:
    # DIGEST-PINNED (safeguard): the #3403 R4 authnz release RE-USED tag 11.20.102 (re-pushed 2026-08-19 to
    # sha256:d0f4bebd = the always-enforce R4 image), colliding with this pin. Pinning to the pre-R4 digest
    # prod already runs (cbfc4323) immunizes prod against pulling R4 on any scale/restart while HOLD-PROD is
    # in effect (preprod-validation-first). Revert to a bare version tag once R4 is validated + promoted.
    # NEVER deploy 11.20.62 (mid-response abort/502 storm) or 11.20.44 (stale binary).
    tag: "11.20.102@sha256:cbfc4323ba59d8d59b121115227503d9056637bff73eadde3c2cd4471370574a"
  cache:
    # Response cache OFF in prod — interim mitigation for the single-hot-key
    # bentocache stampede that wedged prod (#179, #2839, #2617). The serve-stale
    # fix (mono #2866, in 11.20.97) is meant to make it safe to re-enable; keep
    # off until that's re-validated.
    enabled: false

  # Daily cleanup of expired Better Auth sessions (they never self-delete).
  replicaCount: 3

  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 4Gi

  gateway:
    hostnames:
      # Canonical host. Carries the cadence OAuth AS metadata
      # (token_endpoint/jwks_uri minted from EXTERNAL_ADDRESS = this host,
      # immutable = better-auth baseURL).
    - hapihub.localfirsthealth.com
      # Alias — frontends/cadence call it; keep until they migrate.
    - hapihub-next.localfirsthealth.com
    sectionName: https-lfh # Use localfirsthealth.com HTTPS listener
    # No additionalSectionNames: not on api.mycure.md (Better Auth rpId is
    # localfirsthealth.com; api.mycure.md would need cross-domain cookie handling).
  betterAuth:
    passkey:
      rpName: "Mycure"
      rpId: "localfirsthealth.com"

  config:
    CORS_ORIGINS: "https://mycure.localfirsthealth.com,https://mycurelocal.localfirsthealth.com,https://mycure-myaccount.localfirsthealth.com,https://mycure-dashboard.localfirsthealth.com,https://mycure-pxp.localfirsthealth.com"
    STORAGE_DOWNLOAD_URL_HOST: "https://hapihub-next.localfirsthealth.com"
    # mono#2114: background jobs (exports, email, doc-ingestion, PDF/Chromium)
    # moved to the hapihub-worker release below — a single export/PDF
    # job landing on an API pod ballooned it toward the memory limit.
    RUN_WORKERS: "false"

  env:
    # #2114 OOM stopgap: JSC sizes heap-growth heuristics off machine RAM, not
    # the cgroup — under burst allocation the heap overshoots the container
    # limit before a full GC runs. Force it to see 3GiB (limit is 4Gi; the
    # remaining ~1GiB covers non-JSC memory: Buffers, in-pod Chromium/export
    # workers — RUN_WORKERS=true here).
  - name: BUN_JSC_forceRAMSize
    value: "3221225472"
  - name: BETTER_AUTH_RATE_LIMIT_ENABLED
    value: "true"
  - name: BETTER_AUTH_RATE_LIMIT_WINDOW
    value: "60"
  - name: BETTER_AUTH_RATE_LIMIT_MAX
    value: "300"
  - name: BETTER_AUTH_SESSION_COOKIE_CACHE_ENABLED
    value: "false"
    # Email: Postmark transactional (OTP, magic links, verification, resets)
  - name: EMAIL_PROVIDER
    value: "postmark"
  - name: POSTMARK_API_KEY
    valueFrom:
      secretKeyRef:
        name: hapihub-secrets
        key: POSTMARK_API_KEY
  - name: EMAIL_FROM_EMAIL
    value: "no-reply@mycure.md"
  - name: EMAIL_FROM_NAME
    value: "MyCure"
    # cadence OAuth Authorization Server (v1→v2 prod cutover). hapihub is the SOLE AS: it mints box grants
    # AND the hub's own '*' grant with this EdDSA key. The values are advertised in
    # /.well-known/cadence-configuration.json so a box derives its sync hub (cadence_seed_url) + fleet (aud)
    # from the single api URL — single-URL onboarding. CADENCE_ISSUER_KEY (the PEM) is the externalSecret below.
  - name: CADENCE_ISSUER_ISS
    value: "cadence-production-issuer"
  - name: CADENCE_ISSUER_KID
    value: "k1"
  - name: CADENCE_ISSUER_FLEET_ID
    value: "mycure-production"
  - name: CADENCE_ISSUER_AUTHORIZE_URL
    value: "https://mycure.localfirsthealth.com/oauth/authorize"
  - name: CADENCE_ISSUER_SEED_URL
    value: "https://cadence.localfirsthealth.com"

  autoscaling:
    enabled: true
    # min 2 for HA; max 4 keeps one burst replica over the pre-incident 3.
    # (Incident-era max 5 right-sized after the mono#2114 fix — post-fix the
    # HPA idles at 2 with CPU ~35% of target.)
    minReplicas: 2
    maxReplicas: 4

  externalSecrets:
    secrets:
      # cadence issuer EdDSA signing key (prod cutover) — hapihub mints box + hub grants with it.
    - secretKey: CADENCE_ISSUER_KEY
      remoteKey: mycure-production-cadence-issuer-key-pem
      # Google OAuth
    - secretKey: GOOGLE_CLIENT_ID
      remoteKey: mycure-production-google-oauth-client-id
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteKey: mycure-production-google-oauth-client-secret
    - secretKey: STRIPE_SECRET_KEY
      remoteKey: mycure-production-stripe-secret-key
      # Encryption keys
    - secretKey: ENC_BILLING_INVOICES
      remoteKey: mycure-production-enc-billing-invoices
    - secretKey: ENC_BILLING_ITEMS
      remoteKey: mycure-production-enc-billing-items
    - secretKey: ENC_BILLING_PAYMENTS
      remoteKey: mycure-production-enc-billing-payments
    - secretKey: ENC_MEDICAL_RECORDS
      remoteKey: mycure-production-enc-medical-records
    - secretKey: ENC_PERSONAL_DETAILS
      remoteKey: mycure-production-enc-personal-details
      # JWT/Auth keys
    - secretKey: PRIVATE_KEY
      remoteKey: mycure-production-private-key
    - secretKey: PUBLIC_KEY
      remoteKey: mycure-production-public-key
      # Storage configuration (GCP)
    - secretKey: STORAGE_BUCKET
      remoteKey: mycure-production-storage-bucket
    - secretKey: STORAGE_CLIENT_EMAIL
      remoteKey: mycure-production-storage-client-email
    - secretKey: STORAGE_DIRECTORY
      remoteKey: mycure-production-storage-directory
    - secretKey: STORAGE_PRIVATE_KEY
      remoteKey: mycure-production-storage-private-key
    - secretKey: STORAGE_PROJECT_ID
      remoteKey: mycure-production-storage-project-id
    - secretKey: STORAGE_TYPE
      remoteKey: mycure-production-storage-type
      # Stripe configuration
    - secretKey: STRIPE_KEY
      remoteKey: mycure-production-stripe-key
    - secretKey: STRIPE_CHECKOUT_SUCCESS_URL
      remoteKey: mycure-production-stripe-checkout-success-url
    - secretKey: STRIPE_CHECKOUT_CANCEL_URL
      remoteKey: mycure-production-stripe-checkout-cancel-url
    - secretKey: AUTH_SECRET
      remoteKey: mycure-production-auth-secret
    - secretKey: BETTER_AUTH_SECRET
      remoteKey: mycure-production-better-auth-secret
      # Email (Postmark) — OTP, magic links, verification, password resets
    - secretKey: POSTMARK_API_KEY
      remoteKey: mycure-production-postmark-api-key

  postgresql:
    serviceName: postgresql-primary
hapihubWorker:
  enabled: true

  replicaCount: 1

  # Explicit resources — the worker app deep-merges hapihub values, so
  # without this it would inherit the API release's 1Gi request. The worker
  # runs exports/PDF-Chromium which legitimately spike; keep a 2Gi request.
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

  config:
    RUN_WORKERS: "true"

  # No external traffic: keep the Service (probes) but no routes.
  gateway:
    enabled: false
    storageRoute:
      enabled: false
    snippetsPolicy:
      enabled: false

  # The API release owns the daily session-prune cronjob.
  pruneExpiredSessions:
    enabled: false

  # Fixed single replica — job throughput does not need an HPA, and pg-boss
  # handles multi-consumer anyway if this is ever raised.
  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

# ===== HEALTHCARE: Frontend Application =====
mycure:
  image:
    tag: "10.25.120"
  resources:
    requests:
      cpu: 10m
  gateway:
    sectionName: https-lfh # Use localfirsthealth.com HTTPS listener

  config:
    # Points at the retained hapihub-next alias (served by the canonical hapihub
    # release). Can be flipped to https://hapihub.localfirsthealth.com once all
    # frontends are migrated off the alias.
    API_URL: "https://hapihub-next.localfirsthealth.com"
    HAPIHUB_URL: "https://hapihub-next.localfirsthealth.com"
    # PostHog product analytics. Public project key (phc_...), safe to commit —
    # it ships to the browser anyway. Blank on demo/preprod keeps analytics off
    # there. Host blank → defaults to https://us.i.posthog.com (free plan, US).
    POSTHOG_KEY: "phc_yHbJY82kkxQ5YGUc6Z6J438SYxQfCrSJCptG2LkhM9yE"
    POSTHOG_HOST: ""
    # GA4 measurement id — public, ships to the browser. Read at runtime via
    # /config.json (mono#2522 pattern, same as PostHog); inert until mycureapp
    # ships that PR. Prod-only: leaving it unset on demo/preprod keeps GA4 off.
    GA4_MEASUREMENT_ID: "G-WFLMM2PV7W"

mycurelocal:
  enabled: true

  resources:
    requests:
      cpu: 10m
  gateway:
    hostnames:
    - hostname: mycurelocal.localfirsthealth.com
      sectionName: https-lfh
    - hostname: find.mycure.md
      sectionName: https-mycure

mycure-myaccount:
  enabled: true

  resources:
    requests:
      cpu: 10m
  gateway:
    sectionName: https-lfh # Use localfirsthealth.com HTTPS listener

  config:
    API_URL: "https://hapihub-next.localfirsthealth.com"
    HAPIHUB_URL: "https://hapihub-next.localfirsthealth.com"

hapihub-docs:
  enabled: true

  resources:
    requests:
      cpu: 10m
  gateway:
    hostname: "docs.localfirsthealth.com"
    sectionName: https-lfh

postgresql:
  architecture: replication

  auth:
    replicationUsername: repl_user
    secretKeys:
      replicationPasswordKey: postgres-replication-password

  primary:
    # Dedicated 1-node pool (g-4vcpu-16gb, 4 dedicated vCPU): big-box
    # onboarding syncs are CPU-bound on the primary, so it gets dedicated
    # silicon with no co-tenants.
    nodePool: "prod-db"
    persistence:
      size: 400Gi
    resources:
      requests:
        cpu: 2000m
        memory: 12Gi
      limits:
        # 3500m not 4000m: leaves ~400m for the node's daemonsets (cilium,
        # kube-proxy, velero node-agent, node-exporter) on the 4-vCPU node.
        cpu: 3500m
        memory: 12Gi  # working set ~8Gi; 12Gi gives OOM headroom
    # Perf tuning — replaces PG defaults (shared_buffers 128MB / work_mem 4MB).
    # Applying restarts the primary.
    #
    # shared_preload_libraries: keep bitnami's default 'pgaudit' and add
    # pg_stat_statements for query attribution (CREATE EXTENSION
    # pg_stat_statements in the hapihub DB on a fresh install).
    extendedConfiguration: |
      shared_preload_libraries = 'pgaudit, pg_stat_statements'
      shared_buffers = 2GB
      effective_cache_size = 5GB
      work_mem = 16MB
      maintenance_work_mem = 256MB
      random_page_cost = 1.1
      effective_io_concurrency = 200
      # 96 cadence workers connect at boot; the default 100 is too small.
      # Restart PG to apply.
      max_connections = 300
      # Log statements >=1s (also set via ALTER SYSTEM in postgresql.auto.conf).
      log_min_duration_statement = 1000
      # Autovacuum throughput: 3 workers @ cost_limit 200 (PG defaults) can't
      # keep up on this 157GB write-heavy DB — large tables
      # (medical_records_history ~45GB, cadence_meta ~23GB) were vacuumed once
      # in 5 days. More workers + 10x cost budget lets autovacuum keep pace;
      # per-table scale_factor overrides on the worst offenders ship in hapihub
      # migration 0087. max_workers needs a restart (applied with this block);
      # cost_limit and naptime are reload-only.
      autovacuum_max_workers = 6
      autovacuum_vacuum_cost_limit = 2000
      autovacuum_naptime = 30s
  readReplicas:
    replicaCount: 1
    # NOTE: the read replica PVC (data-postgresql-read-0) is excluded from Velero
    # backups — it is a byte-copy of the primary, redundant for DR. The exclusion
    # is applied as a label directly on the PVC (cannot be set via this chart: a
    # StatefulSet's volumeClaimTemplate is immutable on update, so a persistence
    # label change would be rejected by the API server):
    #   kubectl -n mycure-production label pvc data-postgresql-read-0 \
    #     velero.io/exclude-from-backup=true --overwrite
    # Re-apply this label if the replica PVC is ever re-created (e.g. re-clone).
    persistence:
      enabled: true
      storageClass: ""
      size: 300Gi
    resources:
      requests:
        cpu: 500m
        memory: 4Gi
      limits:
        # 3000m (was 2000m): the replica now carries the cadence read plane; a big dense
        # catch-up pinned it at 2000m and the slowed scans tripped the 5s data-plane
        # statement_timeout -> serve rounds errored fleet-wide ("range: no verdict",
        # 2026-08-07). Node (prod-apps) has headroom.
        cpu: 3000m
        memory: 8Gi
    # Keep the replica's config in lockstep with the primary (idle today, but
    # ready for read-offload and consistent on promotion). Restarts the replica.
    # primary_slot_name pins the replica to a persistent physical slot
    # (pg_read_replica) so the primary retains WAL until the replica consumes
    # it — prevents "WAL segment already removed" replica death. Capped on the
    # primary by max_slot_wal_keep_size=80GB so a dead replica can't fill the
    # primary disk.
    extendedConfiguration: |
      shared_preload_libraries = 'pgaudit, pg_stat_statements'
      shared_buffers = 2GB
      effective_cache_size = 5GB
      work_mem = 16MB
      maintenance_work_mem = 256MB
      random_page_cost = 1.1
      effective_io_concurrency = 200
      # 96 cadence workers connect at boot; the default 100 is too small.
      # Restart PG to apply.
      max_connections = 300
      log_min_duration_statement = 1000
      # Autovacuum GUCs kept in lockstep with the primary (inert on a hot
      # standby — autovacuum doesn't run in recovery — but consistent on
      # promotion). See primary block for rationale.
      autovacuum_max_workers = 6
      autovacuum_vacuum_cost_limit = 2000
      autovacuum_naptime = 30s
      primary_slot_name = 'pg_read_replica'
      # The replica serves the cadence read plane: long reconcile scans were being
      # canceled by WAL-replay conflicts ("conflict with recovery", 2026-08-07 —
      # the dominant serve-death class after the 30s timeout fix). Feedback makes
      # the primary retain tuples the standby's queries still need (bloat bounded
      # by the 30s read statement cap); the delay lets replay wait out a long scan
      # instead of killing it (lag is over-reconcile-safe for the sync plane).
      hot_standby_feedback = on
      max_standby_streaming_delay = 120s
    # Startup probe gates liveness during the initial pg_basebackup. A full
    # re-clone of the ~190GB DB takes ~2h — the default liveness probe would
    # SIGKILL the pod every ~90s and restart the clone forever. 180min ceiling
    # (720 * 15s).
    customStartupProbe:
      exec:
        command:
        - /bin/sh
        - -c
        - exec pg_isready -U postgres -d dbname=hapihub -h 127.0.0.1 -p 5432
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 720
      successThreshold: 1

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# ===== CACHE: Valkey (Redis) — Tier 4.3 =====
valkey:
  master:
    persistence:
      size: 32Gi
    # 4Gi limit: AOF replay OOMs at 2Gi with a large AOF, and the dataset
    # grows unboundedly until change-log trimming/TTL ships. CPU at 1 core so
    # AOF replay doesn't starve the liveness probe.
    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        cpu: 1000m
        memory: 4Gi
    # No --maxmemory cap: with readFrom=Pg cadence writes no Valkey
    # changelog, so the working set (seq counter, peer tokens, JWKS cache,
    # watermarks) stays under ~100 MiB at prod load. A soft cap produces
    # false OOM-as-policy events; the container limit is the ceiling. If
    # Valkey nears 4 GiB, changelog writes are back on or a new dataset
    # class arrived — we want a real signal, not an artificial OOM cycle.

# ===== STORAGE: MinIO Object Storage =====
minio:
  enabled: false

minio-artifacts:
  enabled: true

  image:
    repository: bitnamilegacy/minio
    tag: "2025.7.23-debian-12-r3"

  persistence:
    # 20Gi (was 10Gi): pre-keep-5 backlog hit 90%. Publisher keep-5 now bounds this
    # to ~2.5Gi (mono #3316), so 20Gi is generous headroom. Kept at 20Gi — a PVC
    # can't be shrunk in-place, and reclaiming isn't worth a delete+recreate.
    size: 20Gi

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  gateway:
    hostname: ""  # defaults to artifacts.localfirsthealth.com
    sectionName: https-lfh

# ===== EMAIL TESTING: Mailpit =====
mailpit:
  enabled: false

  gateway:
    hostname: ""

# ===== cadence-relay — self-hosted iroh relay for hard-NAT boxes (prod) =====
# Own LB + cert (cadence-relay.localfirsthealth.com) + QUIC addr-disc (7842/UDP) so the anchor can home
# on it; the anchor advertises it and boxes run maestroapp our-relay-only.
cadenceRelay:
  nodePool: "prod-apps"
  # Whole relay on the PUBLIC gateway (retires the dedicated DO LB, #328). 443 leg via HTTPRoute +
  # BackendTLSPolicy; QUIC leg via UDPRoute on relay-quic-prod (iroh default 7842). Mirrors the
  # proven preprod config. The in-cluster anchor reaches the relay via the coredns hairpin → this
  # Service's ClusterIP.
  # The 2026-08-07 attempt failed only because it was a MID-DAY cutover: the full online fleet
  # reconnected in one synchronized herd and flooded the relay. Retried OFF-HOURS (no clinic hours,
  # fleet powered down) so the at-cutover reconnect is negligible and the morning power-on ramp is
  # naturally staggered — the reconnect load the relay already absorbs daily.
  serviceType: ClusterIP
  gatewayRoute:
    enabled: true
    hostname: cadence-relay.localfirsthealth.com
    sectionName: https-lfh
    udpListener: relay-quic-prod

# ===== P2P SYNC: Cadence v2 (iroh 1.0 QUIC) — Tier 4.4 =====
# The anchor hub. Reachability via the shared gateway's UDPRoute (preprod's
# IP is not reusable). Watches the LIVE hapihub app DB: installs cadence_* side-tables + capture triggers on
# the live tables at startup and baselines existing rows (ships the #2823 baseline fix + #2817 re-baseline).
cadence:
  publicAddr: "104.248.98.161:6472"
  # INTERIM (relay disabled → n0 public, operator-approved): the self-hosted relay's HTTP-upgrade handshake
  # is 100% broken through the shared gateway (TLS-terminate + re-encrypt mangles the long-lived iroh
  # upgrade → relay log is a solid flood of "did not reach established within timeout"). A dead relay path
  # makes the hub tight-loop open_path_on_all_conns → create_sender per retry → senders pile on the hub →
  # OOM (every ~50min). Unset relayUrl → RelayMode reverts to n0's public relay (functional): hub stops
  # retrying the dead path (OOM should stop) AND hard-NAT boxes get a working relay. Preprod-proven: relay
  # flood stopped ~2min after cutover, box reached the hub via n0. Re-set once the gateway route is repaired
  # (SnippetsFilter for the upgrade, in preprod). Empty ⇒ n0 relays (chart default).
  relayUrl: ""
  nodePool: "prod-apps"
  # Prod cadence 2.1.103: /healthz + /readyz on a DEDICATED OS thread. Root of the exit-137 probe-kills was
  # RUNTIME POLL-STARVATION, not a slow probe query: a 112s cache-wall scan pinned all tokio workers so the
  # trivial healthz future never got polled within the 90s liveness tolerance → SIGKILL. Serving health off
  # its own thread makes it always-prompt regardless of sync-runtime saturation → the probe-kill class is now
  # IMPOSSIBLE (the meta_reconcile REINDEX 14→5.8GB was the acute fix; this is the durable one). Carries the
  # OOM fix (2.1.99+2.1.100+2.1.101) + the 2.1.102 PathId::ZERO guard. relay n0; 13Gi; RUST_BACKTRACE=full
  # kept until no-more-139 confirmed. sha256:582b10a6ef7db764af2d24bbcdd84d5def8b1014427c408b1145a643e9dad231
  image:
    tag: "2.1.103"
  # Read-idle: how long a catch-up serve stream stays alive on an idle read. 600s keeps the hub from
  # killing serves on slow single large frame bodies (keepalives bridge inter-frame idle, not intra-frame).
  # Safe at 600s as of 2.1.97: the payload-BYTE budget bounds concurrent live payload to 2GB regardless of
  # stream lifetime, so long-lived streams no longer pile up into a live-set OOM (the reason it was briefly
  # dropped to 90s during the 2.1.96 OOM-loop). 600s is wanted for the drain + the #3404/#3406 deeper-tree
  # convergence.
  readIdleMs: 600000
  # DIAGNOSTIC (temporary): full panic backtraces to capture the recurring noq-proto PathId::ZERO panic's
  # primary stack (mod.rs:4150 "PathId::ZERO is alive while Initial/Handshake spaces exist" → poisoned-mutex
  # abort, exit 139, ~every 1.5h — the OOM is fixed but this crash branch remains). The message alone lacks
  # the discard_space caller frame coder needs for the guard fix (2.1.102). Remove once captured.
  rustBacktrace: "full"
  # LeafIds resident budget. As of 2.1.96 this 150k IS the in-code default (+ compile-guard vs re-raise),
  # so this env is now REDUNDANT — kept explicit to document the value and stay pinned if the image ever
  # rolls back to a pre-2.1.96 tag whose default is 1M (which OOMed the hub at 10Gi on 2026-08-14). 150k
  # downgrades the uncapped LeafIds-delta to windowed Leaf = bounded materialization regardless of box push.
  leafidsGlobalBudget: 150000
  # Concurrency cap: the 150k LeafIds budget bounds rows PER serve but NOT summed live payload BYTES across
  # simultaneous serves — ~100 concurrent fat-mrh to_jsonb serves spiked the live-set to 8.4GB and OOMed
  # 2.1.96 at 10Gi (13:09Z; jemalloc showed allocated≈resident, i.e. live-set not arena-retention). Cap
  # to 8 → ~12x less concurrent payload (~700MB) = deterministically under 10Gi (boxes queue, not OOM).
  # Interim until cadence-coder's global payload-BYTE budget + backpressure ships.
  maxConcurrentServes: 8
  # Prod-only bump: the 3Gi chart default OOMKills (exit 137) during prod-scale baseline/reconcile
  # scans — idle working set is only ~570Mi but full-fleet scans spike far past it. Preprod (1 box)
  # stays on the 3Gi default. Not a leak; prod scale > preprod scale.
  # 13Gi (was 10Gi): safety headroom while the concurrency cap takes effect — 10Gi OOMed once under the
  # ~100-concurrent live-set spike (the cap is the real bound; this is belt-and-suspenders). Burst ceiling
  # only, requests stay 1Gi; prod-apps nodes are 16Gi so 13Gi fits (tight — do not raise further without
  # a node right-size).
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 13Gi
  postgresql:
    serviceName: postgresql-primary
    # Read-plane split: the hub's reconcile/serve scan queries go to the (previously idle)
    # replica via CADENCE_DB_READ_URL; writes + LWW admission reads stay on the primary.
    # Preprod-verified: scan plane 386s/10min -> 19ms on the primary.
    readServiceName: postgresql-read
  gateway:
    sectionName: https-lfh
    hostnames:
    - cadence.localfirsthealth.com
    # QUIC via the shared gateway (UDPRoute). Prod keeps canonical port 6472 on the
    # shared LB IP.
    udpListener: cadence-quic-prod
  # hapihub is the SOLE AS (mints box grants + the hub's own '*' grant). The enroll initContainer
  # authorizes '*' against the programmatic /sync/authorize with the service-account API key (--bearer);
  # runtime grant verification is against hapihub's JWKS.
  auth:
    issuerUrl: https://hapihub.localfirsthealth.com
    grantJwksUri: https://hapihub.localfirsthealth.com/.well-known/jwks.json
    fleetId: mycure-production
    authorizeUrl: https://hapihub.localfirsthealth.com/sync/authorize
  # Service-account API key (better-auth, service@mycure.md, non-expiring) → secret cadence-secrets.
  # `mycure-production-cadence-sa-api-key` is provisioned in GCP Secret Manager; the hub presents it as --bearer.
  externalSecrets:
    secrets:
    - secretKey: sa-api-key
      remoteKey: mycure-production-cadence-sa-api-key

