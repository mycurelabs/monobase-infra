# base.yaml -- shared parent for the mycure deployments. disabled so it never
# deploys on its own; each overlay pulls it in via `extends: base`.
disabled: "true"

# Shared base for mycure deployments. Helm merges this first, then the
# per-environment overlay (values/deployments/mycure-<env>.yaml) — later
# file wins per key; MAPS DEEP-MERGE, ARRAYS REPLACE WHOLESALE. Keep any
# array that differs per env entirely in the overlays.
# MyCure Production Configuration
# Production environment on DigitalOcean Kubernetes (DOKS)

global:
  # DENY-FIRST default: every deployment's routes land on the tailnet-only
  # gateway (reachable by tailnet members, invisible to the internet). Public
  # exposure is an explicit opt-in — an overlay must set the PUBLIC-tagged
  # nginx-public-gateway override (prod does).
  gateway:
    name: nginx-internal-gateway
    namespace: nginx-gateway-system

  storage:
    provider: ""
    className: ""

# ===== HEALTHCARE: MyCure Dashboard (operator/admin web UI) =====
mycure-dashboard:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/dashboard
    tag: "0.14.19"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  gateway:
    hostname: ""  # defaults to mycure-dashboard.localfirsthealth.com
  podDisruptionBudget:
    enabled: false

# ===== INTERNAL TOOL: NocoDB (no-code DB UI for business, issue #2041) =====
# Disabled until validated on preprod. Production rollout (separate PR) flips this
# on and adds an ExternalSecret for a stable NC_AUTH_JWT_SECRET + admin bootstrap,
# plus a dedicated read-only Postgres role for the data source.
nocodb:
  enabled: false

# ===== HEALTHCARE: MyCure PXP (patient-facing web app) =====
mycure-pxp:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/pxp
    tag: "2.0.6"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # The pxp image's entrypoint sed-substitutes __PXP_RUNTIME_API_URL__ into
  # /srv/*.{js,html} at container start, so /srv must be writable. Override
  # the chart default (readOnlyRootFilesystem: true).
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: false

  gateway:
    hostname: ""  # defaults to mycure-pxp.localfirsthealth.com
  podDisruptionBudget:
    enabled: false

# ===== HEALTHCARE: HapiHub API (v11) =====
# The canonical hapihub release (releaseName: hapihub). Serves
# hapihub.localfirsthealth.com (canonical) + hapihub-next.localfirsthealth.com
# (alias — frontends/cadence call it; keep until they migrate). PostgreSQL-only.
hapihub:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/hapihub
    pullPolicy: IfNotPresent

  # Valkey response cache (mono#2231). Cached endpoints are declared via
  # x-cache in hapihub's OpenAPI specs (fixtures 12h, services 5m,
  # personal-details 5m). Kill switches: set false here, or
  # `kubectl exec deploy/hapihub -- hapihub cache flush`.
  #
  # DISABLED (mono#2839): the #2617 bentocache lock-backend wedge recurs under
  # prod load — a stalled Valkey lock store turns every same-key getOrSet into
  # `timeout while waiting for mutex` → `_FactoryHardTimeout` (10s), wedging
  # clients. Keep disabled until the lock-store stall is root-caused and a
  # shorter-lock-timeout/degrade-to-direct fix ships.
  pruneExpiredSessions:
    enabled: true

  # NOTE: replicaCount is ignored — autoscaling.enabled: true below means the
  # HPA owns the replica count (chart omits spec.replicas). Scale via
  # autoscaling.minReplicas/maxReplicas.
  resources:
    requests:
      cpu: 500m
      # Steady working set is 0.5–0.6Gi through business hours with rare
      # ~1.1Gi transients; 1Gi fits without over-reserving.
    limits:
      cpu: "2"
      # 4Gi: slow-query/report/export spikes OOM at 2Gi. BUN_JSC_forceRAMSize
      # caps the JS heap so bursts fail inside the pod, not the node.
  gateway:
    snippetsPolicy:
      enabled: false

  config:
    CORS_STRICT: "true"
    CORS_ALLOW_LOCAL_NETWORK: "false"
    CORS_ALLOW_MOBILE_APPS: "true"
    ACCOUNTS_SERVICE_ACCOUNT_EMAILS: "service@mycure.md"
    APPLE_APP_BUNDLE_IDENTIFIER: "com.mycure.pxp"
    # Issue #44: mint storage file/link URLs on the retained hapihub-next alias
    # rather than defaulting to EXTERNAL_ADDRESS (= hapihub.localfirsthealth.com,
    # also Better Auth's baseURL). Requires hapihub >= 11.20.32 (wires storage.downloadURLHost).
  livenessProbe:
    enabled: true

  readinessProbe:
    enabled: true

  podDisruptionBudget:
    enabled: false

  # Port-scoped gateway ingress — required under the security-baseline's
  # strictGatewayIngress (no blanket gateway allow). Egress stays governed
  # by the namespace-wide baseline rules.
  networkPolicy:
    enabled: true
    policyTypes:
      - Ingress
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: nginx-gateway-system
        ports:
          - protocol: TCP
            port: 7500

  externalSecrets:
    enabled: true
    secretStore: gcp-secretstore
    secretStoreKind: ClusterSecretStore
    refreshInterval: 1h
  postgresql:
    enabled: true
    external: false
    auth:
      database: hapihub
      username: postgres
      existingSecret: postgresql

# hapihub-worker: background-job consumer for hapihub
# (mono#2114). Deep-merged onto the hapihub block by the
# hapihub-worker ArgoCD app template — image/config/secrets flow from
# hapihub automatically; only the deltas live here.
mycure:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/mycureapp
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  gateway:
    hostname: ""
  podDisruptionBudget:
    enabled: false

# ===== HEALTHCARE: MyCure Local Frontend Application =====
mycurelocal:
  image:
    repository: ghcr.io/mycurelabs/mycurelocal
    tag: "1.4.2"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  podDisruptionBudget:
    enabled: false

# ===== HEALTHCARE: MyCure MyAccount Application =====
mycure-myaccount:
  image:
    repository: ghcr.io/mycurelabs/myaccount
    tag: "1.0.1"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  gateway:
    hostname: ""
  podDisruptionBudget:
    enabled: false

# ===== HEALTHCARE: HapiHub API Documentation =====
hapihub-docs:
  image:
    repository: ghcr.io/mycurelabs/hapihub-docs
    tag: "1.1.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  podDisruptionBudget:
    enabled: false

# ===== DATABASE: PostgreSQL (HA) =====
# Replication mode: 1 primary + 1 read replica with streaming replication.
# The DB is ~190GB and grows quickly — watch volume headroom (disk-full during
# WAL redo crashloops the primary).
postgresql:
  enabled: true

  fullnameOverride: "postgresql"

  image:
    repository: bitnamilegacy/postgresql
    tag: 16.4.0-debian-12-r13

  auth:
    enabled: true
    database: hapihub
    username: postgres
    existingSecret: postgresql
    secretKeys:
      adminPasswordKey: postgres-password
  primary:
    # Dedicated 1-node pool (g-4vcpu-16gb, 4 dedicated vCPU): big-box
    # onboarding syncs are CPU-bound on the primary, so it gets dedicated
    # silicon with no co-tenants.
    persistence:
      enabled: true
      storageClass: ""
      # 400Gi: ~190GB DB + growth + WAL headroom (max_slot_wal_keep_size=80GB).
      # Read replica is 300Gi.
valkey:
  enabled: true

  global:
    security:
      allowInsecureImages: true

  auth:
    existingSecret: valkey

  architecture: standalone

  image:
    repository: bitnamilegacy/valkey
    tag: 8.0.1-debian-12-r2

  master:
    persistence:
      enabled: true
      storageClass: ""
      # 32Gi: cadence change-log growth can fill smaller volumes, and an
      # out-of-space write corrupts the AOF and crashloops valkey into a
      # fleet-wide sync outage. Unbounded change-log growth is the root
      # cause — 32Gi buys headroom, not a fix. See the cadence change-log
      # TTL/trim follow-up issue.
minio:
  fullnameOverride: "minio"

  image:
    repository: bitnamilegacy/minio
    tag: "2025.7.23-debian-12-r3"

  mode: standalone

  statefulset:
    replicaCount: 1

  auth:
    existingSecret: minio

  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  defaultBuckets: "monobase-files"

  buckets:
  - name: "monobase-files"
  region: "us-east-1"

  podSecurityContext:
    enabled: true
    fsGroup: 1001
    fsGroupChangePolicy: "OnRootMismatch"

  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault

  gateway:
    enabled: true
    hostname: ""

# ===== ARTIFACTS STORE: public-read MinIO for desktop releases =====
# Dedicated MinIO serving Tauri auto-updater manifests + installers at
# artifacts.localfirsthealth.com. Replaces the legacy downloads.mycure.md box.
mailpit:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  gateway:
    enabled: true
cadenceRelay:
  enabled: true
  image:
    repository: n0computer/iroh-relay
    tag: "v1.0.2"
  # hostname defaults to cadence-relay.{global.domain} = cadence-relay.localfirsthealth.com
  tls:
    clusterIssuer: letsencrypt-mycure-cloudflare-prod  # mycure's cloudflare DNS-01 issuer
cadence:
  enabled: true
  rustLog: "cadence=info,cadence_routing=debug,warn"
  image:
    repository: ghcr.io/mycurelabs/cadence
    tag: "2.1.85" # #3252/serve-read-plane: reads_for read-your-writes reads now use the 30s READ cap (fresh_read_pool, primary), not the 5s WRITE cap — an actively-written scope (busy clinic org) had every serve negotiation page cancelled mid-round (SQLSTATE 57014, "serve died mid-round"), so its newest rows never synced down + GUI stuck "syncing" (live: mdt missing billing invoices). mono#3369. PRIOR #3318: jemalloc (2.1.83) + responder LeafIds ROW budget (2.1.84). jemalloc fixed the glibc arena-hoard SLOW ramp but couldn't shrink the genuine LIVE spike: a fam verdict batch materialised reqs:1024/leafids:978 ≈ ~5M (key,version) rows AT ONCE (RSS 548→2642Mi in 1min × MAX_CONCURRENT_SERVES=8) → OOM again. frontier_max caps tile COUNT not ROWS. 2.1.84 adds a per-verdict-batch LeafIds row budget (serve_leafids_row_budget, default 500k): over-budget tiles downgrade to Leaf/Split + heal next round → bounds the responder peak regardless of the initiator's batch width. No wire change. Memory knobs now env-overridable (CADENCE_MAX_CONCURRENT_SERVES/SERVE_LEAFIDS_ROW_BUDGET/LEAF_IDS_MAX). mono#3330, preprod-smoke infra#338. noq exit-139 transport panic still open (3rd-party, churn-amplified)
    pullPolicy: Always # relay cutover; also avoids stale node cache from any reused tag
  udpPort: 6472
  # Shared-gateway LB IP (nginx-public-gateway, UDPRoute path — prod keeps canonical port
  # 6472). Path proven from a real box network (alfheim net-probe: direct=true, 18 Mbps).
  serviceMonitor:
    enabled: true
  # Watch the LIVE hapihub app DB (not an isolated cadence DB), matching preprod + the legacy cadence.
  # Prod's writer service is `postgresql-primary` (preprod's is the default `postgresql`); cadence WRITES
  # (side-tables + capture) so it must target the primary, not a read replica.
  postgresql:
    auth:
      database: hapihub
  externalSecrets:
    enabled: true
    secretStore: gcp-secretstore
    secretStoreKind: ClusterSecretStore
    refreshInterval: 1h
backup:
  enabled: false

# ===== SECURITY =====
podSecurityStandards:
  enabled: true
  level: restricted

# ===== RESOURCE QUOTAS =====
resourceQuotas:
  enabled: false
