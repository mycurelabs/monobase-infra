# Preprod overlay; extends: base (values/deployments/base.yaml, helm merge:
# base first, this file wins per key; arrays replace wholesale).
# MyCure Pre-Production Configuration
# Ephemeral pre-prod rehearsal env on DigitalOcean Kubernetes (DOKS).
# Mirrors mycure-production in component shape (HA Postgres, autoscaling,
# resource sizing) so major changes can be rehearsed. Data is seeded fresh
# (not cloned from prod); secrets are preprod-own (mycure-preprod-* GCP keys),
# isolated from production (#3486 reset). Safety overrides below (mailpit, no
# public linking, short-lived) still apply as defence in depth
# (mailpit, no public linking, short-lived). Tear down with
# `kubectl delete ns mycure-preprod` when the rehearsal is done.

extends: base

global:
  domain: preprod.localfirsthealth.com
  namespace: mycure-preprod
  environment: preprod

  # Preprod lives on the untainted nonprod pool (shared with monitoring/
  # velero); prod pools are tainted so preprod can't land there.
  nodePool: "nonprod"

  # Preprod-own DB/cache credentials, isolated from prod. The database-secrets
  # chart pulls mycure-preprod-* GCP keys for Postgres/Valkey/Minio; the PVCs
  # are re-initialized on these fresh passwords (post-reset, #3486).
  secretPrefix: "mycure-preprod"

# Strict gateway ingress canary (preprod-first): drops the baseline's blanket
# nginx-gateway-system → all-pods allow; apps rely on their own port-scoped
# gateway rules. Promote to prod once preprod routes verify clean.
securityBaseline:
  strictGatewayIngress: true

mycure-dashboard:
  resources:
    requests:
      cpu: 50m
  gateway:
    sectionName: https-preprod-lfh

  config:
    API_URL: "https://hapihub.preprod.localfirsthealth.com"

mycure-pxp:
  resources:
    requests:
      cpu: 50m
  gateway:
    sectionName: https-preprod-lfh

  config:
    API_URL: "https://hapihub.preprod.localfirsthealth.com"

hapihub:
    # Release 11.20.106 (PR #3592, main). Built from main so it carries the #3403 R4 authnz refactor
    # (ALWAYS-ENFORCE external api-key tenant-scoping) that landed in 11.20.105 — preprod stays R4-enforcing;
    # api_key rows are pre-backfilled + R4-safe. Back to a bare version tag (fresh version, no floating-tag
    # collision like the clobbered 11.20.102, so the digest pin from the 105 validation is no longer needed).
    # Prod is still HELD at 11.20.102@cbfc4323 pending the operator R4 promotion. pin 11.20.85 if a box↔hub
    # reconcile test needs the bundled hapihub schema (cadence schema_hash guard).
  # 11.20.110 (PR #3631, main, squash 310ee242d) = #3623/#3484 audit traceability
  # (append-only audit_events + Better Auth emitters + GET /audit/security-events;
  # activity-logs RETAINED FROZEN, removal deferred to FE #3624) PLUS the #3630
  # metrics counter audit_events_total{action,outcome} on GET /metrics — the metric
  # the AuditSignInFailureBurst/AuditPhiExportBurst rules scrape. (PR #354 squash-
  # merged at 11.20.109, which lacks the counter, so the rules were inert; this
  # completes it to 110 so the serviceMonitor scrape + burst rules go live.)
  # 11.20.117 (#3732) = audit/sink worker actually WIRED. 11.20.116 (#3708)
  # shipped the worker but configureAudit read a non-existent global app.config
  # so the sink gate was always false (never started); #3732 reads it via the
  # serviceConfig arg. POSTs every audit_events INSERT to the Tenzir pipeline.
  # 11.20.118 (#3745, #3747) = telemetry parity metrics.
  image:
    tag: "11.20.119"
  cache:
    enabled: true

  # #3484 (PREPROD-ONLY prep, held for human review — prod stays default-off).
  # Scrape hapihub /metrics so the audit-event burst alerts (audit-event-bursts
  # PrometheusRule) can see the app-side audit_events_total counter once it ships.
  serviceMonitor:
    enabled: true
  # Weekly HIPAA-retention prune of the append-only audit_events trail (superuser
  # + session_replication_role=replica to bypass the guard trigger). Prunes on
  # occurred_at (event time, indexed) — created_at is emitter-unset / nullable.
  pruneAuditEvents:
    enabled: true

  # Daily cleanup of expired Better Auth sessions (they never self-delete).
  replicaCount: 1

  resources:
    requests:
      memory: 768Mi
    limits:
      memory: 2Gi

  gateway:
    hostnames:
    - hapihub.preprod.localfirsthealth.com
    sectionName: https-preprod-hapihub  # anti-coalescing exact listener, pairs with mycure block
    # No mycure.md hostnames in preprod — we only route *.preprod.localfirsthealth.com.
  betterAuth:
    passkey:
      rpName: "Mycure (preprod)"
      rpId: "preprod.localfirsthealth.com"

  config:
    CORS_ORIGINS: "https://hapihub.preprod.localfirsthealth.com,https://mycure.preprod.localfirsthealth.com,https://mycurelocal.preprod.localfirsthealth.com,https://mycure-myaccount.preprod.localfirsthealth.com,https://mycure-dashboard.preprod.localfirsthealth.com,https://mycure-pxp.preprod.localfirsthealth.com,https://mycure-reconstruct.preprod.localfirsthealth.com,https://mycure-pr--*.web.app,https://mycure-reconstruct.web.app,https://mycure-reconstruct.firebaseapp.com,https://medleyapp.preprod.localfirsthealth.com"
    # ---- Phase 2: medical-AI integration (medgemma-worker + openmed enabled below) ----
    INGESTION_ENABLED: "true"
    OPENMED_ENABLED: "true"
    MEDGEMMA_URL: "http://medgemma-worker:8940"
    OLLAMA_URL: "http://ollama.tailscale.svc.cluster.local:11434"
    OPENMED_URL: "http://openmed:8920"
    EMBED_MODEL: "bge-m3"  # bge-m3 is what Ollama serves for embeddings (NOT nomic-embed-text)
    # File storage — preprod-own in-cluster MinIO (S3-compatible), isolated from
    # prod's GCS bucket. Access creds (STORAGE_S3_ACCESS_KEY_ID/SECRET) come from
    # the minio secret via the externalSecret below; MinIO auto-creates the bucket.
    STORAGE_TYPE: "s3"
    STORAGE_S3_ENDPOINT: "http://minio.mycure-preprod.svc.cluster.local:9000"
    STORAGE_S3_REGION: "us-east-1"
    STORAGE_S3_FORCE_PATH_STYLE: "true"
    STORAGE_BUCKET: "hapihub"
  env:
  - name: BETTER_AUTH_RATE_LIMIT_ENABLED
    value: "true"
  - name: BETTER_AUTH_RATE_LIMIT_WINDOW
    value: "60"
  - name: BETTER_AUTH_RATE_LIMIT_MAX
    value: "300"
  - name: BETTER_AUTH_SESSION_COOKIE_CACHE_ENABLED
    value: "false"
    # cadence OAuth Authorization Server (#2727 E2E). hapihub mints box grants with the SAME EdDSA key +
    # iss + kid as the standalone cadence-issuer, so the hub (which trusts the issuer's JWKS) verifies them
    # unchanged. CADENCE_ISSUER_KEY (the PEM of that key) comes from the externalSecret below.
  - name: CADENCE_ISSUER_ISS
    value: "cadence-preprod-issuer"
  - name: CADENCE_ISSUER_KID
    value: "k1"
  - name: CADENCE_ISSUER_FLEET_ID
    value: "mycure-preprod"
  - name: CADENCE_ISSUER_AUTHORIZE_URL
    value: "https://mycure.preprod.localfirsthealth.com/oauth/authorize"
    # Advertised as `cadence_seed_url` in the AS metadata so a box derives its sync hub from the single
    # configured api URL (no separate hub/fleet onboarding field). Re-domained hub (#2727).
  - name: CADENCE_ISSUER_SEED_URL
    value: "https://cadence.preprod.localfirsthealth.com"
    # RFC 8628 device grant (#2992). FAIL-CLOSED and silent: with this unset the AS treats the device grant
    # as disabled — it omits `device_authorization_endpoint` from the AS metadata and 404s the device
    # endpoints, so a deploy looks perfectly clean while the feature never turns on. Points at the mycure SPA
    # approval page (mycure >= 10.25.118). Verify after rollout:
    #   curl -s https://hapihub.preprod.localfirsthealth.com/.well-known/oauth-authorization-server | jq
    # CADENCE_ISSUER_DEVICE_CODE_TTL (900s) and _POLL_INTERVAL (5s) are left at their schema defaults.
  - name: CADENCE_ISSUER_DEVICE_VERIFICATION_URI
    value: "https://mycure.preprod.localfirsthealth.com/oauth/device"
    # Security detection pipeline (mono#3708 audit sink -> monobase-infra Tenzir
    # node). The audit/sink worker POSTs every audit_events INSERT (all orgs,
    # HMAC-signed) here. RUN_WORKERS defaults "true" on this single hapihub pod
    # (no separate hapihubWorker in preprod), so it's the sole deliverer — no
    # dup POSTs. AUDIT_SINK_SECRET is injected from ESO below.
  - name: AUDIT_SINK_URL
    value: "http://tenzir-ingest.security.svc.cluster.local:8080/ingest/audit-events"
    # Read replica for device-telemetry parity recompute (mono#3747). Mirrors the
    # helper-composed DATABASE_URI exactly (same $(POSTGRESQL_USER)/$(POSTGRESQL_PASSWORD)
    # interpolation, same db) — only the host differs postgresql-primary -> postgresql-read.
    # No-op until #3747's hapihub image ships (nothing reads it before then). Preprod only.
  - name: DATABASE_READ_URI
    value: "postgres://$(POSTGRESQL_USER):$(POSTGRESQL_PASSWORD)@postgresql-read.mycure-preprod.svc.cluster.local:5432/hapihub"

  autoscaling:
    enabled: false

  # Preprod-own secrets (mycure-preprod-* GCP keys), isolated from production
  # (#3486 reset). Dead keys dropped: ENC_* (field-encryption unused in
  # 11.20.118), PUBLIC_KEY (derived from PRIVATE_KEY at runtime), STRIPE_SECRET_KEY
  # / STRIPE_KEY (Stripe creds live in the billing_providers DB row, not env).
  externalSecrets:
    secrets:
      # Security detection pipeline: HMAC key the audit/sink worker signs POSTs
      # with (shared with the Tenzir node; standard-webhooks). Same GCP secret
      # both sides read. mono#3708.
    - secretKey: AUDIT_SINK_SECRET
      remoteKey: infrastructure-tenzir-ingest-hmac
      # Google OAuth
    - secretKey: GOOGLE_CLIENT_ID
      remoteKey: mycure-preprod-google-oauth-client-id
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteKey: mycure-preprod-google-oauth-client-secret
      # JWT/Auth keys (preprod-own; PUBLIC_KEY derived from PRIVATE_KEY at runtime)
    - secretKey: PRIVATE_KEY
      remoteKey: mycure-preprod-private-key
      # cadence OAuth AS signing key (#2727) — the standalone cadence-issuer's EdDSA key, PEM-encoded
      # (single-line, \n-escaped; hapihub un-escapes). Same key/iss(cadence-preprod-issuer)/kid(k1) as the
      # issuer, so grants hapihub mints verify against the issuer JWKS the hub already trusts.
    - secretKey: CADENCE_ISSUER_KEY
      remoteKey: mycure-preprod-cadence-issuer-key-pem
      # Storage — in-cluster MinIO (S3) access creds; non-secret S3 config in `config:` above
    - secretKey: STORAGE_S3_ACCESS_KEY_ID
      remoteKey: mycure-preprod-minio-root-user
    - secretKey: STORAGE_S3_SECRET_ACCESS_KEY
      remoteKey: mycure-preprod-minio-root-password
      # Stripe checkout redirect URLs
    - secretKey: STRIPE_CHECKOUT_SUCCESS_URL
      remoteKey: mycure-preprod-stripe-checkout-success-url
    - secretKey: STRIPE_CHECKOUT_CANCEL_URL
      remoteKey: mycure-preprod-stripe-checkout-cancel-url
    - secretKey: AUTH_SECRET
      remoteKey: mycure-preprod-auth-secret
    - secretKey: BETTER_AUTH_SECRET
      remoteKey: mycure-preprod-better-auth-secret

  postgresql:
    serviceName: postgresql-primary
mycure:
  image:
    tag: "10.25.132"
    # 10.25.131 = PostHog removal + EMR back-routing reconcile.
    # (#2992, PR #3426 merged as d7d535fcf). Supersedes the pre-merge branch build 10.25.118 — carries the
    # on-device fixes to the onboarding copy, the user_code format the anti-phishing check depends on, and
    # the PWA service worker that was serving a stale bundle to /oauth/*.
    # NOTE: preprod was behind prod (10.25.112 vs .117) before #2992, so this also carries 10.25.113-.117.
  resources:
    requests:
      cpu: 50m
  gateway:
    sectionName: https-preprod-mycure  # anti-coalescing exact listener (exact-name cert kills HTTP/2 cross-host reuse -> 421s)

  config:
    API_URL: "https://hapihub.preprod.localfirsthealth.com"
    HAPIHUB_URL: "https://hapihub.preprod.localfirsthealth.com"

mycurelocal:
  enabled: false

  resources:
    requests:
      cpu: 50m
  gateway:
    hostnames:
    - hostname: mycurelocal.preprod.localfirsthealth.com
      sectionName: https-preprod-lfh

mycure-myaccount:
  enabled: false

  resources:
    requests:
      cpu: 50m
  gateway:
    sectionName: https-preprod-lfh

  config:
    API_URL: "https://hapihub.preprod.localfirsthealth.com"
    HAPIHUB_URL: "https://hapihub.preprod.localfirsthealth.com"

hapihub-docs:
  enabled: false

  resources:
    requests:
      cpu: 50m
  gateway:
    hostname: "docs.preprod.localfirsthealth.com"
    sectionName: https-preprod-lfh

medley:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/medley
    tag: "0.1.2"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  gateway:
    enabled: false  # ClusterIP only — no public HTTPRoute

  config:
    HAPIHUB_URL: "http://hapihub:7500"
    # TODO: set to the secured external GPU Ollama endpoint before enabling medgemma-worker
    OLLAMA_URL: "http://ollama.tailscale.svc.cluster.local:11434"
    MEDGEMMA_URL: "http://medgemma-worker:8940"
    OPENMED_URL: "http://openmed:8920"
    MEDLEY_CHAT_MODEL: "qwen3.5:9b"
    MEDLEY_CORS_ORIGINS: "https://medleyapp.preprod.localfirsthealth.com"
    # Model picker presets (FE Settings page). On-prem default + bring-your-own-key cloud options.
    MEDLEY_MODEL_PRESETS: '[{"id":"onprem-qwen","label":"On-prem Qwen 3.5 9B","provider":"ollama","model":"qwen3.5:9b"},{"id":"openai-gpt4o","label":"OpenAI GPT-4o (your key)","provider":"openai-compatible","model":"gpt-4o","baseUrl":"https://api.openai.com/v1","requiresKey":true},{"id":"anthropic-sonnet","label":"Claude Sonnet 4.6 (your key)","provider":"anthropic","model":"claude-sonnet-4-6","requiresKey":true}]'

  externalSecrets:
    enabled: true
    secretStore: gcp-secretstore
    secretStoreKind: ClusterSecretStore
    refreshInterval: 1h
    secrets:
    - secretKey: MEDLEY_HISTORY_KEY
      remoteKey: mycure-preprod-medley-history-key

  podDisruptionBudget:
    enabled: false

# ===== MEDICAL AI: MedleyApp Frontend (Caddy SPA) =====
# Phase 1: enabled — public HTTPRoute via https-preprod-lfh.
medleyapp:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/medleyapp
    tag: "0.1.4"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  gateway:
    hostname: ""  # defaults to medleyapp.preprod.localfirsthealth.com
    sectionName: https-preprod-lfh

  config:
    API_URL: "https://hapihub.preprod.localfirsthealth.com"
    HAPIHUB_URL: "https://hapihub.preprod.localfirsthealth.com"

  podDisruptionBudget:
    enabled: false

# ===== MEDICAL AI: MedGemma Worker =====
# Phase 2: enabled — vision extraction (prescription/lab images) for document-ingestion.
# Reaches the on-prem Ollama via the in-cluster egress Service (ollama.tailscale.svc); the
# chart NetworkPolicy allows 11434 via namespaceSelector (not ipBlock — that path is in-cluster).
medgemmaWorker:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/medgemma-worker
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  gateway:
    enabled: false  # ClusterIP only

  config:
    # TODO: set to the secured external GPU Ollama endpoint
    OLLAMA_URL: "http://ollama.tailscale.svc.cluster.local:11434"
    MEDGEMMA_MODEL: "hf.co/unsloth/medgemma-4b-it-GGUF:Q4_K_M"

  podDisruptionBudget:
    enabled: false

# ===== MEDICAL AI: OpenMed Model Server =====
# Phase 2: enabled — PHI de-id / NER / ICD-10 for document-ingestion.
# Pulls its models from HuggingFace on first start (egress 443 via ipBlock in the chart NP) into a
# 3Gi PVC (openmed-model-cache, RWO) mounted at /models (HF_HOME), persisted across restarts.
openmed:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/openmed
    tag: "0.1.3"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 2Gi

  gateway:
    enabled: false  # ClusterIP only

  config:
    OPENMED_PRELOAD: "disease,pharma"
    PYTHONUNBUFFERED: "1"  # stream uvicorn/model-load logs (otherwise buffered + invisible)

  # openmed preloads NER/ICD-10 models from HuggingFace on first boot (downloaded to the PVC),
  # which takes minutes — far longer than the chart's 60s liveness grace. Without this it gets
  # liveness-killed mid-load and never converges. Generous initialDelay = de-facto startup grace;
  # readiness (unchanged) still gates Service membership until it actually serves.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 600
    periodSeconds: 15
    failureThreshold: 4

  persistence:
    enabled: true
    size: 3Gi
    storageClassName: do-block-storage  # DOKS CSI — the chart default 'longhorn' doesn't exist here

  podDisruptionBudget:
    enabled: false

# ===== DATABASE: PostgreSQL =====
# Replication (1 primary + 1 read replica), prod-parity: the cadence hub's
# reconcile/serve scan plane reads from the replica (CADENCE_DB_READ_URL), so
# the read-plane split is verified here before prod adoption. Both PG pods fit
# the nonprod pool. The primary's PVC (data-postgresql-primary-0) is a CSI
# snapshot clone of the pre-replication data-postgresql-0 (215Gi, expanded from
# the original 200Gi) — see the migration runbook in the PR.
# WAL archiving / PITR (added after the 2026-08-28 data-loss incident, where the
# only recovery point was a 23h-old Velero backup). Gates the postgresql-walg
# ExternalSecret in charts/database-secrets, which syncs the shared Spaces
# credential (GCP key monobase-digitalocean-spaces — the same one Velero uses)
# into the namespace for archive_command. See postgresql.primary below.
walg:
  enabled: true
  # Weekly base backup + retention, run by a CronJob that `kubectl exec`s
  # `wal-g backup-push` into the primary (backup-push needs $PGDATA, which lives
  # only on the primary's RWO PVC — a standalone pod can't mount it). Retention
  # is base-relative (`delete retain FULL 4`), never age-based, so a base and the
  # WAL needed to replay from it are pruned together. See
  # charts/database-secrets/templates/walg-backup.yaml.
  backup:
    enabled: true
    schedule: "0 18 * * 0"   # Sun 18:00 UTC (~02:00 PHT Mon) — off clinic hours
    retainFull: 4            # ~1 month of weekly base backups

postgresql:
  # postgres_exporter sidecar + metrics Service, exposing pg_stat_archiver_* —
  # the series the WAL-archive alerts depend on. Without it a silently failing
  # archive_command is invisible until pg_wal fills the volume.
  #
  # image MUST be pinned to bitnamilegacy: chart 16.7.27 defaults to
  # docker.io/bitnami/postgres-exporter:0.17.1-debian-12-r16, which no longer
  # exists (HTTP 404 — Bitnami moved versioned tags to the legacy org). The
  # exporter is a SIDECAR in the PG pod, so an ImagePullBackOff makes the pod
  # NotReady and drops postgresql-primary/-read out of their Service endpoints.
  # Same reason base.yaml already pins bitnamilegacy for postgresql/valkey/minio.
  metrics:
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/postgres-exporter
      tag: 0.17.1-debian-12-r16

  architecture: replication

  auth:
    replicationUsername: repl_user
    secretKeys:
      replicationPasswordKey: postgres-replication-password

  primary:
    # cadence boot opens ~99 per-collection ensure connections simultaneously
    # (the advisory lock serializes DDL, not connection acquisition), which
    # exhausts the default max_connections=100. 300 gives headroom for
    # hapihub + 99 watcher workers + DDL/index tasks.
    # pg_stat_statements: query attribution for the read-plane verification
    # (CREATE EXTENSION pg_stat_statements in the hapihub DB after first boot).
    # max_slot_wal_keep_size: a dead replica must not fill the primary disk
    # with slot-retained WAL (prod uses 80GB on a 400Gi volume; 20GB here).
    extendedConfiguration: |
      shared_preload_libraries = 'pgaudit, pg_stat_statements'
      max_connections = 300
      max_slot_wal_keep_size = 20GB
      # Autovacuum throughput (see prod): default 3 workers @ cost_limit 200
      # can't keep up with write/purge churn; per-table overrides ship in
      # hapihub migration 0087. max_workers needs a restart (applied here).
      autovacuum_max_workers = 6
      autovacuum_vacuum_cost_limit = 2000
      autovacuum_naptime = 30s
      # --- Continuous WAL archiving (PITR). Cuts RPO from 24h (daily Velero
      # backup) to ~archive_timeout. Added after the 2026-08-28 incident, where
      # a 23h-old backup was the only recovery point. archive_mode needs a
      # RESTART; archive_command alone is reload-only.
      # wal-g is not in the Bitnami image — an initContainer copies the binary
      # onto the walg-bin emptyDir below (the PG container has
      # readOnlyRootFilesystem: true, so it cannot be installed at runtime).
      archive_mode = on
      archive_command = '/opt/wal-g/wal-g wal-push %p'
      archive_timeout = 60
    # Binary delivery for archive_command. The image is a thin debian:12-slim
    # wrapper around the upstream wal-g release (ubuntu-22.04 build: glibc 2.35,
    # forward-compatible with the image's Debian 12 / glibc 2.36). It also serves
    # as the runner image for the backup-push / retention CronJobs.
    initContainers:
      - name: walg-install
        image: ghcr.io/mycurelabs/wal-g:v3.0.9
        imagePullPolicy: IfNotPresent
        command:
          - sh
          - -c
          - cp /usr/local/bin/wal-g /opt/wal-g/wal-g && chmod 0755 /opt/wal-g/wal-g
        volumeMounts:
          - name: walg-bin
            mountPath: /opt/wal-g
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
    extraVolumes:
      - name: walg-bin
        emptyDir: {}
      # /etc/passwd shim: uid 1001 has no passwd entry in the Bitnami image, and
      # cgo-built wal-g calls getpwuid() for backup-push/backup-list/backup-fetch
      # ("user: unknown userid 1001"). wal-push does not, which is why archiving
      # works while every base-backup and RESTORE command fails. The base-backup
      # CronJob (walg.backup) execs backup-push here and relies on this shim.
      - name: walg-passwd
        configMap:
          name: postgresql-walg-passwd
    extraVolumeMounts:
      - name: walg-bin
        mountPath: /opt/wal-g
        readOnly: true
      - name: walg-passwd
        mountPath: /etc/passwd
        subPath: passwd
        readOnly: true
    extraEnvVars:
      - name: WALG_S3_PREFIX
        value: "s3://mycure-doks-velero-backups/wal/mycure-preprod"
      - name: AWS_ENDPOINT
        value: "https://sgp1.digitaloceanspaces.com"
      - name: AWS_REGION
        value: "sgp1"
      - name: AWS_S3_FORCE_PATH_STYLE
        value: "false"
      - name: WALG_COMPRESSION_METHOD
        value: "zstd"
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: postgresql-walg
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: postgresql-walg
            key: AWS_SECRET_ACCESS_KEY
    persistence:
      size: 215Gi
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 8Gi

  readReplicas:
    replicaCount: 1
    # NOTE (prod convention): label the replica PVC out of Velero backups once
    # it exists — it is a byte-copy of the primary, redundant for DR:
    #   kubectl -n mycure-preprod label pvc data-postgresql-read-0 \
    #     velero.io/exclude-from-backup=true --overwrite
    persistence:
      enabled: true
      storageClass: ""
      size: 215Gi
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 4Gi
    # primary_slot_name pins the replica to a persistent physical slot so the
    # primary retains WAL until the replica consumes it (capped by
    # max_slot_wal_keep_size above). pg_stat_statements mirrors the primary —
    # the read-plane verification reads per-node query stats on BOTH.
    extendedConfiguration: |
      shared_preload_libraries = 'pgaudit, pg_stat_statements'
      max_connections = 300
      # Autovacuum GUCs in lockstep with the primary (inert on a hot standby,
      # consistent on promotion). See primary block for rationale.
      autovacuum_max_workers = 6
      autovacuum_vacuum_cost_limit = 2000
      autovacuum_naptime = 30s
      primary_slot_name = 'pg_read_replica'
      # Standby-conflict tuning (see prod): reconcile scans must not be canceled
      # by WAL replay; lag is over-reconcile-safe for the sync plane.
      hot_standby_feedback = on
      max_standby_streaming_delay = 120s
    # Gates liveness during the initial pg_basebackup (~42GB clone) — the
    # default liveness probe would SIGKILL the pod mid-clone and restart it
    # forever. 180min ceiling (720 * 15s), same as prod.
    customStartupProbe:
      exec:
        command:
        - /bin/sh
        - -c
        - exec pg_isready -U postgres -d dbname=hapihub -h 127.0.0.1 -p 5432
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 720
      successThreshold: 1

  podDisruptionBudget:
    enabled: false

# ===== CACHE: Valkey (Redis) =====
valkey:
  master:
    persistence:
      size: 4Gi
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 500m
        memory: 2Gi
    # No --maxmemory cap: with readFrom=Pg cadence writes no Valkey
    # changelog, so the container memory limit (2 GiB) is the ceiling.

# ===== STORAGE: MinIO Object Storage =====
minio:
  enabled: true

  gateway:
    sectionName: https-preprod-lfh

  # #3484 (PREPROD-ONLY prep, held for human review). Cold-archive bucket for
  # pruned audit_events rows, created WITH object-lock (WORM) + versioning +
  # default COMPLIANCE retention. See the FLAG in the minio.yaml template re:
  # object-lock on this standalone (single-drive) instance — verify before relying.
  auditArchive:
    enabled: true
    bucket: audit-archive
    retention: "6y"
mailpit:
  enabled: true

  gateway:
    # Public web UI route is intentionally exposed with NO auth.
    # WARNING (#5): preprod runs on cloned-prod data, so this inbox exposes real reset
    # tokens / OTPs / PHI to anyone with the URL. Deliberate testing convenience, not a
    # regression. Put it behind gateway auth (NGF AuthenticationFilter basic-auth) if it
    # outlives short-lived testing. Exposure-free alt: kubectl port-forward svc/mailpit-http 8025:80
    hostname: "mail.preprod.localfirsthealth.com"

# ===== BACKUP =====
# Relay-via-gateway validation (phase 2 of the cadence LB consolidation): test hostname riding
# the *.preprod wildcard listener; the real relay hostname/LB are untouched. Success = a relay
# client homes on https://cadence-relay-gw.preprod... through the gateway.
cadenceRelay:
  # Whole relay on the shared gateway (retires the per-env relay LB). 443 leg via HTTPRoute +
  # BackendTLSPolicy; QUIC leg via UDPRoute on the relay-quic-preprod listener (7842). Both legs
  # verified from a real box (alfheim) through the gateway, so the own LB is dropped: ClusterIP.
  # The in-cluster anchor reaches the relay via the coredns hairpin → this Service's ClusterIP.
  serviceType: ClusterIP
  gatewayRoute:
    enabled: true
    hostname: cadence-relay.preprod.localfirsthealth.com
    sectionName: https-preprod-lfh
    udpListener: relay-quic-preprod

cadence:
  # PREPROD-ONLY override (prod stays on base): layered-convergence program L3 test build
  # (branch worktree-cadence-layered-convergence, unreleased, superset of 2.1.54): L1 capture
  # (pending-capture-aware LWW apply, loud capture failure signals, DLQ failures fail the tick)
  # + L2 durable state + L3 transport (gossip re-subscribe escalation heals the pod-roll zombie-join; evict/GC digest integrity incl. count-blind acc-drift heal via rebuild_fp
  # on no-progress, tagset-keyed baseline gates, per-scope GC horizon + apply_below_gc_horizon
  # resurrection telemetry, gc/dlq/reroute maintenance-error counters).
  # Prod-proven 2.1.103 — matches prod after the 2026-08-14→19 OOM/panic/probe-kill saga (2.1.99 convergence
  # + 2.1.100 cap + 2.1.101 dedup + 2.1.102 PathId::ZERO guard + 2.1.103 dedicated-thread /healthz). relay
  # stays n0 below. Requires dropUnusedTables below: hapihub 11.20.106 (#3335) DROPPED file_links +
  # organization_partners here, and the shared files/cadence.yaml still lists them → cadence crash-loops
  # ("collection 'file_links' has no table") on any version until those two collection entries are gated off.
  image:
    tag: "2.1.105"
  # Skip the file_links + organization_partners collection entries in files/cadence.yaml — hapihub 11.20.106
  # (#3335) dropped those tables in preprod. Prod stays false (11.20.102 still has + syncs them); flip prod
  # → true on the R4 11.20.106 promotion. (Same .Values-gated per-env pattern as publicAddr, #204.)
  dropUnusedTables: true
  # Never share a node with the PG primary: co-location (both on one 4-core nonprod node,
  # 2026-08-11) cut baseline mint throughput ~3x — hashing and PG execution compete for the
  # same cores. Required (not preferred): on a small pool a silent re-co-location would just
  # re-break measurements; an unschedulable pod is the visible failure we want.
  # 512Mi request (chart default 1Gi): the non-PG-primary nonprod node runs at ~88% requested
  # memory, so the anti-affinity below can't schedule a 1Gi request. Burstable — the 3Gi limit
  # stands. If the nonprod pool grows, restore the default. ponytail: thin 245Mi headroom.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 3Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: postgresql
            app.kubernetes.io/component: primary
        topologyKey: kubernetes.io/hostname
  publicAddr: "100.74.26.73:6473"
  # INTERIM (relay disabled → n0 public): the self-hosted relay's HTTP-upgrade handshake is 100% broken
  # through the shared gateway (TLS-terminate + re-encrypt mangles the long-lived iroh upgrade → the relay
  # log is a solid flood of "did not reach established within timeout"). A broken relay path makes the hub
  # tight-loop open_path_on_all_conns → create_sender per retry → senders pile on the hub → OOM. Unsetting
  # relayUrl reverts RelayMode to n0's public relay (default, functional) — the hub stops retrying the dead
  # path AND hard-NAT boxes get a working relay again. Re-set once the gateway route is repaired (TLSRoute
  # passthrough or a SnippetsFilter for the upgrade). Empty ⇒ n0 relays (chart default).
  relayUrl: ""
  nodePool: "nonprod"
  postgresql:
    serviceName: postgresql-primary
    # Read-plane split: the hub's reconcile/serve scan queries go to the
    # replica (CADENCE_DB_READ_URL); writes + LWW admission reads stay on the
    # primary. Verification bed for the prod adoption.
    readServiceName: postgresql-read
  # Scrape the OpenMetrics /metrics endpoint into Prometheus (reconcile timing/throughput, connect
  # failures, schema drift, reconcile_active, RSS, dirty_depth) — #2727 observability.
  gateway:
    # The preprod wildcard listener (*.preprod.localfirsthealth.com) on the tailnet gateway.
    sectionName: https-preprod-lfh
    # QUIC via the tailnet gateway (UDPRoute). Preprod is port-demuxed to 6473 —
    # publicAddr advertises <tailnet-device-IP>:6473; boxes are tailnet members.
    udpListener: cadence-quic-preprod
    # Re-domained to cadence.preprod (#2727), reclaiming the domain freed by retiring cadence v1.
    # Cutover complete — boxes discover the hub via cadence.preprod (single-URL onboarding, from the AS
    # metadata's cadence_seed_url); the legacy cadence.preprod hostname is dropped.
    hostnames:
    - cadence.preprod.localfirsthealth.com
  # hapihub is the SOLE AS (#2727) — it mints both box grants AND the hub's own '*' grant. Env-driven (not
  # baked into the verbatim cadence.yaml). The enroll initContainer authorizes '*' against hapihub with a
  # non-expiring service-account API key (--bearer); runtime verification is against hapihub's JWKS.
  auth:
    issuerUrl: https://hapihub.preprod.localfirsthealth.com
    grantJwksUri: https://hapihub.preprod.localfirsthealth.com/.well-known/jwks.json
    fleetId: mycure-preprod
    # hapihub advertises a browser authorization_endpoint (RFC 8252 SPA) for boxes; the headless hub
    # authorizes against the programmatic route instead (CADENCE_AUTH_AUTHORIZE_URL).
    authorizeUrl: https://hapihub.preprod.localfirsthealth.com/sync/authorize
  # Service-account API key (better-auth, service@mycure.md, non-expiring) → secret cadence-secrets. The hub
  # presents it as --bearer to authorize its '*' grant. hapihub then mints with a coherent status_list.
  externalSecrets:
    secrets:
    - secretKey: sa-api-key
      remoteKey: mycure-preprod-cadence-sa-api-key

# cadence issuer RETIRED (#2727): hapihub is the sole AS + minter. The hub enrolls its own '*' grant
# against hapihub with a service-account API key (see the enroll initContainer). No standalone issuer.
