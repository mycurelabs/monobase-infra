# ===== DATABASE: MongoDB =====
# Removed 2026-07-30. Was a synthetic single-node replica set existing only
# to feed the hapihub-migrator CronJob smoke test — but the migrator has been
# stopped since 2026-07-02 (hapihubMigrator.enabled: false), so nothing
# consumed it. Setting enabled:false prunes the StatefulSet + PVC via ArgoCD.
# The remaining config below is retained (disabled) so the migrator smoke
# test can be revived without re-deriving the mongo shape.
mongodb:
  enabled: false

  image:
    repository: bitnamilegacy/mongodb
    tag: 7.0.15-debian-12-r0

  auth:
    rootUser: root
    existingSecret: mongodb

  replicaCount: 1

  arbiter:
    enabled: false

  persistence:
    enabled: true
    storageClass: ""
    size: 5Gi

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# ===== DATABASE: PostgreSQL =====
# Standalone (no read replica) in preprod: prod node pool can't fit a
# second 4Gi PG pod alongside HA Postgres + existing prod workloads.
# Replication failover testing is the only thing lost — schema, query,
# migration, and index rehearsals all still work on a single primary.
# Re-enable architecture=replication only after the prod pool is bumped.
postgresql:
  enabled: true

  fullnameOverride: "postgresql"

  architecture: standalone

  image:
    repository: bitnamilegacy/postgresql
    tag: 16.4.0-debian-12-r13

  auth:
    enabled: true
    database: hapihub
    username: postgres
    existingSecret: postgresql
    secretKeys:
      adminPasswordKey: postgres-password

  primary:
    # M2 full-config rehearsal (2026-07-10): the default max_connections=100
    # was exhausted by cadence 0.7.0's boot — 99 per-collection ensure tasks
    # connect simultaneously (advisory lock serializes DDL, not connection
    # acquisition) → 40 collections' DDL setup starved with "connect failed".
    # 300 gives headroom for hapihub + 99 watcher workers + DDL/index tasks.
    # cadence-side fix (gate ensure connections behind the poll semaphore +
    # per-collection retry) ships as 0.7.1 during the soak.
    extendedConfiguration: |
      max_connections = 300
    persistence:
      enabled: true
      storageClass: ""
      size: 200Gi
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 8Gi

  podDisruptionBudget:
    enabled: false

# ===== CACHE: Valkey (Redis) =====
valkey:
  enabled: true  # re-enabled 2026-04-29 alongside cadence (root cause fixed in 0.5.x)

  global:
    security:
      allowInsecureImages: true

  auth:
    existingSecret: valkey

  architecture: standalone

  image:
    repository: bitnamilegacy/valkey
    tag: 8.0.1-debian-12-r2

  master:
    persistence:
      enabled: true
      storageClass: ""
      size: 4Gi
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 500m
        memory: 2Gi
    # `--maxmemory 1.5GB` + `noeviction` dropped 2026-06-25 alongside
    # the prod drop — cadence Phase 4a (0.5.36) stopped Valkey changelog
    # writes when readFrom=Pg, so the cap that paired with the trim
    # escalation policy is obsolete. Container memory limit (2 GiB)
    # is the new ceiling.

# ===== STORAGE: MinIO Object Storage =====
minio:
  enabled: true

  fullnameOverride: "minio"

  image:
    repository: bitnamilegacy/minio
    tag: "2025.7.23-debian-12-r3"

  mode: standalone

  statefulset:
    replicaCount: 1

  auth:
    existingSecret: minio

  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  defaultBuckets: "monobase-files"

  buckets:
    - name: "monobase-files"
  region: "us-east-1"

  podSecurityContext:
    enabled: true
    fsGroup: 1001
    fsGroupChangePolicy: "OnRootMismatch"

  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  gateway:
    enabled: true
    hostname: ""
    sectionName: https-preprod-lfh
    rateLimit:
      enabled: false

# ===== EMAIL TESTING: Mailpit =====
# Safety override: enabled in preprod so cloned prod user rows cannot
# trigger real outbound email on reset/notification flows. HapiHub SMTP
# should be pointed at the in-cluster mailpit service.
mailpit:
  enabled: true

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  gateway:
    # Public web UI route RE-ENABLED 2026-06-22 per request — intentionally with NO auth.
    # WARNING (#5): preprod runs on cloned-prod data, so this inbox exposes real reset
    # tokens / OTPs / PHI to anyone with the URL. Deliberate testing convenience, not a
    # regression. Put it behind gateway auth (NGF AuthenticationFilter basic-auth) if it
    # outlives short-lived testing. Exposure-free alt: kubectl port-forward svc/mailpit-http 8025:80
    enabled: true
    hostname: "mail.preprod.localfirsthealth.com"

# ===== P2P SYNC: Cadence =====
hapihubMigrator:
  enabled: false # migrator stopped 2026-07-02

  image:
    repository: ghcr.io/mycurelabs/hapihub-migrator
    tag: "3.9.2"  # #2063 + reverse mirror: same-second ties apply incoming (fwd <=, rev next-second bound)
    pullPolicy: IfNotPresent

  # No CDC in preprod — only the CronJob is exercised here.
  deployment:
    enabled: false

  # Reverse-sync canary (PG → MongoDB): apply scope widened past the initial
  # clocks,counters pair after an end-to-end round-trip proved apply works
  # (PG update → _pg_changelog → Mongo upsert, errors=0). Added tables are all
  # NON-encrypted — preprod has no ENC_* keys (externalSecrets disabled), so
  # encrypted collections (personal_details, billing_invoices/items/payments,
  # medical_records) stay out of scope here. Widen further / drop `tables`
  # as later stages pass.
  reverseCdc:
    enabled: true
    apply: true
    tables: "clocks,counters,services,medicines,organizations"

  # Reverse safety-net sweep (MODE=reverse-bulk, PG → MongoDB). Scoped to a
  # small NON-encrypted set to keep the recurring cost low (the real-time
  # reverseCdc canary above already covers the wider set) and to stay clear
  # of encrypted collections preprod can't key. windowHours is deliberately
  # wide here because preprod has no live write traffic — a 26h trailing
  # window (the prod default) would sweep nothing; 90d lets the safety-net
  # actually re-check the near-static dataset. Latest-wins makes re-runs
  # no-ops. Offset 30m from the forward nightly (0 */6).
  reverseNightlyJob:
    enabled: true
    schedule: "30 */6 * * *"
    windowHours: 2160
    tables: "counters,organizations"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  # Run every 6h in preprod for faster feedback than nightly.
  nightlyJob:
    enabled: true
    schedule: "0 */6 * * *"
    lookbackHours: 48
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  postgresql:
    enabled: true
    serviceName: postgresql
    port: 5432
    auth:
      database: hapihub
      username: postgres
      existingSecret: postgresql
      passwordKey: postgres-password

  mongodb:
    enabled: true
    serviceName: mongodb-headless
    port: 27017
    database: hapihub
    username: root
    replicaSet: rs0
    authSource: admin
    existingSecret: mongodb
    passwordKey: mongodb-root-password

  # No encryption keys in preprod — synthetic Mongo holds no encrypted data.
  externalSecrets:
    enabled: false

# ===== BACKUP =====
backup:
  enabled: false

# ===== SECURITY =====
podSecurityStandards:
  enabled: true
  level: restricted

# ===== RESOURCE QUOTAS =====
resourceQuotas:
  enabled: false

# ===== Infra: L4 UDP LoadBalancer for QUIC (iroh) =====
# Owns the UDP LoadBalancer separately from any app chart, like the HTTP gateways
# (which can't carry UDP). Apps are just pods it selects; the LB + public IP stay
# put regardless of which app targetSelector points at.
udpGateway:
  enabled: true
  targetSelector:
    app.kubernetes.io/name: cadence
  port: 6472
  healthPort: 6472

# ===== cadence-relay — self-hosted iroh relay for hard-NAT boxes =====
# Own LB + cert (cadence-relay.preprod.localfirsthealth.com). Anchor + boxes point at it via cadence
# relay_url once it's verified up (option-a cutover window). Stock n0 relay image, pinned to iroh 1.0.2.
cadenceRelay:
  enabled: true
  image:
    repository: n0computer/iroh-relay
    tag: "v1.0.2"
  # hostname defaults to cadence-relay.{global.domain}; tls via letsencrypt-mycure-cloudflare-prod (DNS-01).

# ===== cadence — iroh 1.0 P2P transport + registry (cadence v2 foundation) =====
# The anchor node; reachability is provided by the infra udpGateway LB above (not an
# app-owned Service). Image is on the cadence 2.x line (cadence = cadence v2).
# cadence — cadence v2 data-plane HUB (isolated cadence_v2 DB rehearsal). Full chart: run --config, enroll
# initContainer, API service + HTTPRoute (cadence.preprod…), reachable for direct QUIC via udp-gateway.
cadence:
  enabled: true
  rustLog: "cadence=info,cadence_routing=debug,warn"
  image:
    repository: ghcr.io/mycurelabs/cadence
    tag: "2.1.46" # pair-aligned with the maestroapp 2.1.46 fleet release (mono#3109); code-identical to 2.1.42 sparse-at-scale liveness (mono#3099). LOCKSTEP WIRE (keepalives): boxes must run ≥2.1.42
    pullPolicy: Always # tag was mutated once; Always avoids stale node cache
  udpPort: 6472
  # udp-gateway LB IP — the anchor advertises this so peers connect by EndpointId alone.
  publicAddr: "165.245.145.61:6472"
  # CUTOVER: anchor homes on our relay (QUIC-addr-disc lets netcheck rank it) + advertises it in the doc.
  # All boxes are being moved to maestroapp 2.0.28 (our-relay-only) in the same window.
  relayUrl: "https://cadence-relay.preprod.localfirsthealth.com"
  nodePool: "staging"
  # Scrape the OpenMetrics /metrics endpoint into Prometheus (reconcile timing/throughput, connect
  # failures, schema drift, reconcile_active, RSS, dirty_depth) — #2727 observability.
  serviceMonitor:
    enabled: true
  # Integrated model (promote cadence to be preprod's cadence, #2727): watch the LIVE hapihub app DB
  # instead of the isolated cadence_v2 seed, so live cloud writes capture + sync to boxes (matches prod's
  # legacy cadence, which watches hapihub). cadence installs cadence_* side-tables + capture triggers on the
  # live tables at startup and baselines existing rows.
  postgresql:
    auth:
      database: hapihub
  gateway:
    # The preprod wildcard listener (*.preprod.localfirsthealth.com) on the shared gateway.
    sectionName: https-preprod-lfh
    # Re-domained to cadence.preprod (#2727), reclaiming the domain freed by retiring cadence v1.
    # Cutover complete — boxes discover the hub via cadence.preprod (single-URL onboarding, from the AS
    # metadata's cadence_seed_url); the legacy cadence.preprod hostname is dropped.
    hostnames:
      - cadence.preprod.localfirsthealth.com
  # hapihub is the SOLE AS (#2727) — it mints both box grants AND the hub's own '*' grant. Env-driven (not
  # baked into the verbatim cadence.yaml). The enroll initContainer authorizes '*' against hapihub with a
  # non-expiring service-account API key (--bearer); runtime verification is against hapihub's JWKS.
  auth:
    issuerUrl: https://hapihub.preprod.localfirsthealth.com
    grantJwksUri: https://hapihub.preprod.localfirsthealth.com/.well-known/jwks.json
    fleetId: mycure-preprod
    # hapihub advertises a browser authorization_endpoint (RFC 8252 SPA) for boxes; the headless hub
    # authorizes against the programmatic route instead (CADENCE_AUTH_AUTHORIZE_URL).
    authorizeUrl: https://hapihub.preprod.localfirsthealth.com/sync/authorize
  # Service-account API key (better-auth, service@mycure.md, non-expiring) → secret cadence-secrets. The hub
  # presents it as --bearer to authorize its '*' grant. hapihub then mints with a coherent status_list.
  externalSecrets:
    enabled: true
    secretStore: gcp-secretstore
    secretStoreKind: ClusterSecretStore
    refreshInterval: 1h
    secrets:
      - secretKey: sa-api-key
        remoteKey: mycure-preprod-cadence-sa-api-key

# cadence issuer RETIRED (#2727): hapihub is the sole AS + minter. The hub enrolls its own '*' grant
# against hapihub with a service-account API key (see the enroll initContainer). No standalone issuer.
