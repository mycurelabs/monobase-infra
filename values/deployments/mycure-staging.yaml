# Staging overlay over values/deployments/_base/mycure.yaml (helm merge:
# base first, this file wins per key; arrays replace wholesale).
# MyCure Staging Configuration
# LEAN staging env on a LOCAL k3d cluster. Unlike preprod (a cloud DOKS
# HA prod-rehearsal), staging is a minimal single-node dev/QA target:
# standalone Postgres, small PVCs, no read-plane split, no medical-AI stack,
# no cadence. GCP secrets are still REUSED from mycure-production (same as
# preprod) so any prod-cloned data remains decryptable — the mailpit/host
# overrides keep it side-effect-free. Tear down with `k3d cluster delete`.

global:
  # provisional; tailnet-only exposure + final hostnames resolved at Checkpoint 4
  domain: staging.localfirsthealth.com
  namespace: mycure-staging
  environment: staging

  # no nodePool: k3d nodes are untainted

  # Point the database-secrets chart at the mycure-production-* GCP keys so
  # Postgres/Minio/Valkey K8s secrets carry prod credentials. Required for
  # any Velero-restored PVCs (their bitnami init state is keyed to prod passwords).
  secretPrefix: "mycure-production"

# Strict gateway ingress canary (preprod-first): drops the baseline's blanket
# nginx-gateway-system → all-pods allow; apps rely on their own port-scoped
# gateway rules.
securityBaseline:
  strictGatewayIngress: true

mycure-dashboard:
  resources:
    requests:
      cpu: 50m
  gateway:
    sectionName: https-staging-lfh

  config:
    API_URL: "https://hapihub.staging.localfirsthealth.com"

mycure-pxp:
  resources:
    requests:
      cpu: 50m
  gateway:
    sectionName: https-staging-lfh

  config:
    API_URL: "https://hapihub.staging.localfirsthealth.com"

hapihub:
  # Keep the same image tag as the preprod copy.
  image:
    tag: "11.20.115"
  cache:
    enabled: true

  serviceMonitor:
    enabled: true
  pruneAuditEvents:
    enabled: true

  # single replica, no HPA
  replicaCount: 1

  resources:
    requests:
      memory: 768Mi
    limits:
      memory: 2Gi

  gateway:
    hostnames:
    - hapihub.staging.localfirsthealth.com
    sectionName: https-staging-hapihub  # anti-coalescing exact listener, pairs with mycure block
    # No mycure.md hostnames in staging — we only route *.staging.localfirsthealth.com.
  betterAuth:
    passkey:
      rpName: "Mycure (staging)"
      rpId: "staging.localfirsthealth.com"

  config:
    CORS_ORIGINS: "https://hapihub.staging.localfirsthealth.com,https://mycure.staging.localfirsthealth.com,https://mycure-dashboard.staging.localfirsthealth.com,https://mycure-pxp.staging.localfirsthealth.com,https://mycure-pr--*.web.app"
    # Medical-AI stack (medgemma-worker + openmed + medley) is DISABLED in staging.
  env:
  - name: BETTER_AUTH_RATE_LIMIT_ENABLED
    value: "true"
  - name: BETTER_AUTH_RATE_LIMIT_WINDOW
    value: "60"
  - name: BETTER_AUTH_RATE_LIMIT_MAX
    value: "300"
  - name: BETTER_AUTH_SESSION_COOKIE_CACHE_ENABLED
    value: "false"

  autoscaling:
    enabled: false

  # Secrets REUSE the existing mycure-production-* GCP keys (same rationale as
  # preprod: prod-cloned data must stay decryptable — ENC_* keys byte-identical).
  externalSecrets:
    secrets:
      # Google OAuth
    - secretKey: GOOGLE_CLIENT_ID
      remoteKey: mycure-preprod-google-oauth-client-id
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteKey: mycure-preprod-google-oauth-client-secret
    - secretKey: STRIPE_SECRET_KEY
      remoteKey: mycure-preprod-stripe-secret-key
      # Encryption keys
    - secretKey: ENC_BILLING_INVOICES
      remoteKey: mycure-production-enc-billing-invoices
    - secretKey: ENC_BILLING_ITEMS
      remoteKey: mycure-production-enc-billing-items
    - secretKey: ENC_BILLING_PAYMENTS
      remoteKey: mycure-production-enc-billing-payments
    - secretKey: ENC_MEDICAL_RECORDS
      remoteKey: mycure-production-enc-medical-records
    - secretKey: ENC_PERSONAL_DETAILS
      remoteKey: mycure-production-enc-personal-details
      # JWT/Auth keys
    - secretKey: PRIVATE_KEY
      remoteKey: mycure-production-private-key
    - secretKey: PUBLIC_KEY
      remoteKey: mycure-production-public-key
      # Storage configuration (GCP)
    - secretKey: STORAGE_BUCKET
      remoteKey: mycure-production-storage-bucket
    - secretKey: STORAGE_CLIENT_EMAIL
      remoteKey: mycure-production-storage-client-email
    - secretKey: STORAGE_DIRECTORY
      remoteKey: mycure-production-storage-directory
    - secretKey: STORAGE_PRIVATE_KEY
      remoteKey: mycure-production-storage-private-key
    - secretKey: STORAGE_PROJECT_ID
      remoteKey: mycure-production-storage-project-id
    - secretKey: STORAGE_TYPE
      remoteKey: mycure-production-storage-type
      # Stripe configuration
    - secretKey: STRIPE_KEY
      remoteKey: mycure-preprod-stripe-key
    - secretKey: STRIPE_CHECKOUT_SUCCESS_URL
      remoteKey: mycure-production-stripe-checkout-success-url
    - secretKey: STRIPE_CHECKOUT_CANCEL_URL
      remoteKey: mycure-production-stripe-checkout-cancel-url
    - secretKey: AUTH_SECRET
      remoteKey: mycure-production-auth-secret
    - secretKey: BETTER_AUTH_SECRET
      remoteKey: mycure-production-better-auth-secret

  postgresql:
    serviceName: postgresql-primary
mycure:
  image:
    tag: "10.25.130"
  resources:
    requests:
      cpu: 50m
  gateway:
    sectionName: https-staging-mycure  # anti-coalescing exact listener (exact-name cert kills HTTP/2 cross-host reuse -> 421s)

  config:
    API_URL: "https://hapihub.staging.localfirsthealth.com"
    HAPIHUB_URL: "https://hapihub.staging.localfirsthealth.com"

mycurelocal:
  enabled: false

mycure-myaccount:
  enabled: false

hapihub-docs:
  enabled: false

nocodb:
  enabled: false

# ===== MEDICAL AI: disabled wholesale in staging =====
medley:
  enabled: false  # no medical-AI stack in lean staging

medleyapp:
  enabled: false  # no medical-AI stack in lean staging

medgemmaWorker:
  enabled: false  # no medical-AI stack in lean staging

openmed:
  enabled: false  # no medical-AI stack in lean staging

# ===== DATABASE: PostgreSQL =====
# Standalone (single instance), lean: no read replica, small PVC. k3d local.
postgresql:
  architecture: standalone

  primary:
    # max_connections=100 is enough for hapihub without the cadence watcher fan-out.
    extendedConfiguration: |
      shared_preload_libraries = 'pgaudit, pg_stat_statements'
      max_connections = 100
    persistence:
      size: 8Gi
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 8Gi

  podDisruptionBudget:
    enabled: false

# ===== CACHE: Valkey (Redis) =====
valkey:
  master:
    persistence:
      size: 4Gi
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 500m
        memory: 2Gi

# ===== STORAGE: MinIO Object Storage =====
minio:
  enabled: true

  gateway:
    sectionName: https-staging-lfh

  # WORM 6-year audit cold-archive is OFF in lean staging.
  auditArchive:
    enabled: false
mailpit:
  enabled: true

  gateway:
    # Public web UI route is intentionally exposed with NO auth (testing convenience).
    hostname: "mail.staging.localfirsthealth.com"

# ===== BACKUP / SYNC: cadence stack disabled in lean staging =====
cadenceRelay:
  enabled: false

cadence:
  enabled: false
