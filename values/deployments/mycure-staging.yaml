# Staging overlay; extends: base (values/deployments/base.yaml, helm merge:
# base first, this file wins per key; arrays replace wholesale).
# MyCure Staging Configuration
# LEAN staging env on a LOCAL k3d cluster. Unlike preprod (a cloud DOKS
# HA prod-rehearsal), staging is a minimal single-node dev/QA target:
# standalone Postgres, small PVCs, no read-plane split, no medical-AI stack,
# no cadence. Staging uses its OWN mycure-staging-* GCP secrets (NOT prod's):
# internal ones (encryption keys, auth, DB/cache/storage) generated fresh;
# external integrations (Google OAuth, Stripe, GCS storage) stubbed until real
# staging values are provisioned. Tear down with `k3d cluster delete`.
#
# EASYJOEY ON STAGING (owner decision 2026-10-12; the preprod plan is cancelled):
# staging runs monobase-mycure `feat/easyjoey` (environment/staging -> feat/easyjoey;
# the staging lane still bumps hapihub.image.tag on this branch). The single `cadence:`
# hub below is REPURPOSED as the EasyJoey cloud anchor (ALPN easyjoey/1, fleet
# easyjoey-staging, registered client easyjoey-native, finite clinic scopes) — it no
# longer serves MYCURE boxes (fleet mycure-staging / ALPN hapihub/2), which lose sync
# here; accepted. The three EasyJoey frontends (easyjoey, easyjoey-website,
# easyjoey-accounts) run from the app chart. Staging may be wiped/replaced freely.

extends: base
global:
  # provisional; tailnet-only exposure + final hostnames resolved at Checkpoint 4
  domain: staging.localfirsthealth.com
  namespace: mycure-staging
  environment: staging
  # no nodePool: k3d nodes are untainted

  # database-secrets chart reads the mycure-staging-* GCP keys (staging's own,
  # freshly generated) for the Postgres/Minio/Valkey K8s secrets.
  secretPrefix: "mycure-staging"
# Strict gateway ingress canary (preprod-first): drops the baseline's blanket
# nginx-gateway-system → all-pods allow; apps rely on their own port-scoped
# gateway rules.
securityBaseline:
  strictGatewayIngress: true
mycure-dashboard:
  image:
    tag: "0.14.24"
  resources:
    requests:
      cpu: 50m
  gateway:
    sectionName: https-staging-lfh
  config:
    API_URL: "https://hapihub.staging.localfirsthealth.com"
mycure-pxp:
  resources:
    requests:
      cpu: 50m
  gateway:
    sectionName: https-staging-lfh
  config:
    API_URL: "https://hapihub.staging.localfirsthealth.com"
hapihub:
  # Keep the same image tag as the preprod copy.
  image:
    tag: "11.20.135-staging.ff2a601"
  cache:
    enabled: true
  # Stripe webhooks for EasyJoey payments (monobase-mycure #4955/#4967). Staging is
  # tailnet-only, so Stripe reaches ONLY this path through a Tailscale Funnel:
  # https://easyjoey-stripe-staging.tail06ec7f.ts.net/billing/webhooks/stripe
  # Everything else stays tailnet-only; Stripe's signing secret authenticates calls.
  publicWebhook:
    enabled: true
    hostname: easyjoey-stripe-staging
    paths:
      - /billing/webhooks/stripe
  # Base allows only the nginx gateway; the Funnel proxy runs in the tailscale
  # namespace, so it is allowed too (lists replace, so base's rule is restated).
  networkPolicy:
    enabled: true
    policyTypes:
      - Ingress
      - Egress
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: nginx-gateway-system
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: tailscale
        ports:
          - protocol: TCP
            port: 7500
    # Outbound HTTPS to the internet (owner-approved 2026-10-12). Staging's
    # security baseline denies all egress (default-deny-egress); hapihub needs
    # Stripe (EasyJoey checkout, billing-provider setup) and other third-party
    # APIs. Same rule as openmed: TCP 443 only.
    egress:
      - to:
          - ipBlock:
              cidr: 0.0.0.0/0
        ports:
          - protocol: TCP
            port: 443
  # no Prometheus Operator on this lean k3d cluster (monitoring disabled)
  serviceMonitor:
    enabled: false
  pruneAuditEvents:
    enabled: true
  # single replica, no HPA
  replicaCount: 1
  resources:
    requests:
      memory: 768Mi
    limits:
      memory: 2Gi
  gateway:
    hostnames:
      - hapihub.staging.localfirsthealth.com
    sectionName: https-staging-hapihub # anti-coalescing exact listener, pairs with mycure block
    # No mycure.md hostnames in staging — we only route *.staging.localfirsthealth.com.
  betterAuth:
    passkey:
      rpName: "Mycure (staging)"
      rpId: "staging.localfirsthealth.com"
  config:
    # + EasyJoey: the three frontends below and the Tauri shells (iOS/macOS webview origins).
    CORS_ORIGINS: "https://hapihub.staging.localfirsthealth.com,https://mycure.staging.localfirsthealth.com,https://mycure-dashboard.staging.localfirsthealth.com,https://mycure-pxp.staging.localfirsthealth.com,https://medleyapp.staging.localfirsthealth.com,https://mycure-pr--*.web.app,https://easyjoey.staging.localfirsthealth.com,https://easyjoey-website.staging.localfirsthealth.com,https://easyjoey-accounts.staging.localfirsthealth.com,tauri://localhost,http://tauri.localhost"
    # ---- EasyJoey (services/hapihub/docs/modules/sync.md "Cadence AS client profiles") ----
    # Registered client `easyjoey-native`: its own audience (must start with `easyjoey-`
    # and differ from CADENCE_ISSUER_FLEET_ID, else the profile is disabled) — unset, the
    # discovery doc advertises the PRODUCTION defaults (easyjoey-production +
    # https://cadence.localfirsthealth.com). Seed = the cadence hub below (its
    # HTTPRoute host; QUIC on cadence.publicAddr). ONE engine on this DB, metadata in
    # `public`, so /sync/scopes reads public.cadence_scope for EasyJoey grants too.
    EASYJOEY_CADENCE_FLEET_ID: "easyjoey-staging"
    EASYJOEY_CADENCE_SEED_URL: "https://cadence.staging.localfirsthealth.com"
    EASYJOEY_CADENCE_METADATA_SCHEMA: "public"
    # EasyJoey daily backups (#4956): encrypted device snapshots in their own bucket on
    # the in-cluster MinIO (same creds as STORAGE_S3_*). Devices PUT/GET pre-signed URLs,
    # so they are signed against MinIO's tailnet route (charts/minio-httproute, host
    # storage.<domain>), not the in-cluster endpoint. BACKUPS_MASTER_KEY (secret) is
    # wired in env + externalSecrets below; unset = backups answer 503.
    BACKUPS_BUCKET: "easyjoey-backups-staging"
    BACKUPS_PUBLIC_ENDPOINT: "https://storage.staging.localfirsthealth.com"
    # Pin the file bucket: the chart derives STORAGE_BUCKET from minio.defaultBuckets,
    # which now also lists the backups bucket (config wins after the env dedupe).
    STORAGE_BUCKET: "monobase-files"
    # Medical-AI stack (medgemma-worker + openmed + medley) is ENABLED (preprod parity).
  env:
    - name: BETTER_AUTH_RATE_LIMIT_ENABLED
      value: "true"
    - name: BETTER_AUTH_RATE_LIMIT_WINDOW
      value: "60"
    - name: BETTER_AUTH_RATE_LIMIT_MAX
      value: "300"
    - name: BETTER_AUTH_SESSION_COOKIE_CACHE_ENABLED
      value: "false"
    # cadence OAuth Authorization Server (#2727): hapihub mints box grants with the
    # EdDSA CADENCE_ISSUER_KEY (PEM from the externalSecret below); the hub verifies
    # them against hapihub's JWKS. Same iss/kid used for mint + JWKS = self-consistent.
    - name: CADENCE_ISSUER_ISS
      value: "cadence-staging-issuer"
    - name: CADENCE_ISSUER_KID
      value: "k1"
    - name: CADENCE_ISSUER_FLEET_ID
      value: "mycure-staging"
    - name: CADENCE_ISSUER_AUTHORIZE_URL
      value: "https://mycure.staging.localfirsthealth.com/oauth/authorize"
    - name: CADENCE_ISSUER_SEED_URL
      value: "https://cadence.staging.localfirsthealth.com"
    - name: CADENCE_ISSUER_DEVICE_VERIFICATION_URI
      value: "https://mycure.staging.localfirsthealth.com/oauth/device"
    # EasyJoey backups master key (32 bytes, hex or base64) — wraps each clinic's
    # backup key. The chart maps only a fixed list of secret keys to env, so it is
    # wired here from the hapihub-secrets ExternalSecret (key synced below).
    # optional: a missing key disables backups (503) instead of blocking the pod.
    - name: BACKUPS_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: hapihub-secrets
          key: BACKUPS_MASTER_KEY
          optional: true
  autoscaling:
    enabled: false
  # Staging's own mycure-staging-* GCP keys. ENC_*/PRIVATE_KEY/PUBLIC_KEY/
  # AUTH_SECRET/BETTER_AUTH_SECRET are generated fresh; GOOGLE_*/STRIPE_*/
  # STORAGE_* are stubbed placeholders until real staging integrations exist.
  externalSecrets:
    secrets:
      # Google OAuth
      - secretKey: GOOGLE_CLIENT_ID
        remoteKey: mycure-staging-google-oauth-client-id
      - secretKey: GOOGLE_CLIENT_SECRET
        remoteKey: mycure-staging-google-oauth-client-secret
      - secretKey: STRIPE_SECRET_KEY
        remoteKey: mycure-staging-stripe-secret-key
        # Encryption keys
      - secretKey: ENC_BILLING_INVOICES
        remoteKey: mycure-staging-enc-billing-invoices
      - secretKey: ENC_BILLING_ITEMS
        remoteKey: mycure-staging-enc-billing-items
      - secretKey: ENC_BILLING_PAYMENTS
        remoteKey: mycure-staging-enc-billing-payments
      - secretKey: ENC_MEDICAL_RECORDS
        remoteKey: mycure-staging-enc-medical-records
      - secretKey: ENC_PERSONAL_DETAILS
        remoteKey: mycure-staging-enc-personal-details
        # JWT/Auth keys
      - secretKey: PRIVATE_KEY
        remoteKey: mycure-staging-private-key
      - secretKey: PUBLIC_KEY
        remoteKey: mycure-staging-public-key
        # Storage configuration (GCP)
      - secretKey: STORAGE_BUCKET
        remoteKey: mycure-staging-storage-bucket
      - secretKey: STORAGE_CLIENT_EMAIL
        remoteKey: mycure-staging-storage-client-email
      - secretKey: STORAGE_DIRECTORY
        remoteKey: mycure-staging-storage-directory
      - secretKey: STORAGE_PRIVATE_KEY
        remoteKey: mycure-staging-storage-private-key
      - secretKey: STORAGE_PROJECT_ID
        remoteKey: mycure-staging-storage-project-id
      - secretKey: STORAGE_TYPE
        remoteKey: mycure-staging-storage-type
        # Stripe configuration
      - secretKey: STRIPE_KEY
        remoteKey: mycure-staging-stripe-key
      - secretKey: STRIPE_CHECKOUT_SUCCESS_URL
        remoteKey: mycure-staging-stripe-checkout-success-url
      - secretKey: STRIPE_CHECKOUT_CANCEL_URL
        remoteKey: mycure-staging-stripe-checkout-cancel-url
      - secretKey: AUTH_SECRET
        remoteKey: mycure-staging-auth-secret
      - secretKey: BETTER_AUTH_SECRET
        remoteKey: mycure-staging-better-auth-secret
      # cadence OAuth AS signing key (#2727) — EdDSA private key, PEM-encoded
      # (single-line, \n-escaped; hapihub un-escapes). Generated for staging.
      - secretKey: CADENCE_ISSUER_KEY
        remoteKey: mycure-staging-cadence-issuer-key-pem
      # EasyJoey backups master key (#4956). CREATE the GCP secret BEFORE this
      # reaches the cluster: a missing remote key fails the WHOLE hapihub-secrets
      # ExternalSecret sync (SecretSyncedError; ESO keeps the last-synced Secret).
      - secretKey: BACKUPS_MASTER_KEY
        remoteKey: mycure-staging-easyjoey-backups-master-key
  postgresql:
    # HA replication renames the writer service to postgresql-primary (the read
    # replica is postgresql-read). hapihub writes to the primary.
    serviceName: postgresql-primary
mycure:
  image:
    tag: "10.25.133-staging.b6e2577"
  resources:
    requests:
      cpu: 50m
  gateway:
    sectionName: https-staging-mycure # anti-coalescing exact listener (exact-name cert kills HTTP/2 cross-host reuse -> 421s)
  config:
    API_URL: "https://hapihub.staging.localfirsthealth.com"
    HAPIHUB_URL: "https://hapihub.staging.localfirsthealth.com"
mycurelocal:
  enabled: false
mycure-myaccount:
  enabled: false
hapihub-docs:
  enabled: false
nocodb:
  enabled: false
# ===== EASYJOEY: static web frontends (owner decision 2026-10-12) =====
# Images from monobase-mycure .github/workflows/easyjoey-web-release.yml (run
# 38160087617, staging target), tag <package version>-staging.<git sha>. Static
# Caddy on :8080; they only call hapihub from the browser. Ride the *.staging
# wildcard listener/cert (https-staging-lfh); external-dns publishes each host
# (tailnet-only, like the rest of staging). easyjoey-website + easyjoey-accounts bake
# their URLs at build time; only the web app reads a runtime /config.json. All three
# origins are in hapihub CORS_ORIGINS above.
# !! The ghcr.io packages are PRIVATE at the time of this change and this cluster
# has no ghcr pull secret: the pods ImagePullBackOff until the packages are made
# public (owner action) or an imagePullSecrets entry is added here.
easyjoey:
  enabled: true
  image:
    tag: "0.2.0-staging.102d596"
  resources:
    requests:
      cpu: 10m
  gateway:
    hostname: "easyjoey.staging.localfirsthealth.com"
    sectionName: https-staging-lfh
  # Runtime override written to /config.json by the image entrypoint.
  config:
    API_URL: "https://hapihub.staging.localfirsthealth.com"
    HAPIHUB_URL: "https://hapihub.staging.localfirsthealth.com"
easyjoeyWebsite:
  enabled: true
  image:
    tag: "0.1.0-staging.102d596"
  resources:
    requests:
      cpu: 10m
  gateway:
    hostname: "easyjoey-website.staging.localfirsthealth.com"
    sectionName: https-staging-lfh
easyjoeyAccounts:
  enabled: true
  image:
    tag: "0.1.0-staging.102d596"
  resources:
    requests:
      cpu: 10m
  gateway:
    hostname: "easyjoey-accounts.staging.localfirsthealth.com"
    sectionName: https-staging-lfh
# ===== MEDICAL AI: full parity with preprod (mirrored) =====
# Ollama runs on the vanaheim HOST — the AI services reach it via host.k3d.internal
# (k3d's host gateway) instead of preprod's ollama.tailscale.svc egress (ollamaEgress
# stays off here). Otherwise a value-for-value mirror of mycure-preprod.
# medley 2.x test setup moved to PREPROD (monobase-mycure#4150) — see mycure-preprod.yaml.
medley:
  enabled: false
medleyapp:
  enabled: true
  image:
    repository: ghcr.io/mycurelabs/medleyapp
    tag: "0.1.4"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  gateway:
    hostname: "" # defaults to medleyapp.staging.localfirsthealth.com
    sectionName: https-staging-lfh
  config:
    API_URL: "https://hapihub.staging.localfirsthealth.com"
    HAPIHUB_URL: "https://hapihub.staging.localfirsthealth.com"
  podDisruptionBudget:
    enabled: false
medgemmaWorker:
  enabled: true
  image:
    repository: ghcr.io/mycurelabs/medgemma-worker
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  gateway:
    enabled: false # ClusterIP only
  config:
    OLLAMA_URL: "http://host.k3d.internal:11434"
    MEDGEMMA_MODEL: "hf.co/unsloth/medgemma-4b-it-GGUF:Q4_K_M"
  podDisruptionBudget:
    enabled: false
openmed:
  enabled: true
  image:
    repository: ghcr.io/mycurelabs/openmed
    tag: "0.1.3"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 2Gi
  gateway:
    enabled: false # ClusterIP only
  config:
    OPENMED_PRELOAD: "disease,pharma"
    PYTHONUNBUFFERED: "1"
  # HuggingFace model preload takes minutes — generous liveness grace so it isn't
  # killed mid-load (mirrors preprod).
  livenessProbe:
    enabled: true
    initialDelaySeconds: 600
    periodSeconds: 15
    failureThreshold: 4
  persistence:
    enabled: true
    size: 3Gi
    storageClassName: local-path # k3d CSI (preprod uses do-block-storage)
  podDisruptionBudget:
    enabled: false
# ===== DATABASE: PostgreSQL (HA — 1 primary + 1 read replica) =====
# Replication for prod parity: the cadence hub's reconcile/serve scan plane reads
# from the replica (CADENCE_DB_READ_URL). Switched on LIVE on 2026-09-04 (see
# monobase-infra#407) — the seeded staging data lives on `data-postgresql-primary-0`;
# keep the topology so a sync does not flip the StatefulSet back to `postgresql` and
# boot hapihub against the old, empty `data-postgresql-0` volume. Lean sizing
# (8Gi PVCs, k3d local-path) — NOT preprod's 215Gi/walg. walg stays OFF.
postgresql:
  architecture: replication
  auth:
    replicationUsername: repl_user
    secretKeys:
      replicationPasswordKey: postgres-replication-password
  primary:
    # 300 (not 100): cadence boot opens ~99 per-collection ensure connections
    # simultaneously on top of hapihub. max_slot_wal_keep_size caps slot-retained
    # WAL so a dead replica can't fill the primary's small volume.
    extendedConfiguration: |
      shared_preload_libraries = 'pgaudit, pg_stat_statements'
      max_connections = 300
      max_slot_wal_keep_size = 4GB
    persistence:
      size: 8Gi
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 8Gi
  readReplicas:
    replicaCount: 1
    persistence:
      enabled: true
      storageClass: "" # k3d default (local-path)
      size: 8Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    extendedConfiguration: |
      shared_preload_libraries = 'pgaudit, pg_stat_statements'
      max_connections = 300
      primary_slot_name = 'pg_read_replica'
      hot_standby_feedback = on
      max_standby_streaming_delay = 120s
    # Gate liveness during the initial pg_basebackup clone (small here, but keep a
    # grace so the probe can't SIGKILL mid-clone).
    customStartupProbe:
      exec:
        command:
          - /bin/sh
          - -c
          - exec pg_isready -U postgres -d dbname=hapihub -h 127.0.0.1 -p 5432
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 60
      successThreshold: 1
  podDisruptionBudget:
    enabled: false
# ===== CACHE: Valkey (Redis) =====
valkey:
  master:
    persistence:
      size: 4Gi
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 500m
        memory: 2Gi
# ===== STORAGE: MinIO Object Storage =====
minio:
  enabled: true
  gateway:
    sectionName: https-staging-lfh
  # Bitnami MINIO_DEFAULT_BUCKETS (comma-separated STRING): the base file bucket +
  # the EasyJoey backups bucket (hapihub BACKUPS_BUCKET). hapihub also creates the
  # bucket lazily on the first presign, so this is belt-and-braces; changing it
  # restarts the MinIO pod. hapihub pins STORAGE_BUCKET=monobase-files in config.
  defaultBuckets: "monobase-files,easyjoey-backups-staging"
  # WORM 6-year audit cold-archive is OFF in lean staging.
  auditArchive:
    enabled: false
mailpit:
  enabled: true
  gateway:
    # Public web UI route is intentionally exposed with NO auth (testing convenience).
    hostname: "mail.staging.localfirsthealth.com"
# ===== BACKUP / SYNC: cadence stack (mirrored from preprod) =====
cadenceRelay:
  enabled: true
  # no nodePool: k3d nodes are untainted (preprod pins nonprod, which doesn't exist here).
  nodePool: ""
  # ClusterIP on the shared gateway (no own LB). 443 leg via HTTPRoute; QUIC leg via
  # UDPRoute on the relay-quic-staging listener (added to the gateway in this cluster's
  # infrastructure.yaml).
  serviceType: ClusterIP
  gatewayRoute:
    enabled: true
    hostname: cadence-relay.staging.localfirsthealth.com
    sectionName: https-staging-lfh
    udpListener: relay-quic-staging
# ===== P2P SYNC: the staging hub, REPURPOSED as the EasyJoey cloud anchor =====
# Owner decision 2026-10-12. Mirrors the working local EasyJoey dev anchor
# (alpn easyjoey/1, require_responder_grant, require_entitlement easyjoey.cloud,
# retention 35d, a finite clinic-scoped grant from `cadence auth login --client-id
# easyjoey-native`), on staging's hapihub DB (authoritative PostgreSQL, metadata in
# `public` — the ONLY engine on this DB). Sync manifest = charts/cadence/files/
# cadence.yaml with dropUnusedTables, verified identical to monobase-mycure
# feat/easyjoey services/hapihub/cadence.yaml (76 collections) — do NOT add
# staging-only collections, the schema fingerprint must match the devices exactly.
#
# ENROLLMENT (chicken-and-egg): the hub can only enroll clinics that EXIST in the
# easyjoey realm, and none do on a fresh deploy. With auth.enrollScope empty the
# enroll initContainer WAITS (pod stays Init, logs a hint). Operator, once the first
# EasyJoey clinic is created on staging: put its org id(s) in auth.enrollScope
# ("org:<id> org:<id>") on cluster/vanaheim -> ArgoCD rolls the pod -> it enrolls
# (issuer checks each org's realm and adds the fam: topic) -> the hub syncs those
# clinics. Each new clinic = append + commit. The grant is capped at 30 days and not
# refreshed by the hub: restart the cadence Deployment (ArgoCD "Restart") within 30d.
cadence:
  enabled: true
  # No Prometheus Operator on this lean k3d cluster — the ServiceMonitor CRD
  # (monitoring.coreos.com) is absent, so rendering it fails the whole ArgoCD sync.
  serviceMonitor:
    enabled: false
  image:
    # EasyJoey build from monobase-mycure feat/easyjoey (registered-client enroll,
    # require_entitlement + setup window, retain_application_rows_on_eviction).
    # Published by the cadence release run — until then the pod is ImagePullBackOff.
    tag: "2.1.108-easyjoey.1"
  # EasyJoey application protocol (MYCURE is hapihub/2 — the two never cross-talk).
  alpn: "easyjoey/1"
  # staging hapihub (11.20.120) already dropped file_links + organization_partners,
  # so gate those collection entries off or cadence crash-loops (same as preprod).
  # Also = the feat/easyjoey manifest (see above).
  dropUnusedTables: true
  tuning:
    # 35d: tombstones outlive the 30-day backup window (#4956) — dev-anchor parity.
    retentionSecs: 3024000
    # REQUIRED before a finite scope on this authoritative DB: losing the old
    # MYCURE '*' scope (and any later clinic removal) must drop sync metadata only,
    # never the canonical hapihub rows.
    retainApplicationRowsOnEviction: true
  # no nodePool: k3d nodes are untainted (preprod pins nonprod, which doesn't exist here).
  nodePool: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 3Gi
  # Never co-locate with the PG primary (hashing vs PG execution contend for cores).
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/component: primary
          topologyKey: kubernetes.io/hostname
  # <staging gateway tailnet IP>:<cadence-quic-staging port>. NOTE: the gateway IP changes
  # on cluster rebuild — repoint here + the DNS A record if the cluster is nuked.
  publicAddr: "100.124.242.71:6474" # 6473 is preprod's cadence-quic leg on the shared gateway
  # n0 public relays (the self-hosted relay's HTTP-upgrade handshake is broken through the
  # shared gateway — same interim as preprod).
  relayUrl: ""
  postgresql:
    serviceName: postgresql-primary
    # Read-plane split: reconcile/serve scans read from the replica; writes on primary.
    # Staging's postgresql-read replica is not replicating (pg_stat_replication empty on the primary;
    # the replica never replayed and lacks newer tables), so the hub's lazy baseline failed with
    # "relation cadence_fp does not exist". Read from the primary until the replica is repaired
    # (an empty string does not override the base value in the app-of-apps merge, so name the primary).
    readServiceName: postgresql-primary
  gateway:
    sectionName: https-staging-lfh
    udpListener: cadence-quic-staging
    hostnames:
      - cadence.staging.localfirsthealth.com
  # hapihub is the sole authorization server — mints box grants AND the hub's own '*' grant.
  auth:
    issuerUrl: https://hapihub.staging.localfirsthealth.com
    grantJwksUri: https://hapihub.staging.localfirsthealth.com/.well-known/jwks.json
    # = hapihub EASYJOEY_CADENCE_FLEET_ID (the easyjoey-native audience).
    fleetId: easyjoey-staging
    authorizeUrl: https://hapihub.staging.localfirsthealth.com/sync/authorize
    # Registered product client: finite clinic enrollment (no '*'), presented with
    # the trusted service-account key below (membership bypass for the hub).
    clientId: easyjoey-native
    # EMPTY until the first EasyJoey clinic exists on staging — see ENROLLMENT above.
    # Format: "org:<id> org:<id>" (wildcards fail the render).
    # Follow mode (owner request 2026-10-12): the hub enrolls for every EasyJoey-realm clinic hapihub
    # lists to its trusted service key and re-enrolls when a clinic is added or removed, so new
    # signups sync without an infra edit. enrollScope is ignored while followScopes is on.
    enrollScope: ""
    followScopes: true
    followScopesEverySecs: 120
    requireResponderGrant: true
    # Paid cloud-sync gate (#4967): only clinics with EasyJoey Cloud sync here; the
    # download-only setup window (easyjoey.setup) is derived automatically.
    requireEntitlement: easyjoey.cloud
  # Service-account API key (service@mycure.md, non-expiring) minted into hapihub-staging's
  # better-auth by scripts/seed.ts and stored at mycure-staging-cadence-sa-api-key. The key
  # MUST be a trusted sync service account (operator-tagged metadata.serviceAccount: true —
  # hapihub sync/trusted-caller.ts): the easyjoey-native enroll relies on its membership
  # bypass. Re-seed (with that tag) whenever the staging DB is wiped.
  externalSecrets:
    secrets:
      - secretKey: sa-api-key
        remoteKey: mycure-staging-cadence-sa-api-key
