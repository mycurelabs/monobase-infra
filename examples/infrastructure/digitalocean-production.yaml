# Example: DigitalOcean DOKS Production Infrastructure Configuration
# DigitalOcean Kubernetes Service - Production Environment
# Domain: example.com
#
# Mirrors the NGINX Gateway Fabric pattern in values/infrastructure/main.yaml
# (the live DOKS configuration). LoadBalancer customization (DO LB
# annotations, FLIPOP, etc.) is done through NGF's NginxProxy CRD / the
# chart's `nginx.service` values — see
# charts/argocd-infrastructure/templates/nginx-gateway.yaml and
# docs/infrastructure/static-ip-digitalocean.md.

# NGINX Gateway Fabric - Gateway API implementation
nginxGateway:
  enabled: true
  version: "2.4.1"

# NGINX Gateway Resources
nginxGatewayResources:
  gatewayClass:
    enabled: false  # GatewayClass created by operator chart

  gateway:
    name: nginx-shared-gateway
    namespace: nginx-gateway-system
    gatewayClassName: nginx
    listeners:
      - name: https
        port: 443
        protocol: HTTPS
        hostname: "*.example.com"
        tlsSecretName: nginx-gateway-tls
      - name: http
        port: 80
        protocol: HTTP
        hostname: "*.example.com"

  # TLS certificates provisioned by cert-manager
  tls:
    certificates:
      - secretName: nginx-gateway-tls
        clusterIssuer: letsencrypt-prod
        dnsNames:
          - "*.example.com"
