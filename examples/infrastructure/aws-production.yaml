# Example: AWS EKS Production Infrastructure Configuration
# AWS Elastic Kubernetes Service - Production Environment
# Domain: example.com
#
# Mirrors the NGINX Gateway Fabric pattern in values/infrastructure/main.yaml.
# LoadBalancer customization (e.g. EIP allocations via service annotations)
# is done through NGF's NginxProxy CRD / the chart's `nginx.service` values —
# see argocd/infrastructure/templates/nginx-gateway.yaml and
# docs/infrastructure/static-ip-prerequisites.md.

# NGINX Gateway Fabric - Gateway API implementation
nginxGateway:
  enabled: true
  version: "2.4.1"

# NGINX Gateway Resources
nginxGatewayResources:
  gatewayClass:
    enabled: false  # GatewayClass created by operator chart

  gateway:
    name: nginx-shared-gateway
    namespace: nginx-gateway-system
    gatewayClassName: nginx
    listeners:
      - name: https
        port: 443
        protocol: HTTPS
        hostname: "*.example.com"
        tlsSecretName: nginx-gateway-tls
      - name: http
        port: 80
        protocol: HTTP
        hostname: "*.example.com"

  # TLS certificates provisioned by cert-manager
  tls:
    certificates:
      - secretName: nginx-gateway-tls
        clusterIssuer: letsencrypt-prod
        dnsNames:
          - "*.example.com"
