name: security-cspm

# Cloud Security Posture Management (CSPM) — SCHEDULED, not PR CI (#320 item 6).
# Complements, does not duplicate: Falco owns runtime, Trivy config (security.yml)
# owns static IaC. This scans LIVE posture — the running cluster + cloud accounts.
#
# Report-only on FINDINGS (a scanner's findings never fail the build), but LOUD on
# INVOCATION failure: each scan is `|| true` then an assert step `::error::`s and
# fails if the scanner produced no output — so a broken/mis-authed scanner can't
# masquerade as a clean green run (the trap the first cut fell into, #334).
#
# Output is ARTIFACTS, not code-scanning SARIF: neither Kubescape (live cluster)
# nor Prowler (cloud) supports SARIF — it's a local-files-only mode in both. To
# surface findings in the Security tab later, add a JSON/OCSF→SARIF conversion.
#
# Required secrets (add per scanner to activate it; all READ-ONLY):
#   CSPM_KUBECONFIG        base64 of a read-only kubeconfig for the DOKS cluster
#   DIGITALOCEAN_TOKEN     read-only DigitalOcean personal access token
#   GCP_SA_KEY             JSON key of a read-only GCP SA (viewer + securityReviewer)
# AWS/Azure Prowler not wired — no live accounts (modules only).

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cspm
  cancel-in-progress: false

jobs:
  kubescape:
    name: kubescape (cluster CIS/NSA/MITRE)
    runs-on: ubuntu-latest
    env:
      KUBECONFIG_B64: ${{ secrets.CSPM_KUBECONFIG }}
    steps:
      - name: Preflight — skip if no kubeconfig secret
        id: pre
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "::notice::CSPM_KUBECONFIG not set — skipping Kubescape cluster scan"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize kubeconfig
        if: steps.pre.outputs.run == 'true'
        run: |
          umask 077
          echo "$KUBECONFIG_B64" | base64 -d > kubeconfig
          echo "KUBECONFIG=$PWD/kubeconfig" >> "$GITHUB_ENV"

      - name: Install Kubescape
        if: steps.pre.outputs.run == 'true'
        run: curl -sSL https://raw.githubusercontent.com/kubescape/kubescape/master/install.sh | /bin/bash

      - name: Scan cluster (JSON — sarif is local-files-only)
        if: steps.pre.outputs.run == 'true'
        run: |
          export PATH="$PATH:$HOME/.kubescape/bin:/usr/local/bin"
          kubescape scan framework nsa,cis-v1.10,mitre \
            --format json --output kubescape.json || true

      - name: Assert output produced (loud on silent failure)
        if: steps.pre.outputs.run == 'true'
        run: |
          if [ ! -s kubescape.json ]; then
            echo "::error::Kubescape produced no output — invocation/auth failure, see the scan log"
            exit 1
          fi
          echo "::notice::Kubescape report written ($(wc -c < kubescape.json) bytes)"

      - name: Upload report
        if: steps.pre.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kubescape-report
          path: kubescape.json

  scoutsuite-do:
    name: scoutsuite (DigitalOcean account)
    runs-on: ubuntu-latest
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
    steps:
      - name: Preflight — skip if no DO token
        id: pre
        run: |
          if [ -z "$DIGITALOCEAN_TOKEN" ]; then
            echo "::notice::DIGITALOCEAN_TOKEN not set — skipping ScoutSuite DO scan"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.pre.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ScoutSuite
        if: steps.pre.outputs.run == 'true'
        run: pip install scoutsuite # DigitalOcean provider since 5.14.0

      - name: Scan DigitalOcean (provider is `do`, not `digitalocean`)
        if: steps.pre.outputs.run == 'true'
        run: scout do --access-token "$DIGITALOCEAN_TOKEN" --no-browser --report-dir ./scout-report || true

      - name: Assert output produced (loud on silent failure)
        if: steps.pre.outputs.run == 'true'
        run: |
          if [ -z "$(ls -A scout-report 2>/dev/null)" ]; then
            echo "::error::ScoutSuite produced no report — invocation/auth failure, see the scan log"
            exit 1
          fi
          echo "::notice::ScoutSuite DigitalOcean report written"

      - name: Upload report
        if: steps.pre.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scoutsuite-digitalocean-report
          path: scout-report

  prowler-gcp:
    name: prowler (GCP posture)
    runs-on: ubuntu-latest
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - name: Preflight — skip if no GCP SA key
        id: pre
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::notice::GCP_SA_KEY not set — skipping Prowler GCP scan"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize SA key
        if: steps.pre.outputs.run == 'true'
        run: |
          umask 077
          printf '%s' "$GCP_SA_KEY" > gcp-sa.json
          echo "GCP_CREDS=$PWD/gcp-sa.json" >> "$GITHUB_ENV"

      - name: Setup Python
        if: steps.pre.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Prowler
        if: steps.pre.outputs.run == 'true'
        run: pip install prowler

      - name: Scan GCP (sarif is iac-provider-only → csv/json-ocsf/html)
        if: steps.pre.outputs.run == 'true'
        run: prowler gcp --credentials-file "$GCP_CREDS" -M csv json-ocsf html -o prowler-out || true

      - name: Assert output produced (loud on silent failure)
        if: steps.pre.outputs.run == 'true'
        run: |
          if [ -z "$(ls -A prowler-out 2>/dev/null)" ]; then
            echo "::error::Prowler produced no output — invocation/auth failure, see the scan log"
            exit 1
          fi
          echo "::notice::Prowler GCP report written"

      - name: Upload report
        if: steps.pre.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prowler-gcp-report
          path: prowler-out
