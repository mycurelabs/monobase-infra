# Promote the git-pinned maestroapp version to the fleet (mono#4095).
#
# The mono release pipeline publishes desktop artifacts + an immutable
# per-version manifest (…/desktop/<platform>/v<version>/latest.json) but never
# writes the platform-root latest.json the fleet auto-updater and install.sh
# poll. That root manifest is owned exclusively by this workflow: it copies
# v<pin>/latest.json → latest.json for each platform whenever the
# fleet.maestroapp.version pin in a values/deployments/*.yaml changes on main
# (or on manual dispatch), then verifies the store actually serves the pin.
# Rollback = revert the pin commit.
#
# The path trigger fires on EVERY deployments-values change (image bumps etc.);
# runs where the pin is already live no-op green in seconds — expected, not
# noise. The pin lives in the per-environment deployments file so other
# environments can pin their own fleet later; while there is a single artifacts
# store, exactly one file may carry the pin (enforced below).
name: Promote maestroapp fleet version

on:
  push:
    branches: [main]
    paths: [values/deployments/*.yaml]
  workflow_dispatch:

concurrency:
  group: promote-maestroapp
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Promote pin to platform-root latest.json
        env:
          # Dedicated fleet-promoter MinIO user (NOT the CI publisher key):
          # artifacts-promoter may only PutObject the four platform-root
          # latest.json fleet pointers. Provisioned by the minio-artifacts
          # chart (usersExistingSecrets) from the GCP SM secret
          # {prefix}-minio-artifacts-promoter-password — the repo secret holds
          # the same value.
          ARTIFACTS_PROMOTER_ACCESS_KEY_ID: artifacts-promoter
          ARTIFACTS_PROMOTER_PASSWORD: ${{ secrets.ARTIFACTS_PROMOTER_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ARTIFACTS_PROMOTER_PASSWORD" ]; then
            echo "::error::ARTIFACTS_PROMOTER_PASSWORD repo secret is not set (value of the minio-artifacts-promoter-password GCP SM secret)"; exit 1
          fi
          PIN=""; PIN_FILE=""
          for f in values/deployments/*.yaml; do
            v=$(yq -r '.fleet.maestroapp.version // ""' "$f")
            [ -n "$v" ] || continue
            if [ -n "$PIN" ]; then
              echo "::error::both $PIN_FILE and $f pin fleet.maestroapp.version, but there is a single artifacts store — add a per-env host key + workflow support before pinning a second environment"; exit 1
            fi
            PIN="$v"; PIN_FILE="$f"
          done
          if [ -z "$PIN" ]; then
            echo "no fleet.maestroapp.version pin in values/deployments/ — nothing to promote"; exit 0
          fi
          echo "Promoting maestroapp fleet pin v$PIN (from $PIN_FILE)"

          # MINIO_DOMAIN-style host: artifacts.localfirsthealth.com IS the bucket
          # host and the path is the object key — same URL for anonymous reads
          # and SigV4 writes.
          BASE="https://artifacts.localfirsthealth.com/maestroapp/desktop"
          promoted=(); current=(); missing=()
          for dir in linux_x86_64 darwin_aarch64 windows_x86_64; do
            cur=$(curl -fsSL "$BASE/$dir/latest.json" 2>/dev/null | jq -r '.version // empty' || true)
            if [ "$cur" = "$PIN" ]; then
              echo "= $dir already serves v$PIN"; current+=("$dir"); continue
            fi
            if ! curl -fsSL -o "/tmp/$dir.json" "$BASE/$dir/v$PIN/latest.json" 2>/dev/null; then
              echo "! $dir: v$PIN/latest.json not published"; missing+=("$dir"); continue
            fi
            curl -fsS --aws-sigv4 "aws:amz:us-east-1:s3" \
              --user "$ARTIFACTS_PROMOTER_ACCESS_KEY_ID:$ARTIFACTS_PROMOTER_PASSWORD" \
              -H "Content-Type: application/json" \
              --upload-file "/tmp/$dir.json" "$BASE/$dir/latest.json"
            new=$(curl -fsSL "$BASE/$dir/latest.json" | jq -r '.version // empty')
            if [ "$new" != "$PIN" ]; then
              echo "::error::$dir: promoted but store still serves '$new' (want $PIN)"; exit 1
            fi
            echo "✓ $dir promoted to v$PIN"; promoted+=("$dir")
          done

          {
            echo "## maestroapp fleet promote → v$PIN"
            echo "- promoted: ${promoted[*]:-none}"
            echo "- already current: ${current[*]:-none}"
            echo "- missing versioned manifest: ${missing[*]:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

          # A missing platform means either a typo'd pin (all missing, nothing
          # promoted) or a partially-published release (fleet now mixed) —
          # both deserve a red run even though promoted platforms stay live.
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::v$PIN has no versioned manifest for: ${missing[*]}"; exit 1
          fi
