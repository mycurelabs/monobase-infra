---
name: security

# The repo's FIRST CI. Report-only: quality linters (already defined in mise,
# previously local-only) + static security scanning. NOTHING blocks a merge
# (soft-fail / exit-code 0) — there's a findings backlog and deploys stay ArgoCD
# GitOps. Code scanning IS enabled on this repo, so SARIF uploads to the Security
# tab (with an artifact backup, and continue-on-error so a disabled tab can't red
# the run).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"   # nightly full-tree sweep
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Quality gates — the existing mise linters, now in CI (report-only). Cheapest
  # real win: tflint (aws/azurerm/google) + yamllint + shellcheck + helm render +
  # markdownlint. `validate` (6x `terraform init`) is intentionally skipped here
  # to keep CI fast — run `mise run validate` locally.
  # ---------------------------------------------------------------------------
  quality:
    name: quality (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise + pinned tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: tflint --init (install ruleset plugins)
        run: tflint --init --config="${GITHUB_WORKSPACE}/.tflint.hcl"

      - name: mise run lint (report-only)
        continue-on-error: true
        run: mise run lint

  # ---------------------------------------------------------------------------
  # Trivy — IaC misconfiguration (config scan) over Terraform + Helm + K8s.
  # Complements runtime Falco/security-baseline (static only; no in-cluster operator).
  # ---------------------------------------------------------------------------
  trivy-config:
    name: trivy (IaC misconfig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy config scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          hide-progress: "true"

      - name: Trivy config scan (table to job log)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml
          format: table
          exit-code: "0"
          hide-progress: "true"

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-config

      - name: Upload SARIF (artifact backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # OSV-Scanner — dependency vulns for this repo's own bun.lock + TS deps.
  # ---------------------------------------------------------------------------
  osv-scan:
    name: osv-scanner (deps)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: OSV-Scanner (SARIF)
        continue-on-error: true
        uses: google/osv-scanner-action@v2.5.0
        with:
          scan-args: |-
            --recursive
            --skip-git
            --format=sarif
            --output=osv-results.sarif
            ./

      - name: OSV-Scanner (table to job log)
        if: always()
        continue-on-error: true
        uses: google/osv-scanner-action@v2.5.0
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

      - name: Upload SARIF (artifact backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-sarif
          path: osv-results.sarif
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # TruffleHog — secret scanning. This repo is the highest-value secret target
  # (cloud creds, kubeconfigs). --results=verified => only live-confirmed creds.
  # A one-time full-history sweep is run manually out of band (see issue #320).
  # ---------------------------------------------------------------------------
  trufflehog:
    name: trufflehog (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needs history to diff base..head

      - name: TruffleHog (verified, report-only)
        continue-on-error: true
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          extra_args: --results=verified
