{{- if and .Values.cadenceRelay .Values.cadenceRelay.enabled }}
# cadence-relay — self-hosted iroh relay. Gives hard-NAT boxes a fast, controlled relay data-path
# (via cadence's relay_url / RelayMode::custom) instead of n0's far public relay. Own chart so its LB +
# public IP + cert are independent of the anchor deploy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.global.namespace }}-cadence-relay
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    path: charts/cadence-relay
    repoURL: {{ .Values.argocd.repoURL }}
    targetRevision: {{ .Values.argocd.targetRevision | default "main" }}
    helm:
      releaseName: cadence-relay
      valuesObject:
        {{- toYaml .Values.cadenceRelay | nindent 8 }}
        global: {{ .Values.global | toYaml | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.global.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 5m
{{- end }}
