{{- $cfg := index .Values "cadence-legacy" }}
{{- if and $cfg $cfg.enabled }}
# ArgoCD Application: Cadence P2P Sync Engine (LEGACY — retired-in-place)
# Serves the 3 canaries on cadence-legacy.localfirsthealth.com while cadence-v2
# is readied. Frees `charts/cadence`, the `-cadence` app name,
# `cadence.localfirsthealth.com`, AND the `cadence:` values key for v2.
# Config lives under the `cadence-legacy:` key (read via index — hyphenated).
# Sync Wave 3 - Deploy application after database

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.global.namespace }}-cadence-legacy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    path: charts/cadence-legacy
    repoURL: {{ .Values.argocd.repoURL }}
    targetRevision: {{ .Values.argocd.targetRevision | default "main" }}
    helm:
      releaseName: cadence-legacy
      valuesObject:
        {{- $cadenceValues := omit $cfg "postgresql" "valkey" }}
        {{- toYaml $cadenceValues | nindent 8 }}
        global: {{ .Values.global | toYaml | nindent 10 }}
        postgresql: {{ mergeOverwrite (deepCopy .Values.postgresql) ($cfg.postgresql | default dict) | toYaml | nindent 10 }}
        valkey: {{ mergeOverwrite (deepCopy .Values.valkey) ($cfg.valkey | default dict) | toYaml | nindent 10 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.global.namespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 5m
{{- end }}
