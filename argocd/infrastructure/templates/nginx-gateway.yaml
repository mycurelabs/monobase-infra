{{- if .Values.nginxGateway.enabled }}
# ArgoCD Application: NGINX Gateway Fabric
# Sync Wave 0 - Deploy gateway infrastructure (cluster-wide)
# Runs alongside Envoy Gateway — staging proof-of-concept

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    chart: nginx-gateway-fabric
    repoURL: oci://ghcr.io/nginx/charts/nginx-gateway-fabric
    targetRevision: {{ .Values.nginxGateway.version | default "2.4.1" }}
    helm:
      releaseName: nginx-gateway-fabric
      skipCrds: false  # NGINX-specific CRDs (NginxGateway, NginxProxy) required
      valuesObject:
        nginxGateway:
          snippets:
            enable: true
          # UDPRoute/TCPRoute support (cadence QUIC LB consolidation). The
          # experimental-channel CRDs are already installed cluster-wide
          # (udproutes/tcproutes v1alpha2, Prune=false — see the skipCrds
          # cascade note in the Envoy Gateway teardown). UDPRoute itself
          # graduated to Standard in Gateway API v1.6; NGF 2.4.x still gates
          # it behind this flag.
          gwAPIExperimentalFeatures:
            enable: true
          # 2026-08-06 pool restructure: the gateway is the prod request path —
          # it gets the tainted infra pool, away from preprod bursts and the
          # noisy ops jobs (prometheus, velero kopia) that stay on nonprod.
          nodeSelector:
            node-pool: infra
          tolerations:
            - key: node-pool
              operator: Equal
              value: infra
              effect: NoSchedule
        # Data-plane (NginxProxy) sizing.
        # 2026-04-07 incident: data-plane pod was BestEffort QoS with replicas:1
        # and grew to ~1.2Gi resident; the kubelet evicted it under node memory
        # pressure on general-03kot, causing a full *.localfirsthealth.com /
        # *.mycure.md outage (502 Bad Gateway) for ~7 min while the replacement
        # rolled. Fix: requests promote the pod to Burstable so the kubelet
        # evicts other BestEffort workloads first; the limit caps growth so a
        # leak fails fast inside one replica; replicas:2 + anti-affinity keep at
        # least one healthy replica through any single restart/eviction.
        nginx:
          replicas: 2
          container:
            resources:
              requests:
                cpu: 100m
                # 384Mi: restored 2026-08-06 — the TODO below is done; the infra
                # pool nodes are 8Gi (s-2vcpu-8gb-amd), so the constraint that
                # forced 192Mi (3Gi general nodes ≥90% requested) is gone.
                memory: 384Mi
              limits:
                memory: 1Gi
            # njs script delivered by the nginx-njs-security-headers ConfigMap
            # (charts/nginx-gateway/templates/njs-security-headers-cm.yaml).
            # Wired into every server block by the nginx-strip-server-header
            # SnippetsPolicy (values/infrastructure/main.yaml). Closes
            # vapt-2025#10 L-001 by deleting the `Server` response header.
            volumeMounts:
              - name: njs-security-headers
                mountPath: /etc/nginx/njs-security
                readOnly: true
          pod:
            # Data plane follows the control plane onto the tainted infra pool.
            nodeSelector:
              node-pool: infra
            tolerations:
              - key: node-pool
                operator: Equal
                value: infra
                effect: NoSchedule
            # Best-effort spread across hosts. Required anti-affinity is too
            # strict for a 2-node pool during a node roll — ScheduleAnyway lets
            # the scheduler place both on one node as a last resort while
            # preferring spread when capacity exists.
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nginx-shared-gateway-nginx
            volumes:
              - name: njs-security-headers
                configMap:
                  name: nginx-njs-security-headers

  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-gateway-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m
{{- end }}
